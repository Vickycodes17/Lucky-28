name: Build Race x AI Bot APK

# Two files make this app: this workflow, and race-x-ai/index.html (the app
# itself). They are separate because GitHub refuses to start a run for any
# workflow file over 500 KB, and index.html alone is well over that.
#
# Everything else - the Android project, the Java, the Gradle config - is written
# out below, and the icons are generated from the logo already inside index.html.
#
# The app lives in race-x-ai/ so it can share this repo with the Lucky Number
# Tracker at the root without either build picking up the other's index.html.
#
# ── NOTHING SECRET IS IN THIS REPO, BECAUSE THE REPO IS PUBLIC ──
#
# Two values are filled in at build time from repository secrets
# (Settings -> Secrets and variables -> Actions -> New repository secret):
#
#   RXA_SUPABASE_KEY   the cloud-sync key. Without it the build still works,
#                      local-only, exactly as the app behaves offline.
#   RXA_KEYSTORE_B64   the signing key, base64. Without it the APK is signed
#                      with a throwaway key and will NOT install over an app
#                      that is already on a phone - and uninstalling first
#                      deletes every logged race. Set it before installing.
on:
  push:
    paths: [ 'race-x-ai/**', '.github/workflows/race-x-ai.yml' ]
  workflow_dispatch:

permissions:
  contents: write        # needed to publish the shareable release

defaults:
  run:
    working-directory: race-x-ai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify prediction, recovery, and migration invariants
        run: |
          node - <<'RXA_TEST'
          const fs = require('fs'), vm = require('vm');
          const path = ['index.html','Race_x_Ai_bot.html'].find(x => fs.existsSync(x));
          if (!path) throw new Error('index.html is required');
          const html = fs.readFileSync(path, 'utf8');
          global.RXA_HTML_PATH = path;
          for (const id of ['rxa-accuracy-tests','rxa-integration-tests','rxa-road-lab-tests','rxa-pdf-rule-tests','rxa-live-market-tests']) {
            const source = html.match(new RegExp('<script[^>]*id="'+id+'"[^>]*>([\\s\\S]*?)<\\/script>'));
            if (!source) throw new Error('Missing embedded checks: '+id);
            vm.runInThisContext('(function(){\n'+source[1]+'\n})();', { filename: id+'.cjs' });
          }
          RXA_TEST

      - name: Assemble the project
        env:
          RXA_KEYSTORE_B64: ${{ secrets.RXA_KEYSTORE_B64 }}
          RXA_SUPABASE_KEY: ${{ secrets.RXA_SUPABASE_KEY }}
        run: |
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/com/racexai/bot app/src/main/res/values app/src/main/res/xml
          HTML=$(ls index.html Race_x_Ai_bot.html *.html 2>/dev/null | head -1)
          if [ -z "$HTML" ]; then echo "::error::No .html file found in the repo root. Upload index.html alongside this workflow."; exit 1; fi
          echo "Using $HTML as the app"
          cp "$HTML" app/src/main/assets/index.html
          # The cloud key, from the repository secret. A JWT is letters, digits,
          # dots, dashes and underscores only, so it is safe inside this sed.
          if [ -n "$RXA_SUPABASE_KEY" ]; then
            KEY=$(printf '%s' "$RXA_SUPABASE_KEY" | tr -d ' \n\r')
            case "$KEY" in *[!A-Za-z0-9._-]*) echo "::error::RXA_SUPABASE_KEY has characters a key cannot contain"; exit 1;; esac
            sed -i "s|__RXA_SUPABASE_KEY__|$KEY|" app/src/main/assets/index.html
            grep -q "__RXA_SUPABASE_KEY__" app/src/main/assets/index.html \
              && { echo "::error::the cloud key was not written into the app"; exit 1; }
            echo "Cloud sync key written in from the repository secret."
          else
            echo "::warning::No RXA_SUPABASE_KEY secret - this build runs local-only (no cloud sync, no login)."
          fi
          cat > settings.gradle <<'___RXA_EOF___'
          pluginManagement{ repositories{ google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement{ repositories{ google(); mavenCentral() } }
          rootProject.name="RaceXAiBot"
          include ":app"
          ___RXA_EOF___
          cat > build.gradle <<'___RXA_EOF___'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          ___RXA_EOF___
          cat > gradle.properties <<'___RXA_EOF___'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          ___RXA_EOF___
          # ── THE SIGNING KEY ──
          #
          # Gradle's own debug key is different on every runner, and Android
          # refuses to install an update signed by a different key than the app
          # already on the phone - the only way through is to uninstall, and
          # uninstalling takes every logged race with it. One stable key fixes
          # that, and it lives in the RXA_KEYSTORE_B64 repository secret rather
          # than in this file, because this repo is public and anyone holding
          # the key could sign something claiming to be this app.
          if [ -n "$RXA_KEYSTORE_B64" ]; then
            echo "$RXA_KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > racex.keystore
            if [ ! -s racex.keystore ]; then echo "::error::RXA_KEYSTORE_B64 did not decode to a keystore"; exit 1; fi
            echo "Signing with the key from the repository secret."
          else
            echo "::warning::No RXA_KEYSTORE_B64 secret - this APK gets a throwaway key and will NOT install over the app already on your phone. Add the secret before installing; do not uninstall, that deletes your races."
          fi

          # WHICH BUILD IS THIS, AND WHERE DOES A NEWER ONE LIVE.
          #
          # Every "it is still not working" so far has had the same first
          # question underneath it - is the phone even running the build with
          # the fix in it? - and there was no way to answer it from either end.
          # This puts the answer inside the app, next to the address of the
          # place a newer one would be, so the app can check for itself.
          cat > app/src/main/assets/build.json <<___RXA_BUILD___
          {"run": ${GITHUB_RUN_NUMBER:-0},
           "name": "1.${GITHUB_RUN_NUMBER:-0}",
           "built": "$(date -u '+%Y-%m-%d %H:%M UTC')",
           "repo": "${GITHUB_REPOSITORY:-}",
           "apk": "https://github.com/${GITHUB_REPOSITORY:-}/releases/download/latest/RaceXAiBot.apk",
           "page": "https://github.com/${GITHUB_REPOSITORY:-}/releases/latest"}
          ___RXA_BUILD___
          cat app/src/main/assets/build.json

          cat > app/build.gradle <<'___RXA_EOF___'
          plugins { id 'com.android.application' }
          
          // The run number becomes the version, so every build is newer than the
          // last one and Android will install it over the top. It also gives a
          // phone a way to say WHICH build it is running, which up to now was
          // guesswork on both sides of every "is it fixed yet?".
          def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "0") as int
          def buildName = "1." + runNo
          
          android {
              namespace 'com.racexai.bot'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.racexai.bot"
                  minSdk 24
                  targetSdk 34
                  versionCode runNo + 1
                  versionName buildName
                  buildConfigField "String", "RXA_BUILD", "\"" + buildName + "\""
                  buildConfigField "int", "RXA_RUN", runNo + ""
              }
          
              buildFeatures { buildConfig true }
          
              signingConfigs {
                  stable {
                      storeFile file("${rootDir}/racex.keystore")
                      storePassword System.getenv("RXA_KEYSTORE_PASS") ?: "racexaibot"
                      keyAlias      System.getenv("RXA_KEYSTORE_ALIAS") ?: "racexai"
                      keyPassword   System.getenv("RXA_KEYSTORE_PASS") ?: "racexaibot"
                  }
              }
          
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stable
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.stable
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          ___RXA_EOF___
          cat > app/src/main/AndroidManifest.xml <<'___RXA_EOF___'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <!-- Saving a backup to Downloads. On Android 10 and up this goes
                   through MediaStore and needs no permission at all, so the
                   request stops at Android 9 - asking for storage on a modern
                   phone would be a prompt for nothing. -->
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28"/>
          
              <!-- so the app can see which text-to-speech engines are installed -->
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
              </queries>
          
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false">
          
                  <!-- Split screen changes screenLayout and smallestScreenSize. Those were
                       missing from configChanges, so entering split screen counted as a
                       configuration change Android could not hand to the activity - it
                       destroyed and recreated it, which reloaded the WebView and looked
                       like the app restarting. Every config a resizable window can change
                       is now declared, and the orientation is no longer pinned because a
                       fixed orientation is ignored in multi-window anyway. -->
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:resizeableActivity="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|navigation|uiMode|density|fontScale|layoutDirection|locale">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
          
                  <!-- Does nothing but stay alive alongside the task, so that Android
                       calls onTaskRemoved when the app is swiped out of recents. The
                       accessibility service keeps the process running after that, which
                       is why the app could go on talking with no app on screen.
                       stopWithTask=false so the callback actually arrives. -->
                  <service
                      android:name=".TaskWatchService"
                      android:exported="false"
                      android:stopWithTask="false"/>

                  <!-- Reads Chamet's half of the split screen. Restricted by packageNames
                       to the game alone, so it is never handed anything else. -->
                  <service
                      android:name=".WatchService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/watch_config"/>
                  </service>
              </application>
          </manifest>
          ___RXA_EOF___
          cat > app/src/main/res/values/strings.xml <<'___RXA_EOF___'
          <resources>
            <string name="app_name">Race x AI Bot</string>
            <string name="watch_desc">Reads the Lucky Race board in Chamet so the bot can fill in the race, announce the picks and log the winner without being touched.</string>
          </resources>
          ___RXA_EOF___
          cat > app/src/main/res/values/themes.xml <<'___RXA_EOF___'
          <resources>
            <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
              <item name="android:windowBackground">@android:color/black</item>
              <item name="android:statusBarColor">@android:color/black</item>
              <item name="android:navigationBarColor">@android:color/black</item>
            </style>
          </resources>
          ___RXA_EOF___
          cat > app/src/main/res/xml/watch_config.xml <<'___RXA_EOF___'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- notificationTimeout was 300: Android held every event back 300ms before
               delivering it, so each price change reached the reader at least that
               late, and the last one before the close often not until the board had
               already gone. 0 delivers them as they happen. The reader paces itself
               (ReadPacer), so this no longer decides how often the screen is read. -->
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="0"
              android:description="@string/watch_desc" />
          ___RXA_EOF___
          cat > app/src/main/java/com/racexai/bot/MainActivity.java <<'___RXA_EOF___'
          package com.racexai.bot;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.ServiceWorkerClientCompat;
          import androidx.webkit.ServiceWorkerControllerCompat;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewFeature;

          /**
           * Hosts the app in a WebView.
           *
           * Deliberately a plain android.app.Activity on a framework theme. AppCompat was
           * pulling in appcompat plus androidx.activity for nothing but a base class and a
           * file-picker helper, and every extra library is another thing that can fail to
           * resolve at build time. The only library left is androidx.webkit, which is not
           * optional - it provides WebViewAssetLoader, and without that the page has to be
           * loaded from file://, which costs the service worker, the web manifest, and any
           * guarantee that localStorage survives. Logged races live in localStorage.
           */
          public class MainActivity extends Activity {

              private static final String BASE = "https://appassets.androidplatform.net";
              private static final int FILE_PICK = 1001;

              /** So WatchService can reach the page without holding the activity itself. */
              private static WebView sWeb;
              /**
               * False from the moment the task is swiped out of recents until an
               * activity is on screen again. Every call into the page goes through
               * js() below, so one flag closes every route at once - the announcement,
               * the fill, the price updates, all of it.
               */
              private static volatile boolean sTaskAlive = true;
              private static TtsBridge sTts;

              /** Called by TaskWatchService when the app leaves recents. */
              static void appGone() {
                  sTaskAlive = false;
                  // Cut the current sentence rather than letting it finish into an empty
                  // room, and mute the page so nothing queues another. The page keeps
                  // running - it still fills boards, still reads the rank screen, still
                  // logs winners. It just does all of it without a sound.
                  try { if (sTts != null) sTts.stopNow(); } catch (Throwable ignored) { }
                  js("try{window.__rxaAppGone=true;"
                   + "if(typeof syncMute==='function')syncMute();else window.__rxaMute=true;"
                   + "speechSynthesis.cancel();}catch(e){}");
              }

              /** Back on screen: the page may speak again, if its own switch says so. */
              static void appBack() {
                  sTaskAlive = true;
                  js("try{window.__rxaAppGone=false;"
                   + "if(typeof syncMute==='function')syncMute();"
                   + "else window.__rxaMute=false;}catch(e){}");
              }

              /** How many calls into the page were dropped because there was no page. */
              private static volatile int sJsDropped = 0;
              static int jsDropped() { return sJsDropped; }
              static boolean taskAlive() { return sTaskAlive; }

              /** Run a line of JS in the app. Safe to call from any thread, and a no-op
               *  when the activity is not up - the watcher must never crash the service. */
              static void js(final String code) { js(code, null); }

              /**
               * Run a line of JS in the app, optionally with what it returned.
               *
               * The answer matters for the track photographs: the service takes several
               * across a race, and only the app can say whether one was good enough. Being
               * told lets it stop rather than keep photographing a race it has already
               * read - five screenshots per race on a phone that is also running a video
               * call is not free.
               *
               * The callback arrives on the UI thread, with the value JSON-encoded, or
               * "null" if the page could not be reached.
               */
              static void js(final String code, final ValueCallback<String> back) {
                  final WebView w = sWeb;
                  // ── CLOSED MEANS SILENT, NOT DEAF ──
                  //
                  // This used to refuse every call while the task was out of recents,
                  // and that is a bigger hammer than the problem needed. The report was
                  // "I closed the app and it still talks"; the answer to that is to stop
                  // TALKING. Reading the game's Win Rate Rank screen, filling a board and
                  // logging a winner make no sound at all, and refusing them meant the app
                  // quietly stopped recording the game while its watcher sat there reading
                  // it perfectly well.
                  //
                  // It shows up as "the rank table fills on my phone but not in the
                  // emulator", because an emulator is where a task actually gets swiped
                  // away - on a phone the app stays in the other half of the split screen
                  // and the flag is never set at all. The voice is muted at the page and
                  // at the engine instead (see appGone), and everything silent goes on
                  // working.
                  if (w == null) {
                      sJsDropped++;
                      if (back != null) back.onReceiveValue("null");
                      return;
                  }
                  w.post(new Runnable() {
                      @Override public void run() {
                          try { w.evaluateJavascript(code, back); }
                          catch (Exception e) { if (back != null) back.onReceiveValue("null"); }
                      }
                  });
              }

              /**
               * Run a line of JS, but if an earlier call in the same `slot` has not run
               * yet, replace it instead of queueing behind it.
               *
               * For readings that only matter at their newest: the market is read many
               * times a second now, and a page busy drawing for 200ms would otherwise be
               * handed every reading it missed, in order, each one older than the last
               * thing on Chamet's screen. One is ever on its way; it carries the latest.
               * It still runs in its place in the queue, so a board filled before it is
               * always filled before the price that belongs to it arrives.
               */
              private static final java.util.concurrent.ConcurrentHashMap<String, String> sLatest =
                  new java.util.concurrent.ConcurrentHashMap<>();
              private static final java.util.concurrent.ConcurrentHashMap<String, Long> sLatestPosted =
                  new java.util.concurrent.ConcurrentHashMap<>();
              static void jsLatest(final String slot, final String code) {
                  final WebView w = sWeb;
                  if (w == null) { sJsDropped++; return; }
                  final long now = android.os.SystemClock.uptimeMillis();
                  if (sLatest.put(slot, code) != null) {
                      // one already on its way, and it will carry this - unless it was
                      // posted to a page that has since gone and is never going to run
                      Long at = sLatestPosted.get(slot);
                      if (at != null && now - at < 1500) return;
                  }
                  sLatestPosted.put(slot, now);
                  w.post(new Runnable() {
                      @Override public void run() {
                          String c = sLatest.remove(slot);
                          if (c == null) return;
                          try { w.evaluateJavascript(c, null); } catch (Exception ignored) { }
                      }
                  });
              }

              /**
               * Write bytes into Downloads on behalf of the watcher.
               *
               * The service has no Activity of its own, and the picture it wants to save
               * is far too big to hand through the JavaScript bridge as a string. It goes
               * straight to the same writer the backup file uses.
               */
              static String saveBytes(String name, String mime, byte[] data) {
                  MainActivity a = sSelf;
                  if (a == null) return "the app is not open — open it and try again";
                  return TtsBridge.writeToDownloads(a, name, mime, data);
              }

              private static MainActivity sSelf;

              private WebView web;
              private TtsBridge tts;
              private ValueCallback<Uri[]> filePathCallback;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  sWeb = web;
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);                    // the whole app state lives here
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);    // chimes and music start on their own
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .setDomain("appassets.androidplatform.net")
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String url = r.getUrl().toString();
                          if (url.startsWith(BASE)) return false;      // stay inside for our own pages
                          try { startActivity(new Intent(Intent.ACTION_VIEW, r.getUrl())); } catch (Exception ignored) { }
                          return true;
                      }
                      @Override
                      public void onPageFinished(WebView v, String url) {
                          v.evaluateJavascript(Shim.JS, null);   // speechSynthesis + wakeLock
                          v.evaluateJavascript(Auto.JS, null);   // the watcher's way in
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb,
                                                       FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try {
                              startActivityForResult(params.createIntent(), FILE_PICK);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }
                  });

                  // Service worker fetches come off another thread and never reach the
                  // WebViewClient above, so the asset loader has to be wired in here too.
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.SERVICE_WORKER_BASIC_USAGE)) {
                      ServiceWorkerControllerCompat.getInstance().setServiceWorkerClient(
                              new ServiceWorkerClientCompat() {
                                  @Override
                                  public WebResourceResponse shouldInterceptRequest(WebResourceRequest r) {
                                      return loader.shouldInterceptRequest(r.getUrl());
                                  }
                              });
                  }

                  sSelf = this;

                  tts = new TtsBridge(this, web);
                  sTts = tts;   // so the task-removed callback can silence it
                  web.addJavascriptInterface(tts, "AndroidTTS");

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      s.setForceDark(WebSettings.FORCE_DARK_OFF);   // the page is already dark
                  }
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);

                  if (savedInstanceState != null) web.restoreState(savedInstanceState);
                  else web.loadUrl(BASE + "/assets/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_PICK) {
                      if (filePathCallback != null) {
                          Uri[] uris = null;
                          if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                              uris = new Uri[]{ data.getData() };
                          }
                          filePathCallback.onReceiveValue(uris);
                          filePathCallback = null;
                      }
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override protected void onSaveInstanceState(Bundle out) { super.onSaveInstanceState(out); web.saveState(out); }

              /**
               * Declared in configChanges, so Android hands the change here instead of
               * recreating the activity. Nothing needs doing - the WebView reflows itself -
               * but the callback has to exist and must not reload the page, or entering
               * split screen would still look like a restart.
               */
              @Override
              public void onConfigurationChanged(android.content.res.Configuration c) {
                  super.onConfigurationChanged(c);
              }
              @Override protected void onPause() { super.onPause(); web.onPause(); }
              @Override protected void onResume() {
                  super.onResume();
                  // Back on screen, so the app is allowed to speak again. Nothing else
                  // clears this - being merely backgrounded must NOT, because talking
                  // from the background while you sit in a Chamet party is the whole
                  // point of the app.
                  appBack();
                  try { startService(new Intent(this, TaskWatchService.class)); } catch (Throwable ignored) { }
                  web.onResume();
              }

              /**
               * BACK MUST NOT FINISH THIS ACTIVITY.
               *
               * super.onBackPressed() finishes it, and finishing it is what collapses
               * split screen - so one stray back press while Chamet was beside the app
               * tore the pair down and it had to be set up again by hand. That is the
               * whole bug report: back closing split screen instead of staying in it.
               *
               * canGoBack() was never the answer either: this is a single page, so it is
               * false essentially always and every press fell through to the finish.
               *
               * So the page gets first refusal - it closes a sheet, the menu or the
               * outcome dialog, or scrolls to the top - and if it wants none of them the
               * task goes to the BACK, which leaves the app alive, leaves split screen
               * exactly as it was, and puts Chamet in front. evaluateJavascript answers
