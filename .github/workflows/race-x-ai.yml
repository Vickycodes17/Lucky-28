                      // anything counts as being past it. Outside the chequered edge sit
                      // the cars waiting on the start line; a single column of one of them
                      // can read as light-and-dark by chance, and one such column was
                      // enough to make the walk stop immediately and hand back a track
                      // that began with a stripe of paintwork.
                      if (border) { borderRun++; if (borderRun >= 4) seenBorder = true; run = 0; continue; }
                      borderRun = 0;
                      if (!seenBorder) continue;
                      run++;
                      if (run >= 6) return fromLeft ? x - 10 : x + 10;
                  }
                  return fromLeft ? 0 : W - 1;
              }
          }
