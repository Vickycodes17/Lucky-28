               * where useEngine() and speak()'s revive() both called it from - the
               * bind goes out but the object that comes back is one nobody has
               * agreed on: the old handle may still be live on another thread, the
               * shutdown that was supposed to precede it may not have landed yet,
               * and the init callback arrives to find the field already overwritten.
