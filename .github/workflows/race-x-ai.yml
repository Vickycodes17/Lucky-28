              private volatile String engineTrail = "";     // what was tried, in order
              private java.util.List<String> candidates = null;
              private int candidateAt = -1;
              private volatile String forced = null;        // an engine the user picked
              /** while a deliberate switch is in flight, until this moment passes */
              private volatile long switching = 0;
              private static final long SWITCH_GRACE = 12000;
              /** id/label of every engine seen, so the list survives a dead handle */
              private final java.util.List<String[]> engineCache =
                  java.util.Collections.synchronizedList(new java.util.ArrayList<String[]>());

              private boolean isSwitching() {
                  long s = switching;
                  return s != 0 && android.os.SystemClock.elapsedRealtime() - s < SWITCH_GRACE;
              }

              /**
               * Remember the engine list while there is a live handle to ask.
               *
