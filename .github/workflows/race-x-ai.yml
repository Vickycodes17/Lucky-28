          package com.racexai.bot;

          import android.app.Service;
          import android.content.Intent;
          import android.os.IBinder;

          /**
           * ── WHY THE APP WENT ON TALKING AFTER IT WAS CLOSED ────────────────────
           *
           * Reported: "even I close the app and remove it from recents I still get the
           * game voice." That is not a bug in the voice, it is what an accessibility
           * service does. The service is bound by the system, lives in the same
           * process, and keeps that process alive after the task is gone - so the
           * watcher went on reading Chamet, went on calling into the WebView, and the
           * WebView went on speaking, with nothing on screen to stop it.
           *
           * onDestroy on the Activity was the only brake, and swiping a task away does
           * not reliably call it: on most builds the activity is merely stopped, and on
           * several OEM builds it is never destroyed at all while something holds the
           * process.
           *
           * onTaskRemoved IS reliable, and it belongs to a Service. This one does
           * nothing else - no notification, no work, no wakelock. It exists to be told
           * that the task went away, and to shut the voice up when it hears it.
           */
          public class TaskWatchService extends Service {

              @Override public IBinder onBind(Intent i) { return null; }

              @Override public int onStartCommand(Intent i, int flags, int id) {
                  // Not sticky: if Android kills this for memory there is nothing to
                  // resume, and a service that restarts itself for no reason is exactly
                  // the kind of thing that gets an app killed harder next time.
                  return START_NOT_STICKY;
              }

              @Override
              public void onTaskRemoved(Intent root) {
                  // The app is gone from recents. Cut the voice mid-word if it is
                  // speaking, and refuse everything after it, until an activity comes
                  // back and says otherwise.
                  try { MainActivity.appGone(); } catch (Throwable ignored) { }
                  try { stopSelf(); } catch (Throwable ignored) { }
                  super.onTaskRemoved(root);
              }
          }
