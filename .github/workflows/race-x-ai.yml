               * THREE WAYS THIS USED TO GO QUIET WITHOUT SAYING SO:
               *
               * 1. A voice was asked for BY NAME and this phone does not have it. The old
               *    code set no voice and, because the language branch was an `else if`,
               *    set no language either - so the line was read by whatever voice
               *    happened to be left over, or not at all.
               * 2. setLanguage() returned LANG_MISSING_DATA. Its result was thrown away,
               *    and speak() then failed for a reason nobody could see.
               * 3. speak() itself returned ERROR. Also thrown away - and since the page
               *    waits for onend before starting the next language, one failure could
               *    hold up everything behind it.
               *
               * Now: the name is a preference, not a requirement; the language is always
               * set and checked, falling back to the bare language and then to anything
               * the engine can say in it; and a failure is reported rather than swallowed.
               */
              /**
               * VOLUME WAS NEVER A PARAMETER, AND THE PAGE HAS ALWAYS SET IT.
               *
               * The page speaks a soundless utterance to wake a voice up before it is
               * needed - u.volume = 0, a single space, nothing anybody should hear. In a
               * browser that is exactly what happens. Here the volume was simply dropped
               * on the way through, so every one of those warm-ups came out of the
               * speaker at full volume, and they run on paths the app's own mute cannot
               * see because they are not announcements.
               *
               * It also means Broadcast mode could never duck this bridge at all.
               */
              @JavascriptInterface
              public void speak(String id, String text, String lang, float rate, float pitch, String voiceName) {
                  speak(id, text, lang, rate, pitch, voiceName, 1f);
              }

              /* ══════════════════════════════════════════════════════════════════
                 WHEN THE ENGINE DIES UNDER YOU

                 "After about 400 games the voice stops." Four hundred games is
                 three or four hours sitting in split screen beside a live video
                 call, and that is exactly the situation in which Android reclaims
                 a background service it thinks nobody is using. Text-to-speech is
                 such a service.

                 When it goes, the TextToSpeech object this class holds becomes a
                 dead handle. It does not throw and it does not report itself
                 broken - speak() simply returns ERROR, for ever, and the app is
                 silent until it is restarted. Nothing about the app's own state
                 has changed, which is why the switch still says ON.

                 The page cannot fix this: from JavaScript there is no way to
                 rebuild a connection to an Android service. From HERE there is -
                 shut the dead handle down and construct a new one. So a refusal
                 is no longer just reported, it is treated as a dead engine, and
                 the line that failed is spoken again once the replacement answers.

                 Rate-limited to one rebuild every REVIVE_GAP, because an engine
                 that is genuinely absent would otherwise be rebuilt on every
                 utterance for ever.
                 ══════════════════════════════════════════════════════════════════ */
              private static final long REVIVE_GAP = 8000;
              private volatile long lastRevive = 0;
              private volatile int revivals = 0;
              /** the utterance to say again once a rebuilt engine reports ready */
              private volatile String[] pendingAfterRevive = null;

              private synchronized boolean revive(String why) {
                  long now = android.os.SystemClock.elapsedRealtime();
                  if (now - lastRevive < REVIVE_GAP) return false;
                  lastRevive = now;
                  revivals++;
                  lastError = why + " — rebuilding the speech engine (attempt " + revivals + ")";
                  ready = false;
                  // Straight back to the engine that was working, not the whole
                  // search again: this is a dead connection to a known-good engine,
                  // not a phone that has never spoken.
                  //
                  // "" IS NOT AN ENGINE. chosenEngine starts empty and only fills in
                  // once one has answered, so a rebuild before the first success was
                  // asking Android to bind to a package called "" - which fails, every
                  // time, on the one path that exists to recover a phone that has not
                  // spoken yet. Empty means "no preference", the same as null.
                  final String back = (chosenEngine != null && chosenEngine.length() > 0)
                                      ? chosenEngine : forced;
                  runOnUi(new Runnable() { @Override public void run() {
                      TextToSpeech old = tts;
                      tts = null;
                      try { if (old != null) old.shutdown(); } catch (Throwable ignored) { }
                      startNow(back);
                  } });
                  return true;
              }

              /** Say a line again once a rebuilt engine has answered. */
              void speakAfterRevive() {
                  String[] a = pendingAfterRevive;
                  pendingAfterRevive = null;
                  if (a == null || !ready) return;
                  try {
                      speak(a[0], a[1], a[2], Float.parseFloat(a[3]), Float.parseFloat(a[4]),
                            a[5], Float.parseFloat(a[6]));
                  } catch (Throwable ignored) { }
              }

              @JavascriptInterface
              public void speak(String id, String text, String lang, float rate, float pitch,
                                String voiceName, float volume) {
                  // THE APP IS GONE FROM RECENTS. The page is muted the moment that
                  // happens, so nothing should reach here anyway - this is the second
                  // lock on the same door, at the last point before the engine. Silence
                  // is the whole of what closing the app should change: everything the
                  // watcher does without making a sound carries on.
                  try { if (!MainActivity.taskAlive()) { fire("end", id); return; } }
                  catch (Throwable ignored) { }
                  if (!ready || tts == null) {
                      // A DELIBERATE SWITCH IS NOT A DEAD ENGINE. For the few seconds
                      // an engine takes to change over there is nothing to speak
                      // through, and treating that as a failure both rebuilt the
                      // engine we were in the middle of replacing and reported a
                      // refusal for a line that was about to be perfectly speakable.
                      // Hold the line instead; the new engine says it when it answers.
                      if (isSwitching()) {
                          pendingAfterRevive = new String[]{ id, text, lang, String.valueOf(rate),
                                                             String.valueOf(pitch), voiceName,
                                                             String.valueOf(volume) };
                          return;
                      }
                      // NOTHING CAN BE REVIVED THAT WAS NEVER ALIVE. On a phone with
                      // no speech engine installed at all - a bare emulator image,
                      // most often - every announcement used to report "the engine
                      // stopped answering, rebuilding it", which is a fair
                      // description of a different problem entirely and sends you
                      // hunting for a fault in an engine that is not there. It also
                      // built a fresh TextToSpeech every eight seconds, for ever,
                      // for nothing.
                      if (enginesKnownEmpty()) {
                          lastError = "no speech engine is installed on this device";
                          fire("error", id);
                          return;
                      }
                      // Not "this phone has no speech engine" - it had one a minute
                      // ago. Try to get it back, and say this line when it answers.
                      if (revive("the engine stopped answering")) {
                          pendingAfterRevive = new String[]{ id, text, lang, String.valueOf(rate),
                                                             String.valueOf(pitch), voiceName,
                                                             String.valueOf(volume) };
                          return;
                      }
                      lastError = enginesKnownEmpty()
                          ? "no speech engine is installed on this device"
                          : "no speech engine is ready on this phone";
                      fire("error", id);
                      return;
                  }
                  try {
                      boolean gotVoice = false;
                      if (voiceName != null && voiceName.length() > 0) {
                          Set<Voice> vs = tts.getVoices();
                          if (vs != null) {
                              for (Voice v : vs) {
                                  if (voiceName.equals(v.getName())) { tts.setVoice(v); gotVoice = true; break; }
                              }
                          }
                      }
                      // ALWAYS set the language when no exact voice was found - not `else`
                      //
                      // AND NEVER REFUSE ON THE STRENGTH OF THE ANSWER. I had this
                      // returning early when setLang could not confirm the language, and
                      // that was wrong in the worst way: it turned "I am not sure" into "I
                      // will not try", on a phone that had been speaking perfectly well.
                      // isLanguageAvailable is advisory - engines report MISSING_DATA for
                      // languages they then go on to speak - so the only test that means
                      // anything is asking it to speak and seeing what happens. Set the
                      // language as well as we can, remember if it looked doubtful, and
                      // let the engine have its say.
                      boolean unsure = false;
                      if (!gotVoice && lang != null && lang.length() > 0) {
                          unsure = !setLang(lang);
                      }
                      tts.setSpeechRate(rate <= 0 ? 1f : rate);
                      tts.setPitch(pitch <= 0 ? 1f : pitch);
                      // QUEUE_ADD, because the page sequences its own languages one at a time
                      android.os.Bundle params = new android.os.Bundle();
                      float vol = (volume < 0f) ? 0f : (volume > 1f ? 1f : volume);
                      params.putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, vol);
                      params.putString(TextToSpeech.Engine.KEY_PARAM_UTTERANCE_ID, id);
                      int r = tts.speak(text, TextToSpeech.QUEUE_ADD, params, id);
                      if (r != TextToSpeech.SUCCESS) {
                          // A refusal from an engine that WAS working is a dead
                          // connection, not a language it dislikes - rebuild it and
                          // say this line on the other side.
                          if (revive("the engine refused to speak (code " + r + ")")) {
                              pendingAfterRevive = new String[]{ id, text, lang, String.valueOf(rate),
                                                                 String.valueOf(pitch), voiceName,
                                                                 String.valueOf(volume) };
                              return;
                          }
                          lastError = shortName(chosenEngine) + " refused to speak (code " + r + ")"
                                    + (unsure ? " — and it did not recognise " + lang : "")
                                    + (speaksSomething() ? "" : " — it has no voice data for any language this app uses")
                                    + (inCall() ? " — a call is in progress" : "");
                          fire("error", id);
                      }
                  } catch (Exception e) {
                      if (revive("speaking threw: " + e)) {
                          pendingAfterRevive = new String[]{ id, text, lang, String.valueOf(rate),
                                                             String.valueOf(pitch), voiceName,
                                                             String.valueOf(volume) };
                          return;
                      }
                      lastError = "speaking failed: " + e;
                      fire("error", id);
                  }
              }

              /**
               * Set the language, settling for the closest thing the engine has.
               *
               * "hi-IN" missing does not mean Hindi is missing - plenty of engines carry
               * "hi" and nothing else. Insisting on the exact tag is how a phone that can
               * speak a language ends up refusing to.
               */
              private boolean setLang(String tag) {
                  int r;
                  try { r = tts.setLanguage(Locale.forLanguageTag(tag)); }
                  catch (Throwable t) { return false; }
                  if (r == TextToSpeech.LANG_AVAILABLE || r == TextToSpeech.LANG_COUNTRY_AVAILABLE
                      || r == TextToSpeech.LANG_COUNTRY_VAR_AVAILABLE) return true;

                  int cut = tag.indexOf('-');
                  if (cut > 0) {
                      try {
                          r = tts.setLanguage(new Locale(tag.substring(0, cut)));
                          if (r == TextToSpeech.LANG_AVAILABLE || r == TextToSpeech.LANG_COUNTRY_AVAILABLE
                              || r == TextToSpeech.LANG_COUNTRY_VAR_AVAILABLE) return true;
                      } catch (Throwable ignored) { }
                  }

                  // last try: any installed voice whose language matches
                  try {
                      String two = (cut > 0 ? tag.substring(0, cut) : tag).toLowerCase(Locale.ROOT);
                      Set<Voice> vs = tts.getVoices();
                      if (vs != null) for (Voice v : vs) {
                          Locale loc = v.getLocale();
                          if (loc == null) continue;
                          if (loc.getLanguage().toLowerCase(Locale.ROOT).startsWith(two)) {
                              tts.setVoice(v);
                              return true;
                          }
                      }
                  } catch (Throwable ignored) { }
                  return false;
              }

