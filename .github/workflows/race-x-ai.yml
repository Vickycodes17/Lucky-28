          package com.racexai.bot;

          import java.util.ArrayList;
          import java.util.List;

          /**
           * Plays whole races through RaceWatcher on a desktop, frame by frame, the way
           * the reader feeds it on a phone - and checks the things that decide whether a
           * race is priced at the price it really closed on.
           *
           * No Android here and nothing to install: javac and java, run by the build
           * before the APK is made, so a reader that has stopped seeing the close never
           * reaches a phone.
           */
          public class RaceWatcherCheck {

              static int passed = 0;
              static void check(boolean ok, String what) {
                  if (!ok) throw new AssertionError("FAIL " + what);
                  passed++;
                  System.out.println("PASS " + what);
              }

              /** Everything the watcher said, in order. */
              static class Rec implements RaceWatcher.Listener {
                  final List<String> log = new ArrayList<>();
                  List<String> lastOdds, lastBets, closeOdds, closeBets;
                  long lastReadAt, lastTickAt, closeOpenAt, closeAt;
                  int closeSecs = -99, metas = 0, closesN = 0;
                  boolean closeFromFrame;
                  public void fillAndSpeak(List<String> cars, String road, int slot) { log.add("fill " + cars); }
                  public void raceMeta(List<String> odds, List<String> bets, List<String> signs, String countdown,
                                       long readAt, long tickAt) {
                      metas++; lastOdds = odds; lastBets = bets; lastReadAt = readAt; lastTickAt = tickAt;
                      log.add("meta " + countdown + " " + odds + " " + bets);
                  }
                  public void marketClosed(List<String> odds, List<String> bets, int secs,
                                           long lastOpenAt, long closedAt, boolean fromClosingFrame) {
                      closesN++; closeOdds = odds; closeBets = bets; closeSecs = secs;
                      closeOpenAt = lastOpenAt; closeAt = closedAt; closeFromFrame = fromClosingFrame;
                      log.add("close " + odds);
                  }
                  public void hiddenRoads(String a, String b) { }
                  public void probe(String summary) { }
                  public void rankTable(String js, int rows, double margin) { }
                  public void rankFailed(String why, int namesSeen, String screen) { }
                  public void grabTrack() { log.add("grab"); }
                  public void logWinner(String winner) { log.add("won " + winner); }
              }

              static final String P = "* id=com.matemet:id/";
              static final String[] CARS = { "SUV", "ORV", "Car" };

              /** One frame of the betting board, in the walker's one-line-per-node format. */
              static String board(boolean open, String clock, String[] odds, String[] bets) {
                  StringBuilder sb = new StringBuilder();
                  sb.append(P).append("race_game_bg [0,0-1080,1600]\n");
                  for (int i = 0; i < 3; i++) sb.append(P).append("cl_track_content [").append(100 + 300 * i).append(",300-").append(380 + 300 * i).append(",500]\n");
                  sb.append(P).append("ll_track_sign [410,310-500,340]\n");               // the middle track is revealed
                  for (int i = 0; i < 3; i++)
                      sb.append(P).append("tv_track_sign TEXT=\"").append(i == 1 ? "Highway" : "???").append("\" [").append(110 + 300 * i).append(",310-200,340]\n");
                  sb.append(P).append("tv_race_surplus TEXT=\"").append(clock).append("\" [500,200-580,240]\n");
                  sb.append(P).append("gameBetView [0,900-1080,").append(open ? 1300 : 920).append("]\n");
                  for (int i = 0; i < 3; i++) {
                      int x = 100 + 300 * i;
                      sb.append(P).append("tv_car_name TEXT=\"").append(CARS[i]).append("\" [").append(x).append(",950-").append(x + 200).append(",990]\n");
                      if (odds != null) sb.append(P).append("tv_car_odds TEXT=\"").append(odds[i]).append("\" [").append(x).append(",1000-").append(x + 200).append(",1040]\n");
                      if (bets != null) sb.append(P).append("tv_totalBet TEXT=\"").append(bets[i]).append("\" [").append(x).append(",1050-").append(x + 200).append(",1090]\n");
                  }
                  return sb.toString();
              }
              static String party() { return "* id=com.matemet:id/partySeatChatMaskLayout TEXT=\"hello\" [0,0-1080,1600]\n"; }
              static String result(String winner) {
                  return P + "race_game_bg [0,0-1080,1600]\n" + P + "tv_result TEXT=\"" + winner + " won, Next 10 s\" [100,500-900,560]\n";
              }
              static String[] o(String a, String b, String c) { return new String[]{ a, b, c }; }

              public static void main(String[] args) {
                  // ── 1. a race read every 40ms: money-only moves, the tick, the close ──
                  {
                      Rec r = new Rec(); RaceWatcher w = new RaceWatcher(r);
                      long t = 1_000_000L;
                      // the true tick from 3s to 2s happens at t0+1000; frames every 40ms
                      long t0 = t;
                      String[] odds = o("2.0/2.7", "3.0/2.5", "6.0/2.5");
                      w.feed(board(true, "3s", odds, o("50,000", "33,000", "17,000")), t);
                      check(r.log.get(0).startsWith("fill"), "a new board fills once");
                      int before = r.metas;
                      // the stake moves, the printed prices and the clock do not
                      w.feed(board(true, "3s", odds, o("50,100", "33,000", "17,000")), t += 40);
                      check(r.metas == before + 1, "a pool that moved is sent even when no price or second changed");
                      check(r.lastReadAt == t, "each reading carries the moment the screen was read");
                      w.feed(board(true, "3s", odds, o("50,100", "33,000", "17,000")), t += 40);
                      check(r.metas == before + 1, "an identical frame sends nothing");
                      while (t + 40 < t0 + 1000) w.feed(board(true, "3s", odds, o("50,100", "33,000", "17,000")), t += 40);
                      long lastThree = t;
                      w.feed(board(true, "2s", odds, o("50,100", "33,000", "17,000")), t += 40);
                      check(r.lastTickAt > 0 && Math.abs(r.lastTickAt - (t0 + 1000)) <= 20,
                            "the tick is placed within half a read gap of when it happened (" + (r.lastTickAt - t0 - 1000) + "ms off)");
                      check(r.lastTickAt > lastThree && r.lastTickAt < t, "the tick sits between the last old digit and the first new one");
                      // the last second: prices move hard, the board is read right up to the close
                      String[] late = o("1.6/2.7", "2.8/2.5", "9.0/2.5");
                      for (int i = 0; i < 20; i++) w.feed(board(true, "1s", odds, o("50,100", "33,000", "17,000")), t += 40);
                      w.feed(board(true, "0s", late, o("62,000", "35,000", "11,000")), t += 40);
                      long lastOpen = t;
                      check(r.closesN == 0, "nothing closes while the board is open");
                      // the betting panel folds - the board says so itself
                      w.feed(board(false, "0s", null, null), t += 40);
                      check(r.closesN == 1, "a folded betting panel closes the market at once");
                      check(r.closeOdds.equals(java.util.Arrays.asList(late)), "the close carries the last prices actually on screen, not the 1s ones");
                      check(r.closeBets.get(0).equals("62,000"), "and the pool those prices were made of");
                      check(r.closeOpenAt == lastOpen && r.closeAt == t, "and when it was last seen open and first seen shut");
                      check(!r.closeFromFrame, "with no prices on the folded frame, it says it used the last open one");
                      check(r.closeSecs == 0, "and the seconds left on that last open frame");
                      w.feed(board(false, "0s", null, null), t += 40);
                      w.feed(party(), t += 40);
                      w.feed(party(), t += 40);
                      check(r.closesN == 1, "the close is sent once per race");
                      w.feed(result("ORV"), t += 40);
                      int ci = r.log.indexOf("close " + java.util.Arrays.asList(late));
                      check(ci >= 0 && ci < r.log.indexOf("won ORV"), "the close reaches the app before the winner, so the race is logged with it");
                  }

                  // ── 2. one empty frame in the middle of betting is a glitch, not a close ──
                  {
                      Rec r = new Rec(); RaceWatcher w = new RaceWatcher(r);
                      long t = 5_000_000L;
                      String[] odds = o("2.0/2.7", "3.0/2.5", "6.0/2.5");
                      w.feed(board(true, "9s", odds, o("5", "3", "2")), t);
                      w.feed(party(), t += 40);
                      check(r.closesN == 0, "a single frame with no board does not close the market");
                      w.feed(board(true, "9s", odds, o("6", "3", "2")), t += 40);
                      w.feed(party(), t += 40);
                      check(r.closesN == 0, "and an open frame in between starts the count again");
                      long first = t;
                      w.feed(party(), t += 40);
                      check(r.closesN == 1 && r.closeAt == first, "two in a row do, dated to the first of them");
                      check(r.closeOdds.equals(java.util.Arrays.asList(odds)), "carrying the last open prices");
                      // and if betting turns out to still be open, the close was early
                      w.feed(board(true, "8s", o("1.9/2.7", "3.1/2.5", "6.2/2.5"), o("7", "3", "2")), t += 40);
                      check(w.bettingOpen(), "a board that comes back open reopens the market");
                      w.feed(board(false, "0s", o("1.8/2.7", "3.3/2.5", "6.5/2.5"), o("9", "4", "2")), t += 40);
                      check(r.closesN == 2 && r.closeFromFrame && r.closeOdds.get(0).equals("1.8/2.7"),
                            "a folded panel that still shows prices closes on those prices");
                  }

                  // ── 3. a winner seen with no close before it still closes first ──
                  {
                      Rec r = new Rec(); RaceWatcher w = new RaceWatcher(r);
                      long t = 9_000_000L;
                      w.feed(board(true, "5s", o("2.0/2.7", "3.0/2.5", "6.0/2.5"), o("5", "3", "2")), t);
                      w.feed(result("SUV"), t += 40);
                      check(r.closesN == 1 && r.log.indexOf("won SUV") > r.log.indexOf("close [2.0/2.7, 3.0/2.5, 6.0/2.5]"),
                            "a result with no close before it closes first, then logs");
                      // the same three cars again: a new race, not a continuation
                      w.feed(board(true, "38s", o("2.0/2.7", "3.0/2.5", "6.0/2.5"), o("0", "0", "0")), t += 40);
                      check(r.log.get(r.log.size() - 2).startsWith("fill") && w.bettingOpen(), "an identical line-up after a result fills again");
                  }

                  // ── 4. the clock a reader can trust: no tick from a jump ──
                  {
                      Rec r = new Rec(); RaceWatcher w = new RaceWatcher(r);
                      long t = 12_000_000L;
                      w.feed(board(true, "20s", o("2/2", "3/2", "6/2"), o("1", "1", "1")), t);
                      w.feed(board(true, "17s", o("2/2", "3/2", "6/2"), o("1", "1", "1")), t += 3000);
                      check(r.lastTickAt == 0, "a clock that jumped three seconds gives no tick rather than a wrong one");
                      check(w.secondsLeft() == 17, "the seconds left are known to the reader, to set its pace");
                  }
                  // ── 5. the pace: nothing asked for is dropped, an open board is polled ──
                  {
                      ReadPacer p = new ReadPacer();
                      long t = 100_000L;
                      // a party with no board: no heartbeat, and the gap backs off
                      p.started(t); p.done(t + 30, 30, true, false, false, -1);
                      check(p.delay(t + 30, false) == -1, "with no board on screen nothing is read unless something asks");
                      long d = p.delay(t + 100, true);
                      check(d > 0 && t + 100 + d == t + p.gap(t + 100),
                            "an event inside the gap is booked for the end of it, not thrown away");
                      for (int i = 0; i < 20; i++) { t += 3000; p.started(t); p.done(t + 30, 30, true, false, false, -1); }
                      check(p.gap(t) == ReadPacer.IDLE_MAX, "a long quiet spell backs off to " + ReadPacer.IDLE_MAX + "ms and no further");
                      // a board appears: straight to the open pace, with a heartbeat
                      t += 1000; p.started(t); p.done(t + 10, 10, true, true, true, 30);
                      long hb = p.delay(t + 10, false);
                      check(hb >= 0 && hb <= ReadPacer.OPEN_GAP,
                            "an open board is polled on its own, events or not");
                      check(p.gap(t + 10) == ReadPacer.OPEN_GAP, "every " + ReadPacer.OPEN_GAP + "ms while betting is open");
                      t += 80; p.started(t); p.done(t + 8, 8, false, true, true, 4);
                      check(p.gap(t + 8) == ReadPacer.FINAL_GAP, "and every " + ReadPacer.FINAL_GAP + "ms in the last " + ReadPacer.FINAL_SECS + " seconds");
                      check(!p.fullDue(t + 20, true), "a fast read of the board's own views is enough between full looks");
                      check(p.fullDue(t + 20, false), "but not when the board's views are not in hand");
                      check(p.fullDue(t + ReadPacer.FULL_EVERY + 20, true), "and everything is looked at again every " + ReadPacer.FULL_EVERY + "ms");
                      // a slow phone: never faster than it can manage
                      ReadPacer slow = new ReadPacer();
                      slow.started(t); slow.done(t + 120, 120, true, true, true, 20);
                      check(slow.gap(t + 120) >= 120, "on a slow phone the open pace is never shorter than one pass");
                      slow.started(t + 200); slow.done(t + 320, 120, false, true, true, 3);
                      check(slow.gap(t + 320) >= 60 && slow.gap(t + 320) < 120, "and in the final seconds never shorter than half of one");
                      // betting closed, race running: slower, but still looking for the result
                      t += 1000; p.started(t); p.done(t + 30, 30, true, true, false, -1);
                      long beat = p.delay(t + 30, false);
                      check(beat > 0 && beat <= ReadPacer.AFTER_BEAT, "once betting closes it still looks for the result on its own");
                      check(!p.describe(t).isEmpty(), "and can say what it is doing");
                  }
                  System.out.println("Verified " + passed + " board-reader checks on a desktop.");
              }
          }
          ___RXA_EOF___
          cat > app/src/main/assets/manifest.json <<'___RXA_EOF___'
          {
            "name": "Race x AI Bot",
            "short_name": "Race x AI",
            "description": "Race prediction assistant with Guard bet filtering.",
            "start_url": "./index.html",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#000000",
            "theme_color": "#000000",
            "icons": [
              { "src": "icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any" },
              { "src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any" },
              { "src": "icon-maskable-512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
            ]
          }
          ___RXA_EOF___
          cat > app/src/main/assets/sw.js <<'___RXA_EOF___'
          // Race x AI Bot — service worker.
          // CACHE is filled in by the build from the hash of index.html, so a new
          // app is always a new cache. Nothing to bump by hand.
          const CACHE = '__RXA_CACHE__';
          const ASSETS = ['./', './index.html', './manifest.json',
                          './icon-192.png', './icon-512.png', './icon-maskable-512.png'];
          
          self.addEventListener('install', e => {
            e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting()));
          });
          
          self.addEventListener('activate', e => {
            e.waitUntil(
              caches.keys()
                .then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))
                .then(() => self.clients.claim())
            );
          });
          
          // The page itself is network-first, so a new build reaches you as soon as you
          // are online; the cached copy is the fallback that keeps the app usable offline.
          // Everything else is cache-first, since icons and the manifest rarely change.
          self.addEventListener('fetch', e => {
            const req = e.request;
            if (req.method !== 'GET') return;
            const url = new URL(req.url);
            if (url.origin !== location.origin) return;   // never touch Supabase or the CDN
          
            if (req.mode === 'navigate' || url.pathname.endsWith('.html')) {
              e.respondWith(
                fetch(req)
                  .then(res => {
                    const copy = res.clone();
                    caches.open(CACHE).then(c => c.put(req, copy));
                    return res;
                  })
                  .catch(() => caches.match(req).then(r => r || caches.match('./index.html')))
              );
              return;
            }
            e.respondWith(caches.match(req).then(r => r || fetch(req)));
          });
          ___RXA_EOF___
          # ── THE CACHE NAME HAS TO MOVE WHEN THE APP DOES ──
          #
          # This said 'racexai-v1', written once and never touched again. The
          # activate handler deletes every cache whose key is NOT the current
          # one - so with a key that never changes, nothing was ever deleted.
          #
          # index.html survived that on a technicality: it is network-first, and
          # inside the app "the network" is the asset loader reading the APK, so
          # a navigation always got the new build. The icons and the manifest are
          # cache-first. Whatever the FIRST install put in racexai-v1 is what
          # every later build went on serving, because a new APK was not a new
          # cache - and the service worker itself never updated either, since its
          # bytes were identical every time.
          #
          # Derived from the app now, exactly the way the website bundle does it:
          # a new index.html is a new cache name, so sw.js changes too, the
          # browser notices, install refetches every asset from the new APK, and
          # activate drops the old cache because the key genuinely differs. An
          # unchanged app keeps its cache and refetches nothing.
          CACHE_ID=$(sha256sum app/src/main/assets/index.html | cut -c1-12)
          sed -i "s/__RXA_CACHE__/racexai-$CACHE_ID/" app/src/main/assets/sw.js
          grep -q "racexai-$CACHE_ID" app/src/main/assets/sw.js \
            || { echo "::error::service worker cache name was not substituted"; exit 1; }
          echo "service worker cache: racexai-$CACHE_ID"
          python3 -m pip install --quiet pillow
          python3 - <<'PYEOF'
          import re,base64,io,os
          from PIL import Image
          h=open('app/src/main/assets/index.html',encoding='utf-8').read()
          m=re.search(r"const APP_LOGO='data:image/jpeg;base64,([A-Za-z0-9+/=]+)'",h)
          src=Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert('RGB')
          for d,s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              os.makedirs('app/src/main/res/mipmap-'+d,exist_ok=True)
              c=Image.new('RGB',(s,s),(0,0,0)); im=src.copy(); im.thumbnail((int(s*.86),int(s*.86)),Image.LANCZOS)
              c.paste(im,((s-im.width)//2,(s-im.height)//2)); c.save('app/src/main/res/mipmap-%s/ic_launcher.png'%d)
          for n,s,f in [('icon-192',192,.86),('icon-512',512,.86),('icon-maskable-512',512,.6)]:
              c=Image.new('RGB',(s,s),(0,0,0)); im=src.copy(); im.thumbnail((int(s*f),int(s*f)),Image.LANCZOS)
              c.paste(im,((s-im.width)//2,(s-im.height)//2)); c.save('app/src/main/assets/%s.png'%n)
          print('icons generated')
          PYEOF
          echo "--- project ---"; find app -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the board reader on a desktop
        # RaceReader, RaceWatcher and ReadPacer have no Android in them on
        # purpose: whole races are played through them here, frame by frame,
        # and a reader that has stopped seeing the close never reaches a phone.
        run: |
          mkdir -p desktop-check/classes
          javac -d desktop-check/classes \
            app/src/main/java/com/racexai/bot/RaceReader.java \
            app/src/main/java/com/racexai/bot/RaceWatcher.java \
            app/src/main/java/com/racexai/bot/ReadPacer.java \
            desktop-check/RaceWatcherCheck.java
          java -cp desktop-check/classes com.racexai.bot.RaceWatcherCheck

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        env:
          RXA_KEYSTORE_PASS:  ${{ secrets.RXA_KEYSTORE_PASS }}
          RXA_KEYSTORE_ALIAS: ${{ secrets.RXA_KEYSTORE_ALIAS }}
        run: |
          if [ ! -s racex.keystore ]; then
            keytool -genkeypair -noprompt -keystore racex.keystore -storetype PKCS12 \
              -alias "${RXA_KEYSTORE_ALIAS:-racexai}" -storepass "${RXA_KEYSTORE_PASS:-racexaibot}" \
              -keypass "${RXA_KEYSTORE_PASS:-racexaibot}" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Race x AI Bot (throwaway)" || exit 1
            echo "Signed with a THROWAWAY key - set RXA_KEYSTORE_B64 to update an installed app." >> $GITHUB_STEP_SUMMARY
          fi
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          CODE=$?
          {
            echo "## Build result"
            if [ $CODE -eq 0 ]; then
              echo "Built. The APK is in **Artifacts** at the bottom of this page,"
              echo "and a shareable link is on the **Releases** page of this repo."
            else
              echo '```'
              grep -E "FAILURE:|What went wrong|^> |error:|^e: |Caused by:" build.log | head -40
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY
          exit $CODE

      - name: Collect the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/RaceXAiBot.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RaceXAiBot-apk
          path: race-x-ai/out/RaceXAiBot.apk
          if-no-files-found: error

      # A release gives a permanent link anyone can download from, without a
      # GitHub account - but ONLY while the repo is public. On a private repo the
      # link asks for a login, which defeats the point of sharing it.
      - name: Publish a shareable download
        # a test build on a branch must not replace the download everyone uses
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Race x AI Bot - build ${{ github.run_number }}
          body: |
            build ${{ github.run_number }}

            Tap RaceXAiBot.apk below to download and install.
            Allow "install from unknown sources" when Android asks.

            This one installs straight over the app you already have - do NOT
            uninstall first, or you will lose every race you have logged.
          files: race-x-ai/out/RaceXAiBot.apk
          make_latest: true
        continue-on-error: true      # a private repo can still build without it

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-log
          path: race-x-ai/build.log
