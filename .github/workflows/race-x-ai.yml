               * WHY THIS CLASS NOW KEEPS NOTES.
               *
               * "No voice at all on my friend's phone" was impossible to act on, because
               * every way this could fail failed SILENTLY. No speech engine installed at
               * all, an engine installed with no voice data downloaded, a language the
               * engine cannot speak - all three ended the same way: nothing said, nothing
               * shown, nothing logged. The phone that worked and the phone that did not
               * looked identical from inside the app.
               *
               * So every failure now leaves a trace, and ttsDiag() hands the lot to the
               * page. A silent phone can now say WHY it is silent.
               */
              private volatile int initStatus = -99;      // -99 = the engine never answered
              private volatile String lastError = "";
              private volatile String engineName = "";
              private volatile boolean retried = false;

