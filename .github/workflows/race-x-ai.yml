               * A PHONE'S DEFAULT SPEECH ENGINE IS NOT NECESSARILY ONE THAT CAN SPEAK.
               *
               * Samsung ships its own text-to-speech engine and makes it the default.
               * Where it has no data for a language, the app went quiet - and installing
               * voice data did not help, because the installer opens the DEFAULT engine's
               * download screen, which is the engine that does not have the language. So
               * the download appears to work, changes nothing, and there is no way to tell
               * from inside the app that anything is wrong.
               *
               * Meanwhile the same phone very often has Google's engine installed too,
               * sitting there able to speak every one of these languages, simply not
               * selected. Android lets an app name the engine it wants. So rather than
               * accept whichever one the phone points at, this tries the default first
               * and - if it turns out to be able to speak none of the languages the app
               * announces in - moves on to the next installed engine until one can.
               */
