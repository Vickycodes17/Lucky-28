               * getEngines() needs a live handle and returns null when it cannot
               * answer - which is indistinguishable from an empty list unless you
               * check. Saying "no speech engine is installed" to somebody whose
               * engine merely failed to bind sends them to the Play Store for
               * something they already have, so this only says yes when the list
               * really came back and really was empty.
