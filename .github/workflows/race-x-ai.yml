                  Col m = new Col();
                  if (n == 0) return m;
                  m.r = (int) (r / n); m.g = (int) (g / n); m.b = (int) (b / n);
                  m.yellow = (int) (y / n); m.dark = (int) (d / n);
                  return m;
              }

