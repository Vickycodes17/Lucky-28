           * sequence can be replayed against recorded frames on a desktop rather than
           * debugged on a phone.
           *
           * The loop, in the game's own terms:
           *
           *   BETTING opens with a readable board -> fill it into the app and announce.
           *           Only once per race: the board is re-read every frame while the
           *           countdown ticks, and re-filling every time would re-announce over
           *           and over.
           *   RACING  the board vanishes from the tree entirely - vehicle names included -
           *           so nothing can be re-read here. The app keeps what it was given.
           *   RESULT  "ORV won, Next 10 s" appears and stays about ten seconds. Log it
           *           once, then forget the board so the next round fills cleanly even if
           *           it happens to have the identical line-up.
