          package com.lucky28.bot;

          import android.accessibilityservice.AccessibilityService;
          import android.os.SystemClock;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityWindowInfo;

          import java.util.ArrayList;
          import java.util.List;

          /**
           * WATCHES CHAMET IN THE OTHER HALF OF THE SCREEN.
           *
           * It reads EVERY visible window rather than the focused one, because in split
           * screen Chamet is deliberately not focused while this app is — so
           * getRootInActiveWindow() would only ever hand back our own half. That needs
           * flagRetrieveInteractiveWindows in the service config and getWindows() here.
           *
           * All this class does is turn a view tree into text with coordinates. Every
           * decision about what that text MEANS lives in L28Reader, which has no Android
           * imports and is compiled and run against recorded screens on a laptop. A
           * reader you can only test by installing an APK is a reader that never gets
           * fixed.
           */
          public class WatchService extends AccessibilityService {

              /**
               * HOW OFTEN TO READ, and why it is not one number.
               *
               * A betting window is short, so while a board is up this wants to be quick.
               * The rest of the time a Chamet party runs for hours with no board at all,
               * and re-reading that whole tree twice a second for nothing is what makes a
               * phone feel hot and slow. So it backs off when it finds nothing and snaps
               * straight back the moment a board appears. The idle ceiling stays well
               * inside a betting window, so the worst case is noticing a round a second
               * late rather than missing it.
               */
              private static final long GAP_BUSY = 700;
              private static final long GAP_IDLE_MAX = 2500;
              private volatile long gap = GAP_BUSY;
              private volatile long last = 0;

              private static WatchService instance;
              /** the last thing read, kept so the app can show it even with nothing new */
              private static volatile String lastJson = "";
              private static volatile String lastRaw = "";
              private static volatile long lastAt = 0;

              public static boolean alive() { return instance != null; }
              public static String peek() { return lastJson; }
              public static String peekRaw() { return lastRaw; }
              public static long peekAt() { return lastAt; }

              @Override public void onServiceConnected() { instance = this; }
              @Override public void onDestroy() { if (instance == this) instance = null; super.onDestroy(); }
              @Override public void onInterrupt() { }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  long now = SystemClock.elapsedRealtime();
                  if (now - last < gap) return;
                  last = now;
                  try { sweep(); } catch (Throwable t) { /* never let a read kill the service */ }
              }

              private void sweep() {
                  List<L28Reader.Item> items = new ArrayList<L28Reader.Item>();
                  StringBuilder raw = new StringBuilder();
                  List<AccessibilityWindowInfo> wins = null;
                  try { wins = getWindows(); } catch (Throwable t) { }
                  if (wins != null) {
                      for (AccessibilityWindowInfo w : wins) {
                          AccessibilityNodeInfo root = null;
                          try { root = w.getRoot(); } catch (Throwable t) { }
                          if (root == null) continue;
                          try { harvest(root, items, raw, 0); } finally {
                              try { root.recycle(); } catch (Throwable t) { }
                          }
                      }
                  }
                  if (items.isEmpty()) {
                      AccessibilityNodeInfo r = null;
                      try { r = getRootInActiveWindow(); } catch (Throwable t) { }
                      if (r != null) {
                          try { harvest(r, items, raw, 0); } finally {
                              try { r.recycle(); } catch (Throwable t) { }
                          }
                      }
                  }

                  L28Reader.Board b = L28Reader.read(items);
                  lastRaw = raw.length() > 4000 ? raw.substring(0, 4000) : raw.toString();
                  lastAt = System.currentTimeMillis();

                  /* Slow down when there is nothing here, speed up the moment there is. */
                  if (b.anything()) gap = GAP_BUSY;
                  else gap = Math.min(GAP_IDLE_MAX, (long) (gap * 1.35) + 100);

                  String json = b.json();
                  lastJson = json;
                  MainActivity.pushBoard(json, lastRaw);
              }

              /** Depth-limited so a pathological tree cannot spin, and text-only. */
              private void harvest(AccessibilityNodeInfo n, List<L28Reader.Item> out, StringBuilder raw, int depth) {
                  if (n == null || depth > 40 || out.size() > 900) return;
                  CharSequence t = n.getText();
                  if (t == null) t = n.getContentDescription();
                  if (t != null) {
                      String s = t.toString().trim();
                      if (s.length() > 0 && s.length() < 120) {
                          android.graphics.Rect r = new android.graphics.Rect();
                          try { n.getBoundsInScreen(r); } catch (Throwable e) { }
                          out.add(new L28Reader.Item(s, r.left, r.top, r.right, r.bottom));
                          if (raw.length() < 4000) raw.append(s).append(" | ");
                      }
                  }
                  int c = 0;
                  try { c = n.getChildCount(); } catch (Throwable e) { }
                  for (int i = 0; i < c; i++) {
                      AccessibilityNodeInfo ch = null;
                      try { ch = n.getChild(i); } catch (Throwable e) { }
                      if (ch == null) continue;
                      try { harvest(ch, out, raw, depth + 1); } finally {
                          try { ch.recycle(); } catch (Throwable e) { }
                      }
                  }
              }
          }

