               * backup as a blob and clicks an <a download> link, which works in a
               * browser and does absolutely nothing here - no listener, no file, and the
               * page cheerfully said "downloaded" because from its side the click had
               * succeeded. So the page hands the bytes over instead and this writes them.
               *
               * MediaStore on Android 10 and up, because an app cannot write into shared
               * storage directly there; the older path below it for anything earlier.
               *
               * Returns "ok <path>" or "error ...", and the page shows whichever it gets
               * rather than announcing success on its own authority.
               */
              @JavascriptInterface
              public String saveDownload(String name, String mime, String base64) {
                  try {
                      byte[] data = android.util.Base64.decode(base64, android.util.Base64.DEFAULT);
                      return writeToDownloads(activity, name, mime, data);
                  } catch (Throwable t) { return "error " + t; }
