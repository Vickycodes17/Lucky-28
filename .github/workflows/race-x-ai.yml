              public TtsBridge(Activity activity, WebView web) {
                  this.activity = activity;
                  this.web = web;
                  start(null);
              }

              /** Every engine installed on this phone, default first. */
              private java.util.List<String> installedEngines() {
                  java.util.List<String> out = new java.util.ArrayList<>();
                  try {
                      String def = tts == null ? null : tts.getDefaultEngine();
                      if (def != null && def.length() > 0) out.add(def);
                      java.util.List<TextToSpeech.EngineInfo> all =
                          (tts == null) ? null : tts.getEngines();
                      if (all != null) for (TextToSpeech.EngineInfo e : all) {
                          if (e != null && e.name != null && !out.contains(e.name)) out.add(e.name);
