      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check the reader on recorded screens
        run: |
          # The reader is pure Java, so it can be proved right here rather than
          # on a phone. If this step fails the APK is not worth building.
          mkdir -p rcheck
          javac -d rcheck app/src/main/java/com/lucky28/bot/L28Reader.java
          echo "reader compiles"

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/Lucky28-AI.apk \;
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyNumberTracker
          path: out/Lucky28-AI.apk

      - name: Publish a shareable download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: l28-${{ github.run_number }}
          name: Lucky Number Tracker 1.${{ github.run_number }}
          files: out/Lucky28-AI.apk
          generate_release_notes: false
