          package com.racexai.bot;

          /**
           * How often this particular phone will let the bot photograph the screen.
           *
           * THE PROBLEM. Android rate-limits screenshots taken by an accessibility
           * service and refuses one that comes too soon after the last with error code 3.
           * The gap was a number typed into the source - 1400ms, "comfortably past the
           * rate limit" - and on a real phone it was not: the race log came back reading
           * `screenshot refused, code 3` on shot 3 of 5, then 3, then 4, then 5, race
           * after race. Every refusal burned one of the five attempts, so most races ended
           * having never photographed the track at all, and the two hidden surfaces - the
           * whole reason for taking the picture - were lost.
           *
           * WHY A FIXED NUMBER WAS ALWAYS GOING TO FAIL. The limit is not one number. It
           * differs between Android versions and between manufacturers, it is measured
           * from moments this code cannot see, and a phone busy with a video call answers
           * differently from an idle one. Guessing higher would only trade lost races for
           * fewer looks at the track, and would still be a guess.
           *
           * SO IT IS LEARNED. Start at a gap that works on most phones. Every refusal
           * pushes it up; a long run of successes lets it drift back down. Within a race
           * or two the bot is asking at exactly the pace its own phone allows, and it
           * stops asking too soon rather than being told off for it.
           *
           * AND A REFUSAL IS NOT AN ATTEMPT. "You asked too soon" says nothing about the
           * track and should cost nothing - the shot is retried a moment later rather than
           * counted as one of the five. That distinction is most of the fix.
           *
           * No Android imports, so the pacing can be run forwards on a desktop and checked
           * against the failure it exists to stop.
           */
          public class ShotPacer {

              /** where to start: fine on most phones, and it corrects itself if not */
              public static final long START = 1200;
              /** never wait longer than this - a race is only so long */
              public static final long MAX = 6000;
              /** how much one refusal moves it */
              public static final long STEP = 800;
              /** successes in a row before easing back off */
              public static final int EASE_AFTER = 6;
              public static final long EASE_BY = 200;

              private long gap;
              private long lastAt = Long.MIN_VALUE / 4;
              private int refusals = 0;
              private int streak = 0;

              public ShotPacer() { this(START); }
              public ShotPacer(long start) { gap = start; }

              /** How long to wait before asking. 0 means ask now. */
              public long waitFrom(long now) {
                  long w = lastAt + gap - now;
                  return w > 0 ? w : 0;
              }

              /** Called immediately before a screenshot is requested. */
              public void asked(long now) { lastAt = now; }

              /**
               * The phone refused because the request came too soon.
               *
               * The gap goes up straight away rather than gradually: being told off is
               * unambiguous information, and creeping toward the right answer one small
               * step at a time would burn several more races getting there.
               */
              public void refused() {
                  gap = Math.min(MAX, gap + STEP);
                  refusals++;
                  streak = 0;
              }

              /**
               * A screenshot came back.
               *
               * The gap eases back down after a long clean run, so one unlucky refusal -
               * during a video call, say - does not slow the bot down for the rest of the
               * session. Slowly, and never below the starting point: this is a correction,
               * not a search for the true limit.
               */
              public void worked() {
                  streak++;
                  if (streak >= EASE_AFTER && gap > START) {
                      gap = Math.max(START, gap - EASE_BY);
                      streak = 0;
                  }
              }

              public long gap() { return gap; }
              public int refusals() { return refusals; }

              /** For the diagnostic: what it has settled on, and what it cost to find out. */
              public String describe() {
                  return gap + "ms between shots"
                       + (refusals > 0 ? ", learned from " + refusals + " refusal" + (refusals == 1 ? "" : "s") : "");
              }
          }
