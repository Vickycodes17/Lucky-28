    '.uiPair{display:flex;align-items:center;gap:8px;margin:5px 0}',
    '.uiPairLab{width:70px;flex:none;font-size:10px;color:var(--text2)}',
    '.uiPairTrack{flex:1;height:8px;background:var(--bg);border-radius:4px}',
    '.uiPairFill{height:8px;border-radius:4px}',
    '.uiPairVal{width:46px;flex:none;text-align:right;font-size:10.5px;font-weight:700;',
      'font-variant-numeric:tabular-nums}',

    '.uiPill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;',
      'font-weight:800;letter-spacing:.3px;text-transform:uppercase}',

    '.uiPips{display:flex;flex-wrap:wrap;gap:3px;margin:7px 0 5px}',
    '.uiPip{width:10px;height:10px;border-radius:50%;flex:none}',

    '.uiTiles{display:flex;gap:6px;margin:10px 0 4px}',
    '.uiTile{flex:1;background:var(--bg);border-radius:8px;padding:9px 5px;text-align:center}',
    '.uiTileV{font-size:17px;font-weight:800;line-height:1.1}',
    '.uiTileL{font-size:8px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.3px}',

    '.uiNote{font-size:9.5px;color:var(--text3);line-height:1.55;margin-top:9px}',
    '.uiState{background:var(--bg);border-radius:8px;padding:10px;text-align:center;margin-bottom:10px}'
  ].join('');
  (document.head || document.documentElement).appendChild(css);

  var esc = function(s){ return String(s).replace(/[<>&]/g, function(c){
    return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }); };

  /** How far past the chance line you are, drawn. Neutral grey in the middle
      band, because "the same as chance" should not look like a result. */
  function divBar(delta, cap, col){
    var d = Math.max(-cap, Math.min(cap, delta));
    var half = Math.max(Math.abs(d) / cap * 50, 1.2);
    var left = d >= 0 ? 50 : 50 - half;
    return '<div class="uiDiv"><div class="uiDivMid"></div>'
         + '<div class="uiDivBar" style="left:' + left + '%;width:' + half + '%;background:' + col + '"></div>'
         + '</div>';
  }

  /** Two bars on one scale: what happened, and what chance alone would give. */
  function pairBars(seenLab, seen, expLab, exp, col, unit){
    var top = Math.max(seen, exp, 1) * 1.15;
    var u = unit || '';
    function row(lab, v, c, txt){
      return '<div class="uiPair"><div class="uiPairLab">' + lab + '</div>'
           + '<div class="uiPairTrack"><div class="uiPairFill" style="width:'
           + Math.max(v / top * 100, 1.5) + '%;background:' + c + '"></div></div>'
           + '<div class="uiPairVal" style="color:' + c + '">' + txt + '</div></div>';
    }
    return row(seenLab, seen, col, seen + u)
         + row(expLab, exp, 'var(--border2)',
               '<span style="color:var(--text3)">' + (Math.round(exp * 10) / 10) + u + '</span>');
  }

  /** A verdict badge. The tint is written twice on purpose: a plain transparent
      background first, then the mixed one. An older WebView that has never heard
      of color-mix throws the second line away and keeps the first, so the badge
      is an outline instead of a tint rather than nothing at all. */
  function pill(text, col){
    return '<span class="uiPill" style="color:' + col + ';border:1px solid ' + col
         + ';background:transparent;background:color-mix(in srgb,' + col + ' 15%,transparent)">'
         + text + '</span>';
  }

  /* ══ 1. ACCURACY AGAINST CHANCE ════════════════════════════════════════
     The app's own thresholds decide the colour and the words — above five
     points is ahead, below minus five is behind, anything between is neither.
     All this does is draw the distance. */
  var ACC_CAP = 8;    /* a fair wheel keeps every level within a couple of points
                         of chance, so eight points either side is already a wide
                         scale. Wider than this and every honest result collapses
                         onto the line and you cannot tell the levels apart. */

  function pts(d){ return Math.abs(d) === 1 ? ' pt' : ' pts'; }

  function accRows(getAcc, withCtwl){
    var out = '<div class="uiScale"><span>◀ ' + ACC_CAP + ' pts behind</span>'
            + '<span style="color:var(--text2);font-weight:700">chance</span>'
            + '<span>' + ACC_CAP + ' pts ahead ▶</span></div>';
    for (var i = 0; i < LEVELS.length; i++) {
      var a = getAcc(i + 1);
      if (!a) continue;
      var base = numberBaseline(i + 1);
      var edge = a.pct - base;
      var col = edge > 5 ? 'var(--green)' : edge < -5 ? 'var(--accent2)' : 'var(--text2)';
      var barCol = edge > 5 ? 'var(--green)' : edge < -5 ? 'var(--accent2)' : 'var(--border2)';
      var word = edge > 5 ? 'ahead of chance' : edge < -5 ? 'behind chance' : 'level with chance';
      var sign = edge > 0 ? '+' : '';

      out += '<div class="uiRow">'
        + '<div class="uiTop"><span class="uiName">Lv' + (i + 1) + ' · ' + LEVELS[i]
        +   ' num' + (LEVELS[i] > 1 ? 's' : '') + '</span>'
        + '<span><b class="uiVal" style="color:' + col + '">' + a.pct + '%</b>'
        +   '<span style="font-size:9px;color:var(--text3)"> / ' + base + '% by chance</span></span></div>'
        + divBar(edge, ACC_CAP, barCol)
        + '<div class="uiSub"><span>' + a.hit + ' of ' + a.tot + ' draws'
        +   (withCtwl ? ' · CTWL ' + a.run + ' now, ' + a.maxRun + ' worst' : '') + '</span>'
        + '<span style="color:' + col + '">' + sign + Math.round(edge) + pts(edge) + ' · ' + word + '</span></div>'
        + '</div>';
    }
    return out;
  }

  /** Find the block the app already drew, by its own heading, and redraw
      the inside of it. Nothing about how the panel is built is assumed. */
  function reface(panelId, heading, html){
    var p = document.getElementById(panelId);
    if (!p) return false;
    var divs = p.getElementsByTagName('div');
    for (var i = 0; i < divs.length; i++) {
      var d = divs[i], h = d.firstElementChild;
      if (h && h.textContent.trim() === heading) { d.innerHTML = html; return true; }
    }
    return false;
  }

  /* ══ 2. THE PAPER-PLAY RECORD ══════════════════════════════════════════ */
  function paperCard(){
    var st = sessionStats();
    var held = (typeof captured !== 'undefined') ? captured : null;

    var state;
    if (held) {
      var chips = held.skip ? '' : held.nums.map(function(n){
        return '<span class="chip" style="background:' + colorOf(n).col + '">' + n + '</span>';
      }).join('');
      state = '<div class="uiState" style="border:1px solid '
        + (held.skip ? 'var(--gold)' : 'var(--accent)') + '">'
        + pill(held.skip ? 'skip captured' : 'play captured',
               held.skip ? 'var(--gold)' : 'var(--accent)')
        + (chips ? '<div style="margin-top:7px">' + chips + '</div>'
                 : '<div style="font-size:10px;color:var(--text3);margin-top:6px">sitting this one out</div>')
        + '</div>';
    } else {
      state = '<div class="uiState"><div style="font-size:11px;color:var(--text3)">'
            + 'Nothing captured — the next result will not be scored</div></div>';
    }

    var pct = st.n ? Math.round(st.w / st.n * 100) : null;
    var ctwlCol = st.run >= 3 ? 'var(--accent2)' : st.run >= 2 ? 'var(--gold)' : 'var(--green)';

    return '<div class="uiCard">'
      + '<div class="uiHead">📓 Forward paper-play record</div>'
      + '<div class="uiNote" style="margin:-4px 0 10px">Captured before the result is known. '
      +   'A skip is your decision, not a validated winning signal — skips do not reset CTWL.</div>'
      + state
      + '<div style="display:flex;gap:6px">'
      +   '<button class="lvlbtn" style="flex:1" onclick="captureCall(false)"'
      +     (held ? ' disabled' : '') + '>Capture play</button>'
      +   '<button class="lvlbtn" style="flex:1" onclick="captureCall(true)"'
      +     (held ? ' disabled' : '') + '>Capture skip</button>'
      + '</div>'
      + '<div class="uiTiles">'
      +   '<div class="uiTile"><div class="uiTileV" style="color:var(--text)">' + st.w + '/' + st.n
      +     '</div><div class="uiTileL">correct' + (pct === null ? '' : ' · ' + pct + '%') + '</div></div>'
      +   '<div class="uiTile"><div class="uiTileV" style="color:var(--text2)">' + st.skips
      +     '</div><div class="uiTileL">skipped</div></div>'
      +   '<div class="uiTile"><div class="uiTileV" style="color:' + ctwlCol + '">' + st.run
      +     '<span style="font-size:11px;color:var(--text3)"> / ' + st.max + '</span>'
      +     '</div><div class="uiTileL">CTWL now / worst</div></div>'
      + '</div>'
      + '<div class="uiNote">Records cover this chosen-method sequence, not actual bets or profit. '
      +   'After two losses, consider capturing skips to collect more observations. '
      +   'Returning to play can still lose.</div>'
      + '</div>';
  }

  /* ── AI Predict: the app's own panel, with those two parts redrawn ────── */
  if (typeof basePredict === 'function') {
    window.renderPredict = function(){
      basePredict();
      if (state.results.length > PRED_UNLOCK)
        reface('panelPredict', 'Selected method · historical replay',
          '<div class="uiHead" style="margin-bottom:2px">📊 Selected method · historical replay</div>'
          + accRows(function(l){ return methodAccuracy(l); }, true)
          + '<div class="uiNote">Above-chance history is exploratory, not proof of a profitable '
          + 'edge or fairness. CTWL is current / maximum replay losses.</div>');
      document.getElementById('panelPredict').innerHTML += paperCard();
    };
  }

  /* ── Smart Pick: the same accuracy block, same treatment ──────────────── */
  var basePick = window.renderPick;
  if (typeof basePick === 'function' && typeof numberAccuracy === 'function') {
    window.renderPick = function(){
      basePick();
      if (state.results.length > PRED_UNLOCK)
        reface('panelPick', '📊 Smart-pick accuracy (backtested)',
          '<div class="uiHead" style="margin-bottom:2px">📊 Smart-pick accuracy (backtested)</div>'
          + accRows(function(l){ return numberAccuracy(l); }, false)
          + '<div class="uiNote">A bar to the right of the line is a real edge over picking '
          + 'blind. If every level sits on the line, the wheel is fair and there is no edge.</div>');
    };
  }

  /* ══ 3. PATTERNS ═══════════════════════════════════════════════════════
     Every finding here is the same shape — this happened N times, chance alone
     gives M — so every finding gets the same picture. The thresholds, the
     verdicts and the wording are the app's own, untouched. */
  window.renderPatterns = function(){
    var el = document.getElementById('panelPatterns');
    var R = state.results, tot = R.length;
    if (tot < 20) {
      el.innerHTML = '<div class="empty">Pattern analysis needs 20+ draws.<br>You have '
                   + tot + '. Log ' + (20 - tot) + ' more.</div>';
      return;
    }
    var seq = R.map(function(r){ return r.n; }), out = '';

    /* back-to-back repeats */
    var repeats = 0;
    for (var i = 1; i < tot; i++) if (seq[i] === seq[i-1]) repeats++;
    var expRep = (tot - 1) / 28;
    var rv = repeats > expRep * 2.5 ? {t:'more than chance', c:'var(--green)'}
           : repeats > expRep * 1.5 ? {t:'slightly elevated', c:'var(--gold)'}
           : {t:'just random', c:'var(--text3)'};
    out += '<div class="uiCard"><div class="uiHead">🔁 Back-to-back repeats ' + pill(rv.t, rv.c) + '</div>'
         + pairBars('seen', repeats, 'by chance', expRep, rv.c, '×')
         + '<div class="uiNote">The same number landing twice running.</div></div>';

    /* strongest follow-pair */
    var follow = {};
    for (var i = 1; i < tot; i++) {
      var a = seq[i-1], b = seq[i];
      if (!follow[a]) follow[a] = {};
      follow[a][b] = (follow[a][b] || 0) + 1;
    }
    var bestPair = null;
    Object.keys(follow).forEach(function(a){
      Object.keys(follow[a]).forEach(function(b){
        var cnt = follow[a][b];
        if (cnt >= 3 && (!bestPair || cnt > bestPair.cnt)) bestPair = {a:+a, b:+b, cnt:cnt};
      });
    });
    if (bestPair) {
      var fCol = bestPair.cnt >= 4 ? 'var(--gold)' : 'var(--text3)';
      out += '<div class="uiCard"><div class="uiHead">➡️ Strongest follow-pair '
        + pill(bestPair.cnt >= 4 ? 'worth watching' : 'likely coincidence', fCol) + '</div>'
        + '<div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0">'
        +   '<span class="chip" style="background:' + colorOf(bestPair.a).col + ';font-size:15px;padding:7px 13px">'
        +     bestPair.a + '</span>'
        +   '<span style="color:var(--text3);font-size:15px">→</span>'
        +   '<span class="chip" style="background:' + colorOf(bestPair.b).col + ';font-size:15px;padding:7px 13px">'
        +     bestPair.b + '</span>'
        +   '<span style="font-size:15px;font-weight:800;color:' + fCol + '">' + bestPair.cnt + '×</span>'
        + '</div>'
        + '<div class="uiNote">Whenever ' + bestPair.a + ' came up, ' + bestPair.b
        +   ' followed it more often than any other pair in your history.</div></div>';
    }

    /* runs of consecutive numbers */
    var asc = 0, desc = 0;
    for (var i = 2; i < tot; i++) {
      if (seq[i] === seq[i-1] + 1 && seq[i-1] === seq[i-2] + 1) asc++;
      if (seq[i] === seq[i-1] - 1 && seq[i-1] === seq[i-2] - 1) desc++;
    }
    /* The comparison the app actually judges on is the TOTAL against its usual
       level — not ascending against descending, which are two different things
       and would make 0 vs 1 look like a finding. */
    var seqTot = asc + desc, seqUsual = tot * 0.05;
    var seqHot = seqTot > seqUsual;
    var sCol = seqHot ? 'var(--gold)' : 'var(--text3)';
    out += '<div class="uiCard"><div class="uiHead">🔢 Sequences, like 5-6-7 '
      + pill(seqHot ? 'more than usual' : 'normal for random', sCol) + '</div>'
      + pairBars('seen', seqTot, 'usual level', seqUsual, seqHot ? sCol : 'var(--text2)', '')
      + '<div class="uiNote">Three in a row, each one step from the last — '
      + asc + ' going up, ' + desc + ' going down.</div></div>';

    /* how often the side changes */
    var sbAlt = 0, eoAlt = 0;
    for (var i = 1; i < tot; i++) {
      if (catsOf(seq[i]).s !== catsOf(seq[i-1]).s) sbAlt++;
      if (catsOf(seq[i]).p !== catsOf(seq[i-1]).p) eoAlt++;
    }
    var sbP = Math.round(sbAlt / (tot-1) * 100), eoP = Math.round(eoAlt / (tot-1) * 100);
    function an(p){
      if (p >= 72) return {t:'flips a lot', c:'var(--gold)'};
      if (p <= 28) return {t:'sticks to a side', c:'var(--gold)'};
      return {t:'balanced', c:'var(--text3)'};
    }
    function flipRow(name, p){
      var v = an(p), col = v.c === 'var(--text3)' ? 'var(--border2)' : v.c;
      return '<div class="uiRow"><div class="uiTop">'
        + '<span class="uiName">' + name + '</span>'
        + '<span><b class="uiVal" style="color:' + v.c + '">' + p + '%</b>'
        +   '<span style="font-size:9px;color:var(--text3)"> / 50% expected</span></span></div>'
        + divBar(p - 50, 25, col)
        + '<div class="uiSub"><span>' + (p >= 50 ? 'changes side more often' : 'repeats a side more often')
        + '</span><span style="color:' + v.c + '">' + (p - 50 > 0 ? '+' : '') + (p - 50) + pts(p - 50) + ' · '
        + v.t + '</span></div></div>';
    }
    out += '<div class="uiCard"><div class="uiHead">🅰️ How often the side changes</div>'
         + flipRow('Small ↔ Big', sbP) + flipRow('Even ↔ Odd', eoP) + '</div>';

    /* the headline, using the app's own test for whether anything stands out */
    var anyReal = repeats > expRep * 3 || (bestPair && bestPair.cnt >= 5)
               || (asc + desc) > tot * 0.08 || sbP >= 72 || sbP <= 28 || eoP >= 72 || eoP <= 28;
    var hCol = anyReal ? 'var(--gold)' : 'var(--accent2)';
    var head = '<div style="background:' + (anyReal ? 'rgba(255,209,102,.08)' : 'rgba(255,95,109,.06)')
      + ';border:1px solid ' + (anyReal ? 'var(--gold)' : 'var(--border)')
      + ';border-radius:10px;padding:11px;margin-bottom:2px">'
      + '<div style="font-size:13px;font-weight:800;color:' + hCol + '">'
      +   (anyReal ? '🤔 Some patterns stand out' : '🎲 No real patterns — looks random') + '</div>'
      + '<div style="font-size:10px;color:var(--text2);margin-top:4px;line-height:1.5">'
      +   (anyReal ? 'One or more appear above random chance. Watch them, keep logging — small samples fool us.'
                   : 'Repeats, sequences and flips all at random levels. No exploitable pattern yet.')
      + '</div></div>';

    el.innerHTML = head + out
      + '<div class="uiNote">🧠 Reports whether patterns are <b>statistically real</b> or coincidence. '
      + 'Even "worth watching" ones can vanish with more data. Only trust a pattern if it stays strong '
      + 'over 50+ draws AND Smart-Pick accuracy beats random.</div>';
  };

  /* ══ 4. THE DISTRIBUTION CHECK ═════════════════════════════════════════ */
  window.renderRandom = function(){
    var tot = state.results.length, c = counts();
    var el = document.getElementById('panelRandom');
    if (!tot) { el.innerHTML = '<div class="empty">Log draws to compare against chance.</div>'; return; }

    var mid = c.slice(12, 16).reduce(function(a,b){ return a+b; }, 0), midExp = tot * 0.296;
    var ext = [0,1,26,27].reduce(function(a,n){ return a + c[n]; }, 0), extExp = tot * 0.008;

    function block(title, sub, seen, exp){
      var ratio = exp > 0 ? seen / exp : 1;
      var col = (ratio > 1.35 || ratio < 0.65) ? 'var(--gold)' : 'var(--text2)';
      var word = ratio > 1.35 ? 'above expectation' : ratio < 0.65 ? 'below expectation' : 'about as expected';
      return '<div class="uiCard"><div class="uiHead">' + title + ' ' + pill(word, col) + '</div>'
        + pairBars('seen', seen, 'expected', exp, col, '')
        + '<div class="uiNote">' + sub + '</div></div>';
    }

    el.innerHTML =
        '<div class="uiNote" style="margin:0 0 4px">Three digits added together do not land evenly, '
      + 'so uneven counts are normal. These are the two ends of that shape, against what it '
      + 'predicts over your ' + tot + ' draws.</div>'
      + block('🎯 Middle totals, 12–15', 'Where three digits land most often — roughly 29.6% of draws.',
              mid, midExp)
      + block('🎲 The extremes, 0 · 1 · 26 · 27', 'The rarest totals on the board — roughly 0.8% of draws.',
              ext, extExp)
      + '<div class="uiNote">Descriptive comparison only. Expected counts this small make a uniform '
      + 'chi-square verdict invalid, so this screen does not declare fairness, bias or profit.</div>';
  };

  /* ══ 5. STREAKS ════════════════════════════════════════════════════════
     A run of things, drawn as a run of things. Filled is what is happening
     now; the hollow ones behind it are how far the record goes. */
  window.renderStreaks = function(){
    var el = document.getElementById('panelStreaks'), tot = state.results.length;
    if (tot < 3) { el.innerHTML = '<div class="empty">Log at least 3 draws.</div>'; return; }

    function si(g){
      var cur = 1, max = 1, cv = g(state.results[tot-1]);
      for (var i = tot-2; i >= 0; i--) { if (g(state.results[i]) === cv) cur++; else break; }
      var run = 1;
      for (var i = 1; i < tot; i++) {
        if (g(state.results[i]) === g(state.results[i-1])) { run++; if (run > max) max = run; }
        else run = 1;
      }
      return { cur:cur, cv:cv, max:max };
    }

    function card(title, s, col, label){
      var show = Math.min(s.max, 24), pips = '';
      for (var i = 0; i < show; i++) {
        pips += i < Math.min(s.cur, show)
          ? '<div class="uiPip" style="background:' + col + '"></div>'
          : '<div class="uiPip" style="background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--text3)"></div>';
      }
      if (s.max > 24) pips += '<div style="font-size:9px;color:var(--text3);align-self:center">+'
                            + (s.max - 24) + '</div>';
      return '<div class="uiCard"><div class="uiTop" style="margin-bottom:2px">'
        + '<span class="uiName">' + title + '</span>'
        + '<span><b class="uiVal" style="color:' + col + '">' + s.cur + '×</b>'
        +   '<span style="font-size:10px;color:var(--text2)"> ' + esc(label) + '</span></span></div>'
        + '<div class="uiPips">' + pips + '</div>'
        + '<div class="uiSub" style="margin-top:0"><span>running now</span>'
        + '<span>longest ever ' + s.max + '</span></div></div>';
    }

    var sb = si(function(r){ return catsOf(r.n).s; }),
        eo = si(function(r){ return catsOf(r.n).p; }),
        cl = si(function(r){ return colorOf(r.n).key; });

    el.innerHTML =
        card('Small / Big', sb, sb.cv === 'S' ? 'var(--gold)' : 'var(--blue)',
             sb.cv === 'S' ? 'Small in a row' : 'Big in a row')
      + card('Even / Odd', eo, eo.cv === 'E' ? 'var(--green)' : 'var(--purple)',
             eo.cv === 'E' ? 'Even in a row' : 'Odd in a row')
      + card('Colour', cl, colorOf(state.results[tot-1].n).col, cl.cv + ' in a row')
      + '<div class="uiNote">Long streaks happen even in random games. A streak isn\'t "due" to break.</div>';
  };

})();

/* ══════════════════════════════════════════════════════════════════════════
   SMOOTH — the lag, measured and then removed. Nothing above is touched.

   WHAT IT COSTS TO LOG ONE RESULT, before any of this:

       draws        phone      emulator (6x slower)
          60        110ms         248ms
         300         94ms         558ms
         800        441ms       1,778ms

   Nearly two seconds of frozen screen for one tap, and it gets worse every
   round for ever. Two reasons, both fixable without changing a single thing
   the app says.

   ONE — renderAll() redraws eleven panels and ten of them are not on screen.
   Only the visible one is drawn now; the rest are marked stale and drawn the
   moment you switch to them. Same pixels, a tenth of the work.

   TWO — the historical replay is quadratic. Every call walks the whole history
   from the unlock point, and every step of that walk scores all 28 numbers
   over everything before it. At 800 draws that is hundreds of thousands of
   evaluations, repeated in full every single time a result is logged.

   But a replay over 801 draws is the replay over 800 plus ONE more round. So
   it is kept and extended instead of rebuilt. The answer is identical - this
   is not an approximation or a shortened window, it is the same walk, done
   once. Cost per logged result goes from growing-forever to flat.

   Everything here is an override of a function that already existed, so the
   numbers on screen are unchanged. Delete this block and the app still works,
   just slowly.
   ══════════════════════════════════════════════════════════════════════════ */
(function(){

  /* ── A NOTE ON WHAT IS DELIBERATELY NOT HERE ──────────────────────────
     I tried telling the browser to skip drawing the history rows that are off
     the screen (content-visibility), which sounds like exactly the right idea
     for a fifty-row list. It made things worse in the way that matters.

     Skipping a row means promising the browser how tall it will be, and that
     promise describes the row's CONTENT — the padding around it is added on
     afterwards. Each row is 34px of content inside 12px of padding, so a
     promise of 46 produced a 58px row. Over fifty rows the page claimed to be
     3203px tall when it is really 2603px. Scroll into that and the rows arrive
     at their true height, the page shrinks under your thumb, and the scroll
     position lurches — which is the exact complaint I was trying to fix.

     It was worth under three milliseconds a draw. The real gains were the two
     replays and the dates below, and those cost nothing in return.           */

  var PANELS = ['Predict','Methods','Pick','Colors','Freq','HotCold','Cats',
                'Streaks','Random','Patterns','History'];
  var RENDER = {};                 /* panel -> its own render function */
  PANELS.forEach(function(p){
    var fn = window['render' + p];
    if (typeof fn === 'function') RENDER[p] = fn;
  });

  var stale = {};                  /* panels that need drawing when next seen */
  PANELS.forEach(function(p){ stale[p] = false; });

  function visible(){
    for (var i = 0; i < PANELS.length; i++) {
      var el = document.getElementById('panel' + PANELS[i]);
      if (el && el.style.display !== 'none') return PANELS[i];
    }
    return 'Predict';
  }

  function drawOne(p){
    var fn = RENDER[p];
    if (!fn) return;
    try { fn(); stale[p] = false; } catch(e){}
  }

  /* ── renderAll, but only for the panel you are looking at ────────────── */
  var baseAll = window.renderAll;
  window.renderAll = function(){
    try {
      var c = document.getElementById('count');
      if (c) c.textContent = state.results.length;
    } catch(e){}
    PANELS.forEach(function(p){ stale[p] = true; });
    drawOne(visible());
  };

  /* switching tabs draws whatever has gone stale while you were away */
  var baseSw = window.sw;
  if (typeof baseSw === 'function') {
    window.sw = function(tab, btn){
      baseSw(tab, btn);
      if (stale[tab]) drawOne(tab);
    };
  }

  /* ══ THE REPLAY, KEPT INSTEAD OF REBUILT ═══════════════════════════════
     methodAccuracy walks from PRED_UNLOCK to the end of the history and asks
     the method to rank every number at each step. That walk is identical for
     the first N-1 rounds every time it runs, so it is stored and only the new
     tail is ever computed.                                                  */
  var MEMO = {};
  function memoKey(level, method){ return level + '|' + (method || '*'); }

  var baseMA = window.methodAccuracy;
  if (typeof baseMA === 'function' && typeof methodScores === 'function') {
    window.methodAccuracy = function(level, forceMethod){
      try {
        var R = state.results;
        if (!R || R.length <= PRED_UNLOCK) return null;
        var k = memoKey(level, forceMethod || (typeof predMethod === 'function' ? predMethod() : ''));
        var m = MEMO[k];
        /* history rewound (undo, clear, import) - throw the walk away */
        if (m && m.upto > R.length) m = null;
        if (!m) m = { upto: PRED_UNLOCK, hit: 0, tot: 0, run: 0, maxRun: 0 };
        var howMany = LEVELS[level - 1];
        for (var i = m.upto; i < R.length; i++) {
          var top = methodScores(i, forceMethod).slice(0, howMany).map(function(x){ return x.n; });
          if (top.indexOf(R[i].n) >= 0) { m.hit++; m.run = 0; }
          else { m.run++; if (m.run > m.maxRun) m.maxRun = m.run; }
          m.tot++;
        }
        m.upto = R.length;
        MEMO[k] = m;
        return { hit:m.hit, tot:m.tot, run:m.run, maxRun:m.maxRun,
                 pct: m.tot ? Math.round(m.hit / m.tot * 100) : null };
      } catch(e){ return baseMA(level, forceMethod); }
    };
  }

  /* the same trick for the original AI accuracy, where it is still used */
  var baseAA = window.aiAccuracy;
  if (typeof baseAA === 'function' && typeof aiScores === 'function') {
    var AMEMO = {};
    window.aiAccuracy = function(level){
      try {
        var R = state.results;
        if (!R || R.length <= PRED_UNLOCK) return null;
        var m = AMEMO[level];
        if (m && m.upto > R.length) m = null;
        if (!m) m = { upto: PRED_UNLOCK, hit: 0, tot: 0 };
        var howMany = LEVELS[level - 1];
        for (var i = m.upto; i < R.length; i++) {
          var top = aiScores(i).slice(0, howMany).map(function(x){ return x.n; });
          if (top.indexOf(R[i].n) >= 0) m.hit++;
          m.tot++;
        }
        m.upto = R.length;
        AMEMO[level] = m;
        return { hit:m.hit, tot:m.tot, howMany:howMany,
                 pct: m.tot ? Math.round(m.hit / m.tot * 100) : null };
      } catch(e){ return baseAA(level); }
    };
  }

  /* ══ THE TWO THAT WERE STILL DOING IT THE SLOW WAY ═════════════════════
     Fixing the method replay left two others untouched, and they were worse.
     Smart Pick and Colours each run their own replay, and each one rebuilds a
     running count FROM SCRATCH at every step of the walk:

         for (i = 30; i < draws; i++)
             for (j = 0; j < i; j++) count[result[j]]++      <- the whole history
             ...rank, check, discard the counts...           <- thrown away again

     That is a loop inside a loop inside a render. At 600 draws it is 180,000
     counts for ONE level, and Smart Pick asks for seven of them, so 1.26
     million every time the screen is drawn — which is every time a result is
     logged. Measured on a phone-speed processor: 210ms for Smart Pick, 128ms
     for Colours, and both climbing for ever.

     Two things fix it, and neither changes an answer.

     FIRST, the count is a running total. Score the round, THEN add that round's
     result to the counts, and the next round already has what it needs. The
     inner loop disappears.

     SECOND, every level is looking at the same ranking — the only difference is
     how far down the list it reads. So the ranking is built once per round and
     all seven levels are answered from it, instead of seven separate walks.

     And the walk is kept between renders like the other one, so a new result
     extends it by a single round. 210ms becomes about one.                    */

  /* ── THE DATES IN THE HISTORY LIST ────────────────────────────────────
     Every row shows a date and a time, and fmtTime works them out with
     toLocaleDateString and toLocaleTimeString. Those two look harmless and are
     not: each call builds a fresh date formatter, works out the locale, and
     throws the whole thing away again. The list draws fifty rows, so that is a
     hundred of them every time the screen updates — measured at 79ms on a
     phone-speed processor, for text that cannot possibly have changed.

     A result's timestamp is fixed the moment it is logged. So each one is
     formatted once, ever, and remembered. Same string, no work. */
  var FMT = Object.create(null);
  var baseFmt = window.fmtTime;
  if (typeof baseFmt === 'function') {
    window.fmtTime = function(ts){
      var k = '' + ts;
      var v = FMT[k];
      if (v === undefined) { v = baseFmt(ts); FMT[k] = v; }
      return v;
    };
  }

  var NMEMO = null;
  var baseNA = window.numberAccuracy;
  if (typeof baseNA === 'function') {
    window.numberAccuracy = function(level){
      try {
        var R = state.results;
        if (!R || R.length <= PRED_UNLOCK) return null;
        var m = NMEMO;
        if (m && (m.upto > R.length || m.levels !== LEVELS.join())) m = null;
        if (!m) {
          m = { upto:PRED_UNLOCK, c:new Array(MAX+1).fill(0), hit:[], tot:0, levels:LEVELS.join() };
          for (var s = 0; s < PRED_UNLOCK && s < R.length; s++) m.c[R[s].n]++;
          for (var L = 0; L <= LEVELS.length; L++) m.hit[L] = 0;
        }
        for (var i = m.upto; i < R.length; i++) {
          /* the same array, built the same way, sorted with the same comparator,
             so equal counts still fall in ascending number order */
          var ranked = m.c.map(function(cnt, n){ return {n:n, cnt:cnt}; })
                          .sort(function(a, b){ return b.cnt - a.cnt; });
          var want = R[i].n;
          for (var L = 1; L <= LEVELS.length; L++) {
            var howMany = LEVELS[L-1];
            for (var k = 0; k < howMany; k++)
              if (ranked[k].n === want) { m.hit[L]++; break; }
          }
          m.tot++;
          m.c[want]++;                       /* now it counts, for the next round */
        }
        m.upto = R.length; NMEMO = m;
        return { hit:m.hit[level], tot:m.tot, howMany:LEVELS[level-1],
                 pct: m.tot ? Math.round(m.hit[level] / m.tot * 100) : null };
      } catch(e){ return baseNA(level); }
    };
  }

  var CMEMO = null;
  var baseCA = window.colorAccuracy;
  if (typeof baseCA === 'function') {
    window.colorAccuracy = function(level){
      try {
        var R = state.results;
        if (!R || R.length <= PRED_UNLOCK) return null;
        var m = CMEMO;
        if (m && m.upto > R.length) m = null;
        if (!m) {
          m = { upto:PRED_UNLOCK, cnt:{}, hit:[], tot:0 };
          COLORS.forEach(function(c){ m.cnt[c.key] = 0; });
          for (var s = 0; s < PRED_UNLOCK && s < R.length; s++) m.cnt[colorOf(R[s].n).key]++;
          for (var L = 0; L <= COLORS.length; L++) m.hit[L] = 0;
        }
        for (var i = m.upto; i < R.length; i++) {
          var ranked = COLORS.map(function(c){ return {key:c.key, n:m.cnt[c.key]}; })
                             .sort(function(a, b){ return b.n - a.n; });
          var key = colorOf(R[i].n).key;
          for (var L = 1; L <= COLORS.length; L++)
            for (var j = 0; j < L; j++)
              if (ranked[j].key === key) { m.hit[L]++; break; }
          m.tot++;
          m.cnt[key]++;
        }
        m.upto = R.length; CMEMO = m;
        return { hit:m.hit[level], tot:m.tot,
                 pct: m.tot ? Math.round(m.hit[level] / m.tot * 100) : null };
      } catch(e){ return baseCA(level); }
    };
  }

  /* Undo, clear and import all rewind the history, and a kept walk that is
     longer than the history it describes would be wrong. The guards above
     catch it, but dropping the memo outright is cheaper and clearer. */
  ['undoLast','clearAll','importData'].forEach(function(name){
    var base = window[name];
    if (typeof base !== 'function') return;
    window[name] = function(){
      MEMO = {}; NMEMO = null; CMEMO = null;
      return base.apply(this, arguments);
    };
  });

  /* ── one draw per burst ───────────────────────────────────────────────
     A watcher catching up can add several results at once. Without this each
     one repaints; with it they share a single repaint, which is what makes a
     burst feel instant.

     THIS USED TO WAIT FOR AN IDLE MOMENT, AND THAT WAS THE BUG behind results
     not appearing until you tapped another tab. requestIdleCallback hands you
     the leftovers of a frame — so it only fires if the page is producing
     frames. Sitting in split-screen beside Chamet, with the game focused and
     this app just visible alongside it, Android has no reason to keep painting
     a window nobody is touching. No frames, no leftovers, no repaint. The
     result was safely in your history the whole time; the screen simply never
     got told. Tapping a tab drew it immediately, which is exactly the shape of
     the complaint.

     A plain timer does not care whether anything is being painted. It fires,
     the screen updates, and the tab you are on is the tab that changes.      */
  var pending = false;
  window.__lntRepaint = function(){
    if (pending) return;
    pending = true;
    setTimeout(function(){
      pending = false;
      try { renderAll(); } catch(e){}
    }, 30);                       /* long enough to swallow a burst, short
                                     enough that you never see the wait */
  };
})();

/* ══════════════════════════════════════════════════════════════════════════
   THE AUTO BRIDGE — nothing above this line has been touched.

   Everything in the tracker stays exactly as it was written. This is appended
   underneath and only ever calls the functions that were already there:
   captureCall to freeze a call before the result, state.results.push and
   save() to record it, renderAll() to redraw. Delete this block and the app is
   byte-for-byte the file you sent.

   WHAT IT DOES, once per round:

     board appears with time on the clock  ->  captureCall(false)
     the result strip gains a new number   ->  record it against that call
     redraw, and wait for the next board

   That is the whole loop. The accessibility service in the APK is what sees
   the screen; in a browser nothing ever calls into here and the app behaves
   exactly as it always has.

   ONE RULE ABOUT DUPLICATES, because it is the thing that would quietly ruin
   the history: the game keeps the last ten results on screen and the watcher
   reads them every second, so the same ten arrive over and over. Only the tail
   that is genuinely new is ever appended, matched against what is already
   stored. A strip that has not moved adds nothing.
   ══════════════════════════════════════════════════════════════════════════ */
(function(){
  var AUTO = { on:false, at:0, board:null, raw:'', logged:0, captured:0, lastSecs:-1,
               orient:null, orientHow:'', gaps:0 };
  window.__LNT_AUTO = AUTO;

  function native(){
    try { return !!(window.Android28 && window.Android28.watching()); } catch(e){ return false; }
  }

  /* ── WHICH END OF THE STRIP IS THE NEW ONE? ───────────────────────────
     The game shows the last ten results in a row and the watcher reads them
     left to right. Whether the newest sits at the left end or the right end is
     not something I am willing to assume — assume it backwards and every
     result goes into your history in reverse, which looks fine on screen and
     quietly poisons every method that reads the order.

     So it is not assumed. It is watched. When a round ends the row shifts by
     exactly one: the end that GAINED a number is the new end, and the other
     end drops one. That is a fact about the screen, visible in two consecutive
     readings, and it needs no history and no guesswork:

         before   12 10  7 21  6  9 24 16 11 14
         after     3 12 10  7 21  6  9 24 16 11     <- everything moved right,
                   ^ the new one                       so the newest is on the left

     Once seen it is remembered, because a game does not change which way its
     own history runs. Until it is seen, nothing is logged — one round of
     patience at first launch, against getting the whole history backwards. */
  var ORIENT = null;                 /* 'new-first' | 'old-first' */
  try { ORIENT = localStorage.getItem('lntOrient') || null; } catch(e){}
  if (ORIENT) { AUTO.orient = ORIENT; AUTO.orientHow = 'remembered from last time'; }
  var lastStrip = null;

  function lockOrient(o, how){
    if (!o || ORIENT === o) return;
    ORIENT = o;
    AUTO.orient = o; AUTO.orientHow = how;
    try { localStorage.setItem('lntOrient', o); } catch(e){}
  }

  /* the shift test — definitive, from two consecutive readings */
  function fromShift(prev, cur){
    if (!prev || prev.length < 4 || cur.length < 4) return null;
    var n = Math.min(prev.length, cur.length);
    if (prev.slice(0, n).join() === cur.slice(0, n).join()) return null;   /* nothing moved */
    if (cur.slice(1, n).join() === prev.slice(0, n - 1).join()) return 'new-first';
    if (cur.slice(0, n - 1).join() === prev.slice(1, n).join()) return 'old-first';
    return null;
  }

  /* how much of the strip is already at the end of the stored history */
  function overlap(have, s){
    var t = have.slice(-s.length);
    for (var k = Math.min(s.length, t.length); k > 0; k--)
      if (t.slice(-k).join() === s.slice(0, k).join()) return k;
    return 0;
  }

  /* ── the de-duplicator ────────────────────────────────────────────────
     With the direction known, put the strip oldest-first, line it up against
     the end of what is already stored, and keep only what hangs off the end.
     A strip that has not moved lines up completely and adds nothing.

     The direction is re-checked on every single reading, not just the first.
     A remembered answer that no longer fits what is stored is not a memory
     worth keeping - if the row lines up beautifully one way round and not at
     all the other, that is the answer, whatever was decided last week. Getting
     this wrong once and then trusting it is how a history quietly fills with
     nonsense, so nothing here is ever taken on trust twice. */
  function newTail(strip){
    /* Only the tail is ever compared, so only the tail is ever built. This used
       to copy the whole history into a new array on every reading — once a
       second, for ever, growing as you play. At six hundred draws that is six
       hundred pointless allocations a second, and the rubbish it leaves behind
       is collected at moments the phone chooses, which is exactly the kind of
       hitch you feel while scrolling. Ten is all it needs. */
    var have = state.results.slice(-strip.length).map(function(r){ return r.n; });

    /* the definitive test, whenever the row has just moved */
    lockOrient(fromShift(lastStrip, strip), 'watched the row shift');
    lastStrip = strip.slice();

    /* and the standing check: which way round actually fits the history */
    var asc = strip.slice(), desc = strip.slice().reverse();
    var oAsc = overlap(have, asc), oDesc = overlap(have, desc);
    if (oAsc >= 3 && oAsc > oDesc)       lockOrient('old-first', 'matched your stored history');
    else if (oDesc >= 3 && oDesc > oAsc) lockOrient('new-first', 'matched your stored history');

    if (!ORIENT) return [];                  /* wait a round rather than guess */

    var use = (ORIENT === 'new-first') ? desc : asc;
    var k = overlap(have, use);
    /* Nothing lined up at all. Either the app has been shut for a while and
       these ten are genuinely all new, or something is wrong. Both readings
       disagreeing with the history is the honest signal for the first, so they
       go in - but it is counted, so it shows up in the diagnostics. */
    if (k === 0 && have.length) AUTO.gaps++;
    return use.slice(k);
  }

  /* ── record one result, honouring the capture flow that is already here ── */
  function record(n){
    if (!(n >= 0 && n <= 27)) return false;
    var row = { n:n, t:Date.now() };
    if (typeof captured !== 'undefined' && captured) { row.call = captured; captured = null; }
    state.results.push(row);
    return true;
  }

  /* ── freeze a call while the clock is still running ──────────────────── */
  function grabCall(){
    try {
      if (typeof captured !== 'undefined' && captured) return;   // one at a time
      if (state.results.length < 10) return;                     // the app's own floor
      if (typeof captureCall !== 'function') return;
      captureCall(false);
      if (captured) AUTO.captured++;
    } catch(e){}
  }

  window.__l28Push = function(b){
    try {
      if (!b) return;
      AUTO.on = true; AUTO.at = Date.now(); AUTO.board = b;
      try { AUTO.raw = String(window.__l28Raw || ''); } catch(e){}

      /* A board with time left is a board you could still bet on, so that is
         the moment the call gets written down. Re-reading the same board does
         nothing, because grabCall refuses while one is already captured. */
      if (b.secs != null && b.secs > 0 && b.secs <= 40) grabCall();
      AUTO.lastSecs = (b.secs != null) ? b.secs : -1;

      if (b.results && b.results.length) {
        var add = newTail(b.results.filter(function(n){ return n >= 0 && n <= 27; }));
        if (add.length) {
          var did = 0;
          for (var i = 0; i < add.length; i++) if (record(add[i])) did++;
          if (did) {
            AUTO.logged += did;
            save();
            /* several at once share one repaint, which is what makes a burst
               after the app has been shut feel instant instead of frozen */
            if (window.__lntRepaint) window.__lntRepaint(); else renderAll();
          }
        }
      }
      bar();
    } catch(e){}
  };

  /* ── a thin status strip, so it is obvious whether anything is watching ── */
  function bar(){
    var el = document.getElementById('lntAuto');
    if (!el) {
      el = document.createElement('div');
      el.id = 'lntAuto';
      /* No backdrop-filter here. A blurred bar pinned over scrolling content
         has to re-blur everything behind it on every single frame you scroll,
         which on a phone is the difference between gliding and sticking. A
         solid background costs nothing and looks the same. */
      el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:900;padding:7px 10px;'
        + 'font-size:10.5px;font-weight:700;text-align:center;contain:content;'
        + 'border-top:1px solid rgba(255,255,255,.12)';
      document.body.appendChild(el);
      document.body.style.paddingBottom = '38px';
    }
    var fresh = AUTO.at && (Date.now() - AUTO.at) < 6000;
    var b = AUTO.board || {};
    var bits = [];
    if (b.secs != null && b.secs >= 0) bits.push(b.secs + 's');
    if (b.results && b.results.length) bits.push('strip ' + b.results.length);
    bits.push(AUTO.logged + ' auto-logged');
    if (typeof captured !== 'undefined' && captured) bits.push('call held');

    /* WRITE NOTHING UNLESS SOMETHING CHANGED.
       This runs on a timer and again on every reading from the watcher, so it
       was rewriting a pinned bar roughly once a second whether or not a single
       character was different. Every rewrite makes the browser lay the page out
       again, and a layout in the middle of a scroll is a stutter you can feel.
       Now the text is built first and compared; if it reads the same, the DOM
       is not touched at all and the scroll is left alone. */
    var bg, fg, html;
    if (!AUTO.at) {
      var canAsk = false; try { canAsk = !!window.Android28; } catch(e){}
      bg = 'rgba(20,20,20,.92)'; fg = '#8a8a8a';
      html = canAsk
        ? 'Auto is off — <span style="color:#FFD166;text-decoration:underline" '
          + 'onclick="try{Android28.openAccessibility()}catch(e){}">switch on Lucky Number Tracker '
          + 'under Accessibility</span>'
        : 'Manual mode — a browser cannot see the game. The Android build reads it by itself.';
    } else {
      bg = fresh ? 'rgba(0,229,160,.14)' : 'rgba(20,20,20,.92)';
      fg = fresh ? '#00E5A0' : '#8a8a8a';
      html = (fresh ? '🤖 reading the board · ' : '🤖 waiting for a board · ') + bits.join(' · ')
        + ' <span style="opacity:.6;text-decoration:underline" onclick="__lntDiag()">what can it see?</span>';
    }
    if (html === LAST_BAR && bg === LAST_BG) return;
    LAST_BAR = html; LAST_BG = bg;
    el.style.background = bg;
    el.style.color = fg;
    el.innerHTML = html;
  }
  var LAST_BAR = null, LAST_BG = null;
  setInterval(function(){ try{ bar(); }catch(e){} }, 2000);
  if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(bar, 300);
  else document.addEventListener('DOMContentLoaded', function(){ setTimeout(bar, 300); });

  window.__lntDiag = function(){
    var b = AUTO.board || {};
    alert('WHAT THE WATCHER LAST SAW\n\n'
      + 'screen: ' + (b.mode || '—') + '\n'
      + 'clock: ' + (b.secs >= 0 ? b.secs + 's' : '—') + '\n'
      + 'strip: ' + ((b.results && b.results.length) ? b.results.join(' ') : '—') + '\n'
      + 'auto-logged this session: ' + AUTO.logged + '\n'
      + 'calls captured: ' + AUTO.captured + '\n'
      + (b.note ? ('note: ' + b.note + '\n') : '')
      + '\nRAW TEXT IT READ:\n' + (AUTO.raw || '(nothing)'));
  };
})();

/* ══════════════════════════════════════════════════════════════════════════
   INSTALLABLE FROM A BROWSER, WITHOUT EDITING YOUR HEAD TAG.

   Your file has no manifest link and no service worker, and I would rather add
   them from down here at runtime than reach up into your markup. Same result:
   open the site once and "Add to home screen" gives you a real app icon that
   opens full screen and still works with no signal.

   Inside the APK none of this runs. The app is loaded from the phone itself
   there, service workers do not apply, and the accessibility service is doing
   the work anyway - so this quietly does nothing and stays out of the way.
   ══════════════════════════════════════════════════════════════════════════ */
(function(){
  if (!/^https?:$/.test(location.protocol)) return;      /* file:// inside the APK */
  try {
    if (!document.querySelector('link[rel="manifest"]')) {
      var l = document.createElement('link');
      l.rel = 'manifest'; l.href = './manifest.json';
      document.head.appendChild(l);
    }
    if (!document.querySelector('meta[name="theme-color"]')) {
      var m = document.createElement('meta');
      m.name = 'theme-color'; m.content = '#000000';
      document.head.appendChild(m);
    }
  } catch(e){}
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
