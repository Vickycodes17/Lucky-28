                          // ── IF IT CANNOT SPEAK, TRY THE NEXT ENGINE ──
                          if (ready && forced == null && !speaksSomething()) {
                              if (candidates == null) { candidates = installedEngines(); candidateAt = 0; }
                              while (candidateAt < candidates.size()) {
                                  String next = candidates.get(candidateAt++);
