                      // How many times the engine has had to be rebuilt under it. Zero
                      // on a healthy phone; anything above zero on a phone that went
                      // quiet is the answer to why, and evidence that it came back.
                      o.put("revivals", revivals);
                      o.put("initStatus", initStatus);
                      o.put("engine", engineName == null ? "" : engineName);
                      o.put("lastError", lastError == null ? "" : lastError);
                      int n = 0;
                      try { Set<Voice> vs = (tts == null) ? null : tts.getVoices(); n = (vs == null) ? 0 : vs.size(); }
                      catch (Throwable ignored) { }
                      o.put("voiceCount", n);
                      JSONArray ok = new JSONArray(), missing = new JSONArray();
                      for (String tag : WANTED) (hasLang(tag) ? ok : missing).put(tag);
                      o.put("canSpeak", ok);
                      o.put("cannotSpeak", missing);
                      String def = "";
                      try {
                          if (tts != null && tts.getDefaultVoice() != null
                                  && tts.getDefaultVoice().getLocale() != null)
                              def = tts.getDefaultVoice().getLocale().toLanguageTag();
                      } catch (Throwable ignored) { }
                      o.put("defaultLang", def);
                      // The two things outside the engine that silence it anyway
                      o.put("inCall", inCall());
                      o.put("engineTrail", engineTrail == null ? "" : engineTrail);
                      o.put("chosen", chosenEngine == null ? "" : chosenEngine);
                      o.put("forced", forced == null ? "" : forced);
