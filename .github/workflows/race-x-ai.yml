              /**
               * Put bytes in the phone's Downloads folder.
               *
               * Split out of saveDownload so the screenshot can use it too. The page hands
               * its backups over as base64 and that is fine for a text file, but a
               * full-colour picture of the screen is megabytes, and pushing that through
               * the JavaScript bridge as a string is a good way to run a phone out of
               * memory for no reason. The picture is written straight from Java.
               */
              static String writeToDownloads(Activity activity, String name, String mime, byte[] data) {
                  OutputStream out = null;
                  try {
                      if (name == null || name.length() == 0) name = "download";
                      if (mime == null || mime.length() == 0) mime = "application/octet-stream";

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          v.put(MediaStore.Downloads.MIME_TYPE, mime);
                          v.put(MediaStore.Downloads.IS_PENDING, 1);
                          Uri uri = activity.getContentResolver()
                                  .insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          if (uri == null) return "error could not create the file";
                          out = activity.getContentResolver().openOutputStream(uri);
                          if (out == null) return "error could not open the file";
                          out.write(data);
                          out.flush();
                          out.close();
                          out = null;
                          v.clear();
                          v.put(MediaStore.Downloads.IS_PENDING, 0);
                          activity.getContentResolver().update(uri, v, null, null);
                          return "ok Downloads/" + name;
                      }

                      File dir = Environment.getExternalStoragePublicDirectory(
                              Environment.DIRECTORY_DOWNLOADS);
                      if (dir != null && !dir.exists()) dir.mkdirs();
                      File f = new File(dir, name);
                      out = new FileOutputStream(f);
                      out.write(data);
                      out.flush();
                      return "ok " + f.getAbsolutePath();
                  } catch (Throwable t) {
                      return "error " + t;
                  } finally {
                      if (out != null) try { out.close(); } catch (Exception ignored) { }
                  }
              }
