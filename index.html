<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07090f">
<title>Lucky Number Tracker</title>
<style>
:root{--bg:#07090f;--bg2:#0e1120;--bg3:#141828;--card:#181d30;--card2:#1e2440;--border:#252d4a;--border2:#2f3a60;--accent:#7C6FFF;--accent2:#FF5F6D;--green:#00E5A0;--gold:#FFD166;--blue:#4C9FFF;--purple:#B44FFF;--text:#EEF0FF;--text2:#8A94C0;--text3:#454d70;--r:12px;--rs:8px;
--c-red:#F0443E;--c-orange:#FF9F1C;--c-pink:#FF4F9A;--c-navy:#3A6FFF;--c-sky:#31C6E8;--c-green:#3CD86B;--c-grey:#9AA0B8;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:40px;overflow-x:hidden}
.hdr{background:linear-gradient(135deg,#0e1120,#181d30,#0e1120);padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:19px;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.hdr .sub{font-size:10px;color:var(--text3)}
.count{background:var(--bg3);border:1px solid var(--accent);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--accent)}
.wrap{padding:16px;max-width:520px;margin:0 auto}
.section{margin-bottom:20px}
.lbl{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.numgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.num{aspect-ratio:1;border:2px solid transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.12s;position:relative;color:#fff}
.num:active{transform:scale(.92)}
.num.sel{outline:3px solid #fff;box-shadow:0 0 14px rgba(255,255,255,.5)}
.num .n{font-size:16px;font-weight:800}
.num .cat{font-size:7px;opacity:.85;margin-top:1px}
.logbtn{width:100%;padding:16px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px}
.logbtn:active{transform:scale(.98)}
.logbtn:disabled{background:var(--bg3);color:var(--text3);cursor:not-allowed}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:9px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.empty{text-align:center;color:var(--text3);padding:30px 10px;font-size:13px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-row .lab{width:28px;font-size:12px;font-weight:700;text-align:right}
.bar-track{flex:1;height:16px;background:var(--bg3);border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px}
.bar-row .val{width:52px;font-size:11px;color:var(--text2);text-align:right}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:4px 9px;font-size:12px;margin:2px;color:#fff;font-weight:700}
.hist-strip{display:flex;flex-direction:column;gap:4px}
.hist-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:8px;padding:6px 10px}
.hist-item .hn{font-weight:800;font-size:15px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.hist-item .hmeta{flex:1;font-size:10px;color:var(--text3)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.statbox{background:var(--bg3);border-radius:8px;padding:10px;text-align:center}
.clear-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:11px;color:var(--text3);cursor:pointer}
.lvlbtns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.lvlbtn{padding:7px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:11px;font-weight:700;color:var(--text2);cursor:pointer}
.lvlbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.back-link{font-size:11px;color:var(--accent);text-decoration:none;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
</style>
</head>

<style>
#cosmicIntro{position:fixed;inset:0;z-index:9000;background:radial-gradient(ellipse at 50% 45%,#2b0b52 0%,#160a33 40%,#05030f 100%);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}

@keyframes twinkle{0%,100%{opacity:.45}50%{opacity:.95}}
.planet{position:absolute;border-radius:50%;box-shadow:inset -6px -4px 14px rgba(0,0,0,.55)}
.p1{width:52px;height:52px;background:linear-gradient(140deg,#5eb0ef,#2563eb);top:22%;left:12%;animation:float 7s ease-in-out infinite}
.p2{width:34px;height:34px;background:linear-gradient(140deg,#fdba74,#c2410c);top:14%;right:26%;animation:float 6s ease-in-out infinite .6s}
.p3{width:44px;height:44px;background:linear-gradient(140deg,#e9d5ff,#a855f7);top:30%;right:10%;animation:float 8s ease-in-out infinite 1.2s}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.ring{position:absolute;width:min(78vw,340px);height:min(78vw,340px);border-radius:50%;border:2px solid rgba(216,180,254,.35);border-top-color:rgba(255,255,255,.85);top:50%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);animation:spin 9s linear infinite;box-shadow:0 0 26px rgba(168,85,247,.4)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(342deg)}}
.comet{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px #fde68a;top:18%;left:-12%;opacity:0}
.comet::after{content:'';position:absolute;right:4px;top:1.5px;width:90px;height:2px;background:linear-gradient(90deg,transparent,#fbbf24);border-radius:2px}

.comet.c2::after{background:linear-gradient(90deg,transparent,#e879f9);width:70px}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}12%{opacity:1}100%{transform:translate(125vw,42vh);opacity:0}}
.ctitle{position:relative;z-index:5;text-align:center;line-height:.86;opacity:0}
.ctitle .l1,.ctitle .l2{font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,#fde047 0%,#fb923c 45%,#ea580c 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 3px 10px rgba(234,88,12,.65))}
.ctitle .l1{font-size:clamp(38px,13vw,64px)}
.ctitle .l2{font-size:clamp(30px,10.5vw,52px)}
.csub{position:relative;z-index:5;margin-top:14px;font-size:11px;letter-spacing:3px;color:#d8b4fe;opacity:0}
#cosmicTap{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,3,15,.55);cursor:pointer}
.tapinner{padding:14px 34px;border:2px solid #fb923c;border-radius:30px;color:#fff;font-size:15px;font-weight:800;background:rgba(251,146,60,.15);animation:pulse 1.5s ease-in-out infinite}
.tapnote{font-size:10px;color:#c4b5fd;margin-top:12px}
@keyframes pulse{0%,100%{box-shadow:0 0 14px rgba(251,146,60,.5)}50%{box-shadow:0 0 34px rgba(251,146,60,.95)}}
#cosmicSkip{position:absolute;bottom:24px;right:22px;z-index:9;font-size:11px;color:#c4b5fd;background:rgba(255,255,255,.07);border:1px solid rgba(196,181,253,.3);border-radius:20px;padding:7px 15px;cursor:pointer;opacity:0;transition:opacity .5s}
.go .ctitle{animation:titleIn 1.1s cubic-bezier(.2,1.4,.4,1) .3s both}
.go .csub{animation:subIn 1s ease 1.3s both}
.go .comet{animation:shoot 1.6s ease-in .5s both}
.go .comet.c2{animation:shoot 1.8s ease-in 1.4s both}
@keyframes titleIn{0%{opacity:0;transform:scale(.4) rotate(-8deg);filter:blur(8px)}100%{opacity:1;transform:scale(1) rotate(0);filter:blur(0)}}
@keyframes subIn{0%{opacity:0;letter-spacing:10px}100%{opacity:.9;letter-spacing:3px}}
</style>
<div class="hdr">

  <div style="display:flex;align-items:center;gap:8px">

    <button onclick="document.getElementById('impFile').click()" style="font-size:11px;color:var(--accent);background:var(--bg3);border:1px solid var(--accent);border-radius:8px;padding:6px 10px;cursor:pointer">📂</button>

<script>
const MAX=27;
// ── COSMIC INTRO ──
function cosmicSound(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ctx=new AC();const t0=ctx.currentTime;
    // deep space swell
    const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
    o.type='sine';f.type='lowpass';f.frequency.setValueAtTime(300,t0);f.frequency.exponentialRampToValueAtTime(1800,t0+1.4);
    o.frequency.setValueAtTime(55,t0);o.frequency.exponentialRampToValueAtTime(180,t0+1.6);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.22,t0+0.6);g.gain.exponentialRampToValueAtTime(0.0001,t0+2.6);
    o.connect(f);f.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+2.7);
    // shimmer sparkle
    [0.35,0.75,1.15].forEach((d,i)=>{
      const s=ctx.createOscillator(),sg=ctx.createGain();s.type='triangle';
      s.frequency.setValueAtTime(900+i*450,t0+d);s.frequency.exponentialRampToValueAtTime(1800+i*500,t0+d+0.3);
      sg.gain.setValueAtTime(0.0001,t0+d);sg.gain.exponentialRampToValueAtTime(0.09,t0+d+0.05);sg.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.45);
      s.connect(sg);sg.connect(ctx.destination);s.start(t0+d);s.stop(t0+d+0.5);
    });
    // comet whoosh
    function whoosh(at){
      const n=ctx.createBufferSource();const buf=ctx.createBuffer(1,ctx.sampleRate*0.9,ctx.sampleRate);
      const d=buf.getChannelData(0);for(let i=0;i<d.length;i++){const p=i/d.length;d[i]=(Math.random()*2-1)*Math.sin(Math.PI*p)*0.8;}
      n.buffer=buf;const ng=ctx.createGain();ng.gain.value=0.14;
      const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;
      bp.frequency.setValueAtTime(600,t0+at);bp.frequency.exponentialRampToValueAtTime(3000,t0+at+0.8);
      n.connect(bp);bp.connect(ng);ng.connect(ctx.destination);n.start(t0+at);
    }
    whoosh(0.5);whoosh(1.4);
    // impact on title
    const im=ctx.createOscillator(),ig=ctx.createGain();im.type='sine';
    im.frequency.setValueAtTime(140,t0+0.3);im.frequency.exponentialRampToValueAtTime(45,t0+0.9);
    ig.gain.setValueAtTime(0.0001,t0+0.3);ig.gain.exponentialRampToValueAtTime(0.3,t0+0.36);ig.gain.exponentialRampToValueAtTime(0.0001,t0+1.1);
    im.connect(ig);ig.connect(ctx.destination);im.start(t0+0.3);im.stop(t0+1.2);
  }catch(e){}
}
let _cosDone=false;
function endCosmic(){
  if(_cosDone)return;_cosDone=true;
  const el=document.getElementById('cosmicIntro');if(!el)return;
  el.style.transition='opacity .7s';el.style.opacity='0';
  setTimeout(()=>{el.style.display='none';},750);
}
function startCosmic(){
  const tap=document.getElementById('cosmicTap');if(tap)tap.style.display='none';
  const el=document.getElementById('cosmicIntro');if(el)el.classList.add('go');
  cosmicSound();
  const sk=document.getElementById('cosmicSkip');if(sk)setTimeout(()=>{sk.style.opacity='1';},900);
  setTimeout(endCosmic,4600);
}
setTimeout(()=>{if(!_cosDone){const t=document.getElementById('cosmicTap');if(t&&t.style.display!=='none')endCosmic();}},15000);

const COLORS=[
  {key:'red',   name:'Red',   col:'var(--c-red)',    mult:125,  nums:[0,1,26,27]},
  {key:'orange',name:'Orange',col:'var(--c-orange)', mult:31.3, nums:[2,3,24,25]},
  {key:'pink',  name:'Pink',  col:'var(--c-pink)',   mult:13.9, nums:[4,5,22,23]},
  {key:'navy',  name:'Navy',  col:'var(--c-navy)',   mult:7.8,  nums:[6,7,20,21]},
  {key:'sky',   name:'Sky',   col:'var(--c-sky)',    mult:5.0,  nums:[8,9,18,19]},
  {key:'green', name:'Green', col:'var(--c-green)',  mult:3.8,  nums:[10,11,16,17]},
  {key:'grey',  name:'Grey',  col:'var(--c-grey)',   mult:3.4,  nums:[12,13,14,15]},
];
const NUM_COLOR={}; COLORS.forEach(c=>c.nums.forEach(n=>NUM_COLOR[n]=c));
function colorOf(n){return NUM_COLOR[n]||COLORS[6];}
let state={results:[]};
let selNum=null; let pickLevel=3; const LEVELS=[1,2,4,8,14]; let colorLevel=1;
const PRED_UNLOCK=30;
function numberAccuracy(level){const howMany=LEVELS[level-1];const R=state.results;if(R.length<=PRED_UNLOCK)return null;let hit=0,tot=0;for(let i=PRED_UNLOCK;i<R.length;i++){const c=new Array(MAX+1).fill(0);for(let j=0;j<i;j++)c[R[j].n]++;const topN=c.map((cnt,n)=>({n,cnt})).sort((a,b)=>b.cnt-a.cnt).slice(0,howMany).map(x=>x.n);if(topN.includes(R[i].n))hit++;tot++;}return {hit,tot,pct:tot?Math.round(hit/tot*100):null,howMany};}
function colorAccuracy(level){const R=state.results;if(R.length<=PRED_UNLOCK)return null;let hit=0,tot=0;for(let i=PRED_UNLOCK;i<R.length;i++){const m={};COLORS.forEach(c=>m[c.key]=0);for(let j=0;j<i;j++){const c=colorOf(R[j].n);m[c.key]++;}const topColors=COLORS.map(c=>({key:c.key,n:m[c.key]})).sort((a,b)=>b.n-a.n).slice(0,level).map(x=>x.key);if(topColors.includes(colorOf(R[i].n).key))hit++;tot++;}return {hit,tot,pct:tot?Math.round(hit/tot*100):null};}
// ── THE REAL BASELINE ─────────────────────────────────────────────────
// A Lucky 28 result is three digits 0-9 added together, so the numbers are
// NOT equally likely: 13 and 14 come up 7.5% of the time, 0 and 27 only 0.1%.
// The old baseline assumed a flat 1-in-28, which made any method that leaned
// toward the middle look clever when it was only using arithmetic everyone
// can see. The honest line is: what do you get by always picking the N most
// likely numbers and never looking at history at all?
const TRUE_ODDS=(function(){
  const c=new Array(28).fill(0);
  for(let a=0;a<10;a++)for(let b=0;b<10;b++)for(let d=0;d<10;d++)c[a+b+d]++;
  return c.map(x=>x/1000);
})();
// the numbers ranked by their true chance, best first
const ODDS_ORDER=TRUE_ODDS.map((p,n)=>({n:n,p:p})).sort((a,b)=>b.p-a.p).map(x=>x.n);
function numberBaseline(level){
  const k=LEVELS[level-1];
  let p=0;
  for(let i=0;i<k;i++)p+=TRUE_ODDS[ODDS_ORDER[i]];
  return Math.round(p*100);
}
// a flat guess, for comparison - what the old code assumed
function uniformBaseline(level){return Math.round(LEVELS[level-1]/28*100);}
function colorBaseline(level){return Math.round(COLORS.map(c=>c.nums.reduce((p,n)=>p+TRUE_ODDS[n],0)).sort((a,b)=>b-a).slice(0,level).reduce((a,b)=>a+b,0)*100);}

function catsOf(n){const small=n<=13;const even=n%2===0;return {s:small?'S':'B', p:even?'E':'O', label:(small?'S':'B')+(even?'E':'O')};}
function load(){try{const d=localStorage.getItem('luckyNum');if(d)state=JSON.parse(d);}catch(e){}}
function save(){try{localStorage.setItem('luckyNum',JSON.stringify(state));}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function fmtTime(ts){const d=new Date(ts);return d.toLocaleDateString(undefined,{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});}
function buildGrid(){let h='';for(let n=0;n<=MAX;n++){const c=colorOf(n);const ct=catsOf(n);h+=`<div class="num${selNum===n?' sel':''}" style="background:${c.col}" onclick="pickNum(${n})"><div class="n">${n}</div><div class="cat">${ct.label}</div></div>`;}document.getElementById('numGrid').innerHTML=h;}
function pickNum(n){selNum=(selNum===n?null:n);buildGrid();const b=document.getElementById('logBtn');if(selNum!==null){const c=colorOf(selNum);b.disabled=false;b.textContent=`🏆 Log ${selNum} (${c.name} ×${c.mult})`;}else{b.disabled=true;b.textContent='Select a number';}}
function logNumber(){if(selNum===null)return;state.results.push({n:selNum,t:Date.now()});save();toast(`Logged ${selNum} (${colorOf(selNum).name})`);selNum=null;buildGrid();document.getElementById('logBtn').disabled=true;document.getElementById('logBtn').textContent='Select a number';renderAll();}
function sw(tab,btn){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');['Predict','Methods','Pick','Colors','Freq','HotCold','Cats','Streaks','Random','Patterns','History'].forEach(t=>{document.getElementById('panel'+t).style.display=t===tab?'':'none';});}
function counts(){const c=new Array(MAX+1).fill(0);state.results.forEach(r=>{if(r.n>=0&&r.n<=MAX)c[r.n]++;});return c;}
function colorCounts(){const m={};COLORS.forEach(c=>m[c.key]=0);state.results.forEach(r=>{const c=colorOf(r.n);if(c)m[c.key]++;});return m;}
function renderAll(){document.getElementById('count').textContent=state.results.length;renderPredict();renderMethods();renderPick();renderColors();renderFreq();renderHotCold();renderCats();renderStreaks();renderRandom();renderPatterns();renderHistory();}

// ══════════════════════════════════════════════════════════════════════
// PREDICTION METHODS
// The systems players use on Lucky 28, each returning every number 0-27
// ranked best-first. The Predict tab takes the top N for your chosen level.
//
// Each one is replayed over your own history and scored against the baseline
// for that level - pick 8 of 28 and you catch the winner 29% of the time by
// doing nothing at all. That is the number every method has to beat, and it
// is shown beside each so you can judge them yourself.
// ══════════════════════════════════════════════════════════════════════
const PRIMES=[2,3,5,7,11,13,17,19,23];
const FIBS=[1,2,3,5,8,13,21];
function digitSum(n){let s=0;String(n).split('').forEach(d=>s+=+d);return s;}
function tailOf(n){return n%10;}

// Every method takes the draws so far and returns 28 numbers, best first.
const NUM_METHODS={
  ai:{
    name:'AI blend (default)',
    desc:'Frequency, recency and what tends to follow the last draw, combined.',
    fn:null                       // handled by the original aiScores
  },
  bigsmall:{
    name:'Big / Small balancing',
    desc:'Backs the side that is behind — Small is 0-13, Big is 14-27.',
    fn:h=>{
      let small=0,big=0;
      h.forEach(n=>n<=13?small++:big++);
      const wantSmall=small<=big;
      return rank(n=>((n<=13)===wantSmall?1:0)+0.001*Math.random());
    }
  },
  oddeven:{
    name:'Odd / Even balancing',
    desc:'Backs whichever parity has appeared less often.',
    fn:h=>{
      let odd=0,even=0;
      h.forEach(n=>n%2?odd++:even++);
      const wantOdd=odd<=even;
      return rank(n=>((n%2===1)===wantOdd?1:0));
    }
  },
  middle:{
    name:'Middle zone',
    desc:'Favours 10-17, where the sum of three digits lands most often.',
    fn:()=>rank(n=>(n>=10&&n<=17)?2:(n>=6&&n<=21)?1:0)
  },
  extreme:{
    name:'Extreme zone',
    desc:'Favours the ends, 0-9 and 18-27, where the big payouts sit.',
    fn:()=>rank(n=>(n<=9||n>=18)?1:0)
  },
  prime:{
    name:'Prime numbers',
    desc:'Favours primes: 2, 3, 5, 7, 11, 13, 17, 19, 23.',
    fn:()=>rank(n=>PRIMES.includes(n)?1:0)
  },
  tail:{
    name:'Tail-number formula',
    desc:'Adds the last digits of the last three draws and targets that ending.',
    fn:h=>{
      if(h.length<3)return rank(()=>0);
      const t=(tailOf(h[h.length-1])+tailOf(h[h.length-2])+tailOf(h[h.length-3]))%10;
      return rank(n=>tailOf(n)===t?1:0);
    }
  },
  digitsum:{
    name:'Digit-sum sequence',
    desc:'Reduces the last draw to a single digit and targets numbers matching it.',
    fn:h=>{
      if(!h.length)return rank(()=>0);
      let s=digitSum(h[h.length-1]);
      while(s>9)s=digitSum(s);
      return rank(n=>{let d=digitSum(n);while(d>9)d=digitSum(d);return d===s?1:0;});
    }
  },
  gap:{
    name:'Arithmetic gap',
    desc:'Takes the step between the last two draws and continues it both ways.',
    fn:h=>{
      if(h.length<2)return rank(()=>0);
      const g=h[h.length-1]-h[h.length-2];
      const a=h[h.length-1]+g, b=h[h.length-1]-g;
      return rank(n=>(n===a||n===b)?2:(Math.abs(n-a)<=1||Math.abs(n-b)<=1)?1:0);
    }
  },
  neighbour:{
    name:'Neighbour elimination',
    desc:'Rules out the last draw and the numbers either side of it.',
    fn:h=>{
      if(!h.length)return rank(()=>0);
      const L=h[h.length-1];
      return rank(n=>Math.abs(n-L)<=1?0:1);
    }
  },
  fib:{
    name:'Fibonacci',
    desc:'Favours 1, 2, 3, 5, 8, 13, 21 and their doubles.',
    fn:()=>rank(n=>FIBS.includes(n)?2:FIBS.includes(n-14)?1:0)
  },
  grid:{
    name:'Grid skipping',
    desc:'Lays 0-27 into four columns of seven and backs the driest column.',
    fn:h=>{
      const col=new Array(4).fill(0);
      h.slice(-60).forEach(n=>col[n%4]++);
      const dry=col.indexOf(Math.min(...col));
      return rank(n=>n%4===dry?1:0);
    }
  },
  mirror:{
    name:'Mirror numbers',
    desc:'Backs the reflection of the last draw — 0 pairs with 27, 1 with 26.',
    fn:h=>{
      if(!h.length)return rank(()=>0);
      const m=27-h[h.length-1];
      return rank(n=>n===m?2:Math.abs(n-m)<=2?1:0);
    }
  },
  cycle:{
    name:'Cycle repeat',
    desc:'Finds the last time this pair of draws occurred and takes what followed.',
    fn:h=>{
      if(h.length<3)return rank(()=>0);
      const a=h[h.length-2],b=h[h.length-1];
      const hits=[];
      for(let i=1;i<h.length-1;i++)if(h[i-1]===a&&h[i]===b)hits.push(h[i+1]);
      if(!hits.length)return rank(()=>0);
      const c=new Array(28).fill(0);
      hits.forEach(n=>c[n]++);
      return rank(n=>c[n]);
    }
  },
  odds:{
    name:'Play the odds (no history)',
    desc:'Always the most likely numbers: 13, 14, 12, 15 and outward. Ignores every past draw.',
    fn:()=>rank(n=>TRUE_ODDS[n])
  },
  cold:{
    name:'Coldest numbers',
    desc:'Backs whatever has gone longest without appearing.',
    fn:h=>{
      const last=new Array(28).fill(-1);
      h.forEach((n,i)=>last[n]=i);
      return rank(n=>h.length-last[n]);
    }
  },
  hot:{
    name:'Hottest numbers',
    desc:'Backs whatever has come up most in the last 50 draws.',
    fn:h=>{
      const c=new Array(28).fill(0);
      h.slice(-50).forEach(n=>c[n]++);
      return rank(n=>c[n]);
    }
  }
};

// helper: score every number, return them ranked best-first with ties broken
// by number so the same input always gives the same output
function rank(scoreFn){
  const out=[];
  for(let n=0;n<28;n++)out.push({n:n,score:scoreFn(n)});
  out.sort((a,b)=>b.score-a.score||a.n-b.n);
  return out;
}

function predMethod(){
  const k=state.method||'ai';
  return NUM_METHODS[k]?k:'ai';
}
function setPredMethod(k){
  if(typeof captured!=="undefined"&&captured){toast("Record the captured result before changing method.");return;}
  state.method=NUM_METHODS[k]?k:'ai';
  save();
  toast('Method: '+NUM_METHODS[predMethod()].name);
  renderAll();
}

// the scores the Predict tab uses, from whichever method is selected
function methodScores(upto,forceMethod){
  const k=forceMethod||predMethod();
  if(k==='ai')return aiScores(upto);
  const h=state.results.slice(0,upto).map(r=>r.n);
  return NUM_METHODS[k].fn(h);
}

// replay a method over the whole history at a given level
function methodAccuracy(level,forceMethod){const R=state.results;if(R.length<=PRED_UNLOCK)return null;let hit=0,tot=0,run=0,maxRun=0;for(let i=PRED_UNLOCK;i<R.length;i++){const top=methodScores(i,forceMethod).slice(0,LEVELS[level-1]).map(x=>x.n);if(top.includes(R[i].n)){hit++;run=0;}else{run++;maxRun=Math.max(maxRun,run);}tot++;}return {hit,tot,run,maxRun,pct:Math.round(hit/tot*100)};}

// ── AI PREDICTION ENGINE (blends frequency + follow-pattern + recency) ──
// Scores every number 0-27 using only draws BEFORE index `upto`. Returns array of {n,score} sorted.
function aiScores(upto){
  const prior=state.results.slice(0,upto).map(r=>r.n);
  const N=prior.length;
  const freq=new Array(28).fill(0);
  prior.forEach(n=>freq[n]++);
  // recency weight: recent draws count a bit more
  const recW=new Array(28).fill(0);
  prior.forEach((n,i)=>{recW[n]+=1+(i/Math.max(N,1));});
  // follow-pattern: what tends to come after the LAST drawn number
  const last=prior.length?prior[prior.length-1]:null;
  const follow=new Array(28).fill(0);
  if(last!==null){for(let i=1;i<prior.length;i++){if(prior[i-1]===last)follow[prior[i]]++;}}
  const fMax=Math.max(...follow,1);
  const scores=[];
  for(let n=0;n<28;n++){
    const fScore=N?freq[n]/N:1/28;          // frequency share
    const rScore=N?recW[n]/(recW.reduce((a,b)=>a+b,0)||1):1/28; // recency share
    const pScore=follow[n]/fMax;             // 0..1 follow tendency
    // blend: frequency 40%, recency 35%, pattern 25%
    const score=fScore*0.40 + rScore*0.35 + pScore*0.25;
    scores.push({n,score});
  }
  scores.sort((a,b)=>b.score-a.score);
  return scores;
}
// accuracy: for each draw after PRED_UNLOCK, did the AI's top-N (from prior data) contain the winner?
function aiAccuracy(level){
  const howMany=LEVELS[level-1];const R=state.results;
  if(R.length<=PRED_UNLOCK)return null;
  let hit=0,tot=0;
  for(let i=PRED_UNLOCK;i<R.length;i++){
    const top=aiScores(i).slice(0,howMany).map(x=>x.n);
    if(top.includes(R[i].n))hit++;tot++;
  }
  return {hit,tot,pct:tot?Math.round(hit/tot*100):null,howMany};
}
function renderPredict(){
  const el=document.getElementById('panelPredict');
  const tot=state.results.length;
  const lvlBtns=`<div class="lvlbtns">${LEVELS.map((n,i)=>`<button class="lvlbtn${pickLevel===i+1?' on':''}" onclick="setPredLevel(${i+1})">Lv${i+1} · ${n} num${n>1?'s':''}</button>`).join('')}</div>`;
  if(tot<10){el.innerHTML=lvlBtns+`<div class="empty">🤖 AI needs at least 10 draws to start predicting.<br>You have ${tot}.</div>`;return;}
  // current prediction for the NEXT draw (using all data)
  const howMany=LEVELS[pickLevel-1];
  const predRaw=methodScores(tot).slice(0,howMany);
  const topPick=predRaw.length?predRaw[0].n:null; // keep which is #1 before sorting
  const pred=predRaw.slice().sort((a,b)=>a.n-b.n); // show in increasing number order
  const chips=pred.map((x)=>{const c=colorOf(x.n);return `<span class="chip" style="background:${c.col};${x.n===topPick?'outline:2px solid #fff;':''}">${x.n}</span>`;}).join('');
  // accuracy block
  let accHtml='';
  if(tot<=PRED_UNLOCK){accHtml=`<div style="background:var(--bg3);border-radius:8px;padding:10px;margin:12px 0;font-size:11px;color:var(--text3)">📊 Accuracy unlocks after ${PRED_UNLOCK} logs (you have ${tot}). Then each level shows its real hit-rate vs random.</div>`;}
  else{
    const rows=LEVELS.map((n,i)=>{const a=methodAccuracy(i+1);const base=numberBaseline(i+1);if(!a)return '';const edge=a.pct-base;const col=edge>5?'var(--green)':edge<-5?'var(--accent2)':'var(--text2)';const tag=edge>5?' 🔥':edge<-5?' ⚠️':'';return `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)"><span style="font-size:11px;color:var(--text2)">Lv${i+1} · ${n} num${n>1?'s':''}</span><span style="font-size:12px;font-weight:700;color:${col}">${a.pct}%${tag} <span style="font-size:9px;color:var(--text3)">(${a.hit}/${a.tot} · CTWL ${a.run}/${a.maxRun} · baseline ${base}%)</span></span></div>`;}).join('');
    accHtml=`<div style="background:var(--bg3);border-radius:8px;padding:10px;margin:12px 0"><div style="font-size:11px;font-weight:700;color:var(--text);margin-bottom:6px">Selected method · historical replay</div>${rows}<div style="font-size:9px;color:var(--text3);margin-top:6px">Above-baseline history is exploratory, not proof of a profitable edge or fairness. CTWL is current / maximum replay losses.</div></div>`;
  }
  el.innerHTML=lvlBtns+
    `<div style="text-align:center;margin:6px 0 14px"><div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">🤖 AI predicts (next draw)</div><div>${chips}</div><div style="font-size:9px;color:var(--text3);margin-top:6px">Blends frequency + recent trend + follow-patterns. White outline = top pick.</div></div>`+
    accHtml+
    `<div style="font-size:10px;color:var(--text3);margin-top:6px;line-height:1.5">⚠️ Honest: this is a real prediction, but the accuracy count is the judge. On a fair random wheel it will land near the "rnd %" — meaning no edge. Historical performance alone does not establish a repeatable bias or positive returns. Validate on later rounds with settled payouts.</div>`;
}
function setLevel(l){pickLevel=l;renderPick();}
function setPredLevel(l){if(captured){toast("Record the captured result first.");return;}pickLevel=l;renderPredict();}

// ── METHOD PICKER ─────────────────────────────────────────────────────
// Every method replayed over your own draws at the level you have chosen,
// against the baseline for that level. The baseline is what you get by
// picking any N numbers and ignoring the history completely, so it is the
// only number worth comparing against.
function renderMethods(){
  const el=document.getElementById('panelMethods');
  if(!el)return;
  const tot=state.results.length;
  const howMany=LEVELS[pickLevel-1];
  const base=numberBaseline(pickLevel);
  const lvlBtns='<div class="lvlbtns">'+LEVELS.map((n,i)=>
    '<button class="lvlbtn'+(pickLevel===i+1?' on':'')+'" onclick="setPredLevel('+(i+1)+');renderMethods()">Lv'+(i+1)+' \u00b7 '+n+'</button>').join('')+'</div>';

  if(tot<=PRED_UNLOCK){
    el.innerHTML=lvlBtns+'<div class="empty">Log more than '+PRED_UNLOCK+' draws to score the methods.<br>You have '+tot+'.</div>';
    return;
  }

  const rows=Object.keys(NUM_METHODS).map(k=>{
    let r=null;
    try{r=methodAccuracy(pickLevel,k);}catch(e){}
    return{k:k,pct:r?r.pct:null,tot:r?r.tot:0};
  }).sort((a,b)=>(b.pct||0)-(a.pct||0));

  const cur=predMethod();
  let h=lvlBtns+
    '<div style="font-size:11px;color:var(--text2);line-height:1.6;margin-bottom:12px">'+
    'Each method replayed over your '+tot+' draws, picking '+howMany+' number'+(howMany>1?'s':'')+
    ' each time. Always choosing the '+howMany+' most likely totals has theoretical coverage <b>'+base+'%</b> of the time \u2014 '+
    'that is the line to beat.</div>';

  rows.forEach(r=>{
    const m=NUM_METHODS[r.k];
    const on=cur===r.k;
    const edge=(r.pct==null)?null:r.pct-base;
    const col=(edge==null)?'var(--text3)':(edge>=5?'var(--green)':edge<=-5?'var(--accent2)':'var(--gold)');
    h+='<div onclick="setPredMethod(\''+r.k+'\')" style="display:flex;align-items:center;gap:10px;padding:11px;margin-bottom:6px;border-radius:10px;cursor:pointer;'+
      'background:'+(on?'rgba(124,111,255,.16)':'var(--bg3)')+';border:1px solid '+(on?'var(--accent)':'transparent')+'">'+
      '<span style="width:16px;height:16px;border-radius:50%;flex-shrink:0;border:2px solid '+(on?'var(--accent)':'var(--border2)')+';background:'+(on?'var(--accent)':'transparent')+'"></span>'+
      '<span style="flex:1;min-width:0">'+
        '<span style="display:block;font-size:12.5px;font-weight:700;color:var(--text)">'+m.name+'</span>'+
        '<span style="display:block;font-size:9.5px;color:var(--text3);margin-top:2px;line-height:1.45">'+m.desc+'</span>'+
      '</span>'+
      '<span style="text-align:right;flex-shrink:0">'+
        '<span style="display:block;font-size:15px;font-weight:800;color:'+col+'">'+(r.pct==null?'\u2014':r.pct+'%')+'</span>'+
        '<span style="display:block;font-size:9px;color:var(--text3)">'+(edge==null?'':(edge>0?'+':'')+edge+' vs '+base)+'</span>'+
      '</span></div>';
  });

  const best=rows[0];
  h+='<div style="font-size:10px;color:var(--text3);margin-top:12px;line-height:1.6;border-top:1px solid var(--border);padding-top:10px">'+
     'The '+base+'% line is <b>Play the odds</b> \u2014 always taking the most likely numbers and never looking at the past. '+
     'A Lucky 28 result is three digits added together, so 13 and 14 come up 7.5% of the time and 0 and 27 only 0.1%. '+
     'That shape is free information; anything below the line is losing ground to it.'+
     (best&&best.pct!=null&&best.pct-base>=5
       ? '<br><br>Right now <b style="color:var(--text2)">'+NUM_METHODS[best.k].name+'</b> leads at '+best.pct+'%, '+(best.pct-base)+' points clear. '+
         'Check again in a few hundred draws \u2014 with '+rows.length+' methods compared, one leading by chance is expected.'
       : '<br><br>Nothing is clearly ahead of that line, which is what a fair wheel produces: every method here reads the past, and past draws do not change the next one.')+
     '</div>';
  el.innerHTML=h;
}

function renderPick(){const el=document.getElementById('panelPick');const tot=state.results.length;const lvlBtns=`<div class="lvlbtns">${LEVELS.map((n,i)=>`<button class="lvlbtn${pickLevel===i+1?' on':''}" onclick="setLevel(${i+1})">Lv${i+1} · ${n} num${n>1?'s':''}</button>`).join('')}</div>`;if(tot<10){el.innerHTML=lvlBtns+`<div class="empty">Log at least 10 draws.<br>You have ${tot}.</div>`;return;}const c=counts();const howMany=LEVELS[pickLevel-1];const ranked=c.map((cnt,n)=>({n,cnt})).sort((a,b)=>b.cnt-a.cnt).slice(0,howMany).sort((a,b)=>a.n-b.n);const chips=ranked.map(x=>`<span class="chip" style="background:${colorOf(x.n).col}">${x.n} · ${x.cnt}×</span>`).join('');const recent=state.results.slice(-25);const rc=new Array(MAX+1).fill(0);recent.forEach(r=>rc[r.n]++);const rr=rc.map((cnt,n)=>({n,cnt})).filter(x=>x.cnt>0).sort((a,b)=>b.cnt-a.cnt).slice(0,howMany);const rchips=rr.map(x=>`<span class="chip" style="background:${colorOf(x.n).col}">${x.n} · ${x.cnt}×</span>`).join('');
  // ACCURACY (backtested, unlocks after 30 logs)
  let accHtml='';
  if(tot<=PRED_UNLOCK){accHtml=`<div style="background:var(--bg3);border-radius:8px;padding:10px;margin:12px 0;font-size:11px;color:var(--text3)">📊 Accuracy unlocks after ${PRED_UNLOCK} logs (you have ${tot}). Then it shows how often each level would have contained the winner.</div>`;}
  else{
    const rows=LEVELS.map((n,i)=>{const a=numberAccuracy(i+1);const base=numberBaseline(i+1);if(!a)return '';const edge=a.pct-base;const col=edge>5?'var(--green)':edge<-5?'var(--accent2)':'var(--text2)';return `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)"><span style="font-size:11px;color:var(--text2)">Lv${i+1} · ${n} num${n>1?'s':''}</span><span style="font-size:12px;font-weight:700;color:${col}">${a.pct}% <span style="font-size:9px;color:var(--text3)">(${a.hit}/${a.tot} · random ${base}%)</span></span></div>`;}).join('');
    accHtml=`<div style="background:var(--bg3);border-radius:8px;padding:10px;margin:12px 0"><div style="font-size:11px;font-weight:700;color:var(--text);margin-bottom:6px">📊 Smart-pick accuracy (backtested)</div>${rows}<div style="font-size:9px;color:var(--text3);margin-top:6px">Green = beating random (a real edge). If all levels ≈ random %, the wheel is fair and no edge exists.</div></div>`;
  }
  el.innerHTML=lvlBtns+`<div class="lbl" style="color:var(--green)">Top ${howMany} by all-time frequency</div><div style="margin-bottom:14px">${chips}</div><div class="lbl" style="color:var(--gold)">Top ${howMany} hot lately (last 25)</div><div>${rchips||'<span style="color:var(--text3)">—</span>'}</div>${accHtml}<div style="font-size:10px;color:var(--text3);margin-top:8px;line-height:1.5">⚠️ Honest: these are your <b>most-frequent</b> numbers, not a guarantee. The accuracy above shows if betting them actually beats random.</div>`;}

function renderColors(){const el=document.getElementById('panelColors');const tot=state.results.length;const cc=colorCounts();const rows=COLORS.map(c=>{const n=cc[c.key];const pct=tot?Math.round(n/tot*100):0;const expPct=Math.round(c.nums.reduce((p,n)=>p+TRUE_ODDS[n],0)*100);const w=tot?Math.round(n/tot*100):0;return `<div class="bar-row"><div class="lab" style="color:${c.col}">${c.name.slice(0,3)}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${c.col}"></div></div><div class="val">${n}·${pct}%</div></div><div style="font-size:8px;color:var(--text3);margin:-2px 0 6px 36px">×${c.mult} · fair≈${expPct}%</div>`;}).join('');const lvlBtns=`<div class="lvlbtns"><button class="lvlbtn${colorLevel===1?' on':''}" onclick="setColorLevel(1)">Lv1 · 1 color</button><button class="lvlbtn${colorLevel===2?' on':''}" onclick="setColorLevel(2)">Lv2 · 2 colors</button></div>`;let pick='';if(tot>=10){const ranked=COLORS.map(c=>({c,n:cc[c.key]})).sort((a,b)=>b.n-a.n).slice(0,colorLevel);pick=`<div class="lbl" style="color:var(--green);margin-top:8px">Most frequent color${colorLevel>1?'s':''}</div><div style="margin-bottom:10px">${ranked.map(x=>`<span class="chip" style="background:${x.c.col}">${x.c.name} · ${x.n}× · ×${x.c.mult}</span>`).join('')}</div>`;}let cAcc='';

  }

function renderFreq(){const el=document.getElementById('panelFreq');const tot=state.results.length;if(!tot){el.innerHTML='<div class="empty">Log numbers to see frequency.</div>';return;}const c=counts();const max=Math.max(...c,1);let rows='';for(let n=0;n<=MAX;n++){const pct=Math.round(c[n]/tot*100);const w=Math.round(c[n]/max*100);rows+=`<div class="bar-row"><div class="lab">${n}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${colorOf(n).col}"></div></div><div class="val">${c[n]}·${pct}%</div></div>`;}const exp=(tot/(MAX+1)).toFixed(1);el.innerHTML=`<div style="font-size:11px;color:var(--text3);margin-bottom:10px">Over ${tot} draws, totals have different expected frequencies: 13 or 14 ~${(tot*.075).toFixed(1)}× each; 0 or 27 ~${(tot*.001).toFixed(1)}× each, assuming independent uniform digits.</div>${rows}`;}
function renderHotCold(){const el=document.getElementById('panelHotCold');const tot=state.results.length;if(tot<10){el.innerHTML='<div class="empty">Log at least 10 draws.</div>';return;}const c=counts();const arr=c.map((cnt,n)=>({n,cnt})).sort((a,b)=>b.cnt-a.cnt);const hot=arr.slice(0,5),cold=arr.slice(-5).reverse();const lastSeen=new Array(MAX+1).fill(-1);state.results.forEach((r,i)=>{lastSeen[r.n]=i;});const overdue=lastSeen.map((idx,n)=>({n,gap:idx===-1?tot:tot-1-idx})).sort((a,b)=>b.gap-a.gap).slice(0,5);const chip=(n,e)=>`<span class="chip" style="background:${colorOf(n).col}">${n}${e?' · '+e:''}</span>`;el.innerHTML=`<div class="lbl" style="color:var(--accent2)">🔥 Most frequent</div><div style="margin-bottom:14px">${hot.map(x=>chip(x.n,x.cnt+'×')).join('')}</div><div class="lbl" style="color:var(--blue)">❄️ Least frequent</div><div style="margin-bottom:14px">${cold.map(x=>chip(x.n,x.cnt+'×')).join('')}</div><div class="lbl" style="color:var(--purple)">⏳ Most overdue</div><div>${overdue.map(x=>chip(x.n,x.gap+' ago')).join('')}</div><div style="font-size:10px;color:var(--text3);margin-top:12px;line-height:1.5">⚠️ In a truly random game, "overdue" numbers are <b>not</b> more likely next.</div>`;}
function renderCats(){const el=document.getElementById('panelCats');const tot=state.results.length;if(!tot){el.innerHTML='<div class="empty">Log draws to see S/B/E/O.</div>';return;}let S=0,B=0,E=0,O=0;state.results.forEach(r=>{const c=catsOf(r.n);c.s==='S'?S++:B++;c.p==='E'?E++:O++;});function pair(an,av,ac,bn,bv,bc){const t=av+bv||1;return `<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:${ac};font-weight:700">${an} ${av} (${Math.round(av/t*100)}%)</span><span style="color:${bc};font-weight:700">${bn} ${bv} (${Math.round(bv/t*100)}%)</span></div><div style="height:18px;border-radius:9px;overflow:hidden;display:flex"><div style="width:${av/t*100}%;background:${ac}"></div><div style="width:${bv/t*100}%;background:${bc}"></div></div></div>`;}el.innerHTML=pair('S Small',S,'var(--gold)','B Big',B,'var(--blue)')+pair('E Even',E,'var(--green)','O Odd',O,'var(--purple)')+`<div style="font-size:10px;color:var(--text3)">Compare to the game's own shown odds (like S 51% / B 49%).</div>`;}
function renderStreaks(){const el=document.getElementById('panelStreaks');const tot=state.results.length;if(tot<3){el.innerHTML='<div class="empty">Log at least 3 draws.</div>';return;}function si(g){let cur=1,max=1,cv=g(state.results[tot-1]);for(let i=tot-2;i>=0;i--){if(g(state.results[i])===cv)cur++;else break;}let run=1;for(let i=1;i<tot;i++){if(g(state.results[i])===g(state.results[i-1])){run++;if(run>max)max=run;}else run=1;}return{cur,cv,max};}const sb=si(r=>catsOf(r.n).s),eo=si(r=>catsOf(r.n).p),cl=si(r=>colorOf(r.n).key);const box=(t,i,cm)=>`<div class="statbox" style="margin-bottom:8px;text-align:left"><div style="font-size:11px;color:var(--text2)">${t}</div><div style="font-size:14px;font-weight:800;color:${cm};margin-top:2px">Now: ${i.cur}× ${i.cv} in a row</div><div style="font-size:10px;color:var(--text3)">Longest run: ${i.max}</div></div>`;el.innerHTML=box('Small / Big',sb,sb.cv==='S'?'var(--gold)':'var(--blue)')+box('Even / Odd',eo,eo.cv==='E'?'var(--green)':'var(--purple)')+box('Color',cl,colorOf(state.results[tot-1].n).col)+`<div style="font-size:10px;color:var(--text3)">Long streaks happen even in random games. A streak isn't "due" to break.</div>`;}
function renderRandom(){const tot=state.results.length,c=counts();document.getElementById('panelRandom').innerHTML='<div class="lbl">Distribution check</div><p>Lucky 28 sums are not uniform. Uneven counts alone are not evidence of bias.</p><p>Observed centre totals (12–15): '+c.slice(12,16).reduce((a,b)=>a+b,0)+' / '+tot+'. Theoretical expectation: '+(tot*.296).toFixed(1)+'.</p><p>Observed extremes (0,1,26,27): '+[0,1,26,27].reduce((a,n)=>a+c[n],0)+'. Expected: '+(tot*.008).toFixed(1)+'.</p><p>Descriptive comparison only. Rare expected counts make the former uniform chi-square verdict invalid. This screen does not declare fairness, bias or profit.</p>';}

function renderPatterns(){
  const el=document.getElementById('panelPatterns');
  const R=state.results;const tot=R.length;
  if(tot<20){el.innerHTML=`<div class="empty">Pattern analysis needs 20+ draws.<br>You have ${tot}. Log ${20-tot} more.</div>`;return;}
  const seq=R.map(r=>r.n);let out='';
  let repeats=0;for(let i=1;i<tot;i++)if(seq[i]===seq[i-1])repeats++;
  const expRepeats=(tot-1)/28;
  const rv = repeats>expRepeats*2.5 ? {t:'REAL — repeats more than chance',c:'var(--green)'} : repeats>expRepeats*1.5 ? {t:'slightly elevated',c:'var(--gold)'} : {t:'just random',c:'var(--text3)'};
  out+=`<div style="margin-bottom:14px"><div class="lbl" style="color:var(--text)">🔁 Back-to-back repeats</div><div style="font-size:12px;color:var(--text2)">Same number twice in a row: <b>${repeats}×</b> (random expects ~${expRepeats.toFixed(1)})</div><div style="font-size:11px;font-weight:700;color:${rv.c};margin-top:2px">${rv.t}</div></div>`;
  const follow={};for(let i=1;i<tot;i++){const a=seq[i-1],b=seq[i];if(!follow[a])follow[a]={};follow[a][b]=(follow[a][b]||0)+1;}
  let bestPair=null;Object.entries(follow).forEach(([a,m])=>{Object.entries(m).forEach(([b,cnt])=>{if(cnt>=3&&(!bestPair||cnt>bestPair.cnt))bestPair={a:+a,b:+b,cnt};});});
  if(bestPair){out+=`<div style="margin-bottom:14px"><div class="lbl" style="color:var(--text)">➡️ Strongest follow-pair</div><div style="font-size:12px;color:var(--text2)">After <b style="color:${colorOf(bestPair.a).col}">${bestPair.a}</b>, <b style="color:${colorOf(bestPair.b).col}">${bestPair.b}</b> came up <b>${bestPair.cnt}×</b></div><div style="font-size:11px;color:var(--text3);margin-top:2px">${bestPair.cnt>=4?'<span style="color:var(--gold)">worth watching</span>':'likely coincidence'}.</div></div>`;}
  let asc=0,desc=0;for(let i=2;i<tot;i++){if(seq[i]===seq[i-1]+1&&seq[i-1]===seq[i-2]+1)asc++;if(seq[i]===seq[i-1]-1&&seq[i-1]===seq[i-2]-1)desc++;}
  out+=`<div style="margin-bottom:14px"><div class="lbl" style="color:var(--text)">🔢 Sequences (like 5-6-7)</div><div style="font-size:12px;color:var(--text2)">Ascending: <b>${asc}</b> · Descending: <b>${desc}</b></div><div style="font-size:11px;color:${(asc+desc)>tot*0.05?'var(--gold)':'var(--text3)'};margin-top:2px">${(asc+desc)>tot*0.05?'More than usual — watch it.':'Normal for random.'}</div></div>`;
  let sbAlt=0,eoAlt=0;for(let i=1;i<tot;i++){if(catsOf(seq[i]).s!==catsOf(seq[i-1]).s)sbAlt++;if(catsOf(seq[i]).p!==catsOf(seq[i-1]).p)eoAlt++;}
  const sbP=Math.round(sbAlt/(tot-1)*100),eoP=Math.round(eoAlt/(tot-1)*100);
  function an(p){if(p>=72)return {t:'flips a lot',c:'var(--gold)'};if(p<=28)return {t:'tends to repeat side',c:'var(--gold)'};return {t:'balanced — random',c:'var(--text3)'};}
  const sbN=an(sbP),eoN=an(eoP);
  out+=`<div style="margin-bottom:14px"><div class="lbl" style="color:var(--text)">🅰️ Category flipping</div><div style="font-size:12px;color:var(--text2)">Small↔Big flips ${sbP}% · <span style="color:${sbN.c}">${sbN.t}</span></div><div style="font-size:12px;color:var(--text2);margin-top:3px">Even↔Odd flips ${eoP}% · <span style="color:${eoN.c}">${eoN.t}</span></div></div>`;
  const anyReal = repeats>expRepeats*3 || (bestPair&&bestPair.cnt>=5) || (asc+desc)>tot*0.08 || sbP>=72 || sbP<=28 || eoP>=72 || eoP<=28;
  out=`<div style="background:${anyReal?'rgba(255,209,102,.08)':'rgba(255,95,109,.06)'};border:1px solid ${anyReal?'var(--gold)':'var(--border)'};border-radius:10px;padding:10px;margin-bottom:14px"><div style="font-size:13px;font-weight:800;color:${anyReal?'var(--gold)':'var(--accent2)'}">${anyReal?'🤔 Some patterns stand out':'🎲 No real patterns — looks random'}</div><div style="font-size:10px;color:var(--text2);margin-top:3px">${anyReal?'One or more appear above random chance. Watch them, keep logging — small samples fool us.':'Repeats, sequences and flips all at random levels. No exploitable pattern yet.'}</div></div>`+out;
  out+=`<div style="font-size:10px;color:var(--text3);margin-top:6px;line-height:1.5">🧠 Reports whether patterns are <b>statistically real</b> or coincidence. Even "worth watching" ones can vanish with more data. Only trust a pattern if it stays strong over 50+ draws AND Smart-Pick accuracy beats random.</div>`;
  el.innerHTML=out;
}

/* ══════════════════════════════════════════════════════════════════════════
   THE PARTS THAT WERE STILL SENTENCES

   Six places in the app answered a question by writing it out in words when the
   answer wanted to be seen. Nothing here changes a single number, a threshold or
   a verdict — the same functions produce the same values, and where the app said
   "slightly elevated" it still says "slightly elevated". Only the presentation
   changed. Delete this block and every screen returns to text.

   What was wrong with the text, in each case, and what it became:

   1. ACCURACY vs CHANCE (AI Predict, Smart Pick)
      "31% (71/230 · CTWL 0/12 · baseline 30%)" — the one thing that matters,
      whether you are above or below the line, was arithmetic you had to do in
      your head, in nine-pixel grey. It is now a bar that grows right from the
      chance line when you are ahead and left when you are behind, so five levels
      can be compared at a glance instead of read.

   2. THE PAPER-PLAY RECORD (AI Predict)
      Unstyled headings and paragraphs at default size, sitting on the main
      screen. Now a card: the captured call shown as the actual numbers, and the
      three figures that matter as their own tiles.

   3. PATTERNS
      Four findings, each of them a comparison — seen this often, chance says
      that often — written as sentences. Now paired bars on one scale, so the
      gap IS the finding.

   4. DISTRIBUTION CHECK
      A four-paragraph essay containing two comparisons. Same treatment.

   5. STREAKS
      "Now: 4× grey in a row / Longest run: 5" — a run of things, described. Now
      drawn as the run it is, against the record behind it.

   A note on the colours: green for ahead and red for behind are the app's own,
   and they hold up — 10.9 apart under red-green colour blindness, where 8 is the
   bar. But nothing here relies on colour alone anyway. Every verdict carries a
   sign and a word as well, so the screens read the same in grey.
   ══════════════════════════════════════════════════════════════════════════ */
(function(){

  /* ══ TEN AND TWELVE ════════════════════════════════════════════════════
     The app offered 1, 2, 4, 8 and 14. Ten and twelve now sit in between.

     (Ten numbers covering 67% of draws is not generosity — it is what the ten

     between sessions, so nothing you had selected can end up pointing at a
