          package com.racexai.bot;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          /**
           * Reads the road surfaces off a picture of the race.
           *
           * Chamet reveals the two hidden surfaces when the race starts, but reveals them
           * as a PICTURE - the track signs are removed from the screen entirely, so there
           * is no text to read.
           *
           * WHAT THIS GOT WRONG THE FIRST TIME: it assumed the three segments were equal
           * thirds and sampled at 1/6, 1/2 and 5/6 of the track. They are not. Measured
           * off a real race, the three ran 22%, 50% and 28% - a segment can be less than
           * half the width of its neighbour, and fixed sampling positions land in the
           * wrong segment as soon as the first one is narrow. So the boundaries are found
           * rather than assumed.
           *
           * They are found on texture as well as colour, because one of the real
           * boundaries is invisible to colour alone: Highway and Potholes are the same
           * grey, and what separates them is that one has holes in it.
           *
           * Two anchors locate the track, both chosen so nothing depends on what colour a
           * road happens to be - which matters, because one of the six is black:
           *
           *   Vertically, the track sits between two red-and-white striped borders, and
           *   the pair with the biggest plausible gap between them brackets it. The WHOLE
           *   screen is searched, not the lower part: in split screen the game sits at the
           *   top, and looking only below the middle finds nothing at all.
           *
           *   Horizontally, the track ends in black-and-white chequered edges, found by
           *   variance rather than colour: read a column downwards and a chequered one
           *   swings between black and white while any road stays roughly constant.
           *
           * Every column is measured by its MEDIAN, so the three cars driving over the
           * track do not drag a segment's colour towards whatever they are painted.
           */
          public class TrackReader {

              /** One stretch of track that reads as a single surface. */
              public static class Run {
                  public final int r, g, b;
                  /** pixels clearly warmer than neutral, per thousand - the centre line */
                  public final int yellow;
                  /** pixels clearly darker than the surface, per thousand - the holes */
                  public final int dark;
                  /** how much of the whole track this stretch covers, as a percentage */
                  public final int pct;

                  Run(int r, int g, int b, int yellow, int dark, int pct) {
                      this.r = r; this.g = g; this.b = b;
                      this.yellow = yellow; this.dark = dark; this.pct = pct;
                  }
                  @Override public String toString() {
                      return "(" + r + "," + g + "," + b + ") y" + yellow + " d" + dark + " " + pct + "%";
                  }
              }

              public static class Read {
                  /** the stretches, left to right; between 1 and 3 of them */
                  public List<Run> runs;
                  public int trackTop, trackBottom, trackLeft, trackRight;
                  public String why = "";
                  public boolean ok() { return runs != null && runs.size() >= 1 && runs.size() <= 3; }
              }

              public interface Pixels {
                  int width();
                  int height();
                  /** 0xRRGGBB at x,y */
                  int rgb(int x, int y);
              }

              private static int R(int c) { return (c >> 16) & 0xFF; }
              private static int G(int c) { return (c >> 8) & 0xFF; }
              private static int B(int c) { return c & 0xFF; }

              /** The saturated red of the border stripes, and of nothing else on a road. */
              private static boolean isRed(int c) {
                  int r = R(c), g = G(c), b = B(c);
                  return r > 190 && g < 130 && b < 130 && r - g > 70;
              }

              /** How vivid a colour is, 0..100. The cars are; the roads are not. */
              private static int sat(int c) {
                  int mx = Math.max(R(c), Math.max(G(c), B(c)));
                  int mn = Math.min(R(c), Math.min(G(c), B(c)));
                  return mx == 0 ? 0 : (mx - mn) * 100 / mx;
              }

              /** A column, measured so that a car sitting on it does not matter. */
              private static class Col {
                  int r, g, b, yellow, dark;
              }

              public static Read read(Pixels px) {
                  Read out = new Read();
                  final int W = px.width(), H = px.height();
                  if (W < 200 || H < 400) { out.why = "screen too small"; return out; }

                  // ── the striped borders, searched over the WHOLE screen ──
                  List<int[]> bands = new ArrayList<>();
                  int runStart = -1, lastHit = -1;
                  for (int y = 0; y < H - 6; y += 3) {
                      int red = 0, tot = 0;
                      for (int x = 0; x < W; x += 4) { tot++; if (isRed(px.rgb(x, y))) red++; }
                      boolean hit = tot > 0 && red * 100 / tot > 18;
                      if (hit) {
                          if (runStart < 0 || y - lastHit > 15) {
                              if (runStart >= 0) bands.add(new int[]{ runStart, lastHit });
                              runStart = y;
                          }
                          lastHit = y;
                      }
                  }
                  if (runStart >= 0) bands.add(new int[]{ runStart, lastHit });
                  if (bands.size() < 2) { out.why = "no striped track border found"; return out; }

                  int bestGap = -1, y0 = 0, y1 = 0;
                  for (int i = 0; i + 1 < bands.size(); i++) {
                      int gap = bands.get(i + 1)[0] - bands.get(i)[1];
                      // a track is a sizeable slice of the screen, but never most of it
                      if (gap < H * 0.05 || gap > H * 0.40) continue;
                      if (gap > bestGap) { bestGap = gap; y0 = bands.get(i)[1]; y1 = bands.get(i + 1)[0]; }
                  }
                  if (bestGap < 0) { out.why = "no plausible track band"; return out; }
                  y0 += 8; y1 -= 8;

                  // ── the chequered ends ──
                  int x0 = edge(px, y0, y1, true, W);
                  int x1 = edge(px, y0, y1, false, W);
                  if (x1 - x0 < W / 3) { out.why = "track too narrow"; return out; }

                  out.trackTop = y0; out.trackBottom = y1; out.trackLeft = x0; out.trackRight = x1;

                  // ── measure every column ──
                  final int STEP = 4;
                  List<Col> cols = new ArrayList<>();
                  for (int x = x0; x < x1; x += STEP) {
                      Col c = column(px, x, y0, y1);
                      if (c != null) cols.add(c);
                  }
                  if (cols.size() < 12) { out.why = "track too thin to measure"; return out; }

                  // ── cut it where the surface actually changes ──
                  //
                  // Every candidate split is scored by comparing a window of track on each
                  // side of it, rather than one column against the next - a boundary is a
                  // few pixels wide and gradual, and column-to-column differences are
                  // dominated by texture noise. The strongest split is taken if it is
                  // strong enough, then each side is scored again. At most two splits,
                  // because there are at most three surfaces.
                  List<int[]> segs = new ArrayList<>();
                  segs.add(new int[]{ 0, cols.size() - 1 });
                  for (int pass = 0; pass < 2; pass++) {
                      int bestScore = 0, bestSeg = -1, bestAt = -1;
                      for (int si = 0; si < segs.size(); si++) {
                          int lo = segs.get(si)[0], hi = segs.get(si)[1];
                          int win = Math.max(4, cols.size() / 10);
                          int margin = Math.max(3, cols.size() * 8 / 100);
                          for (int cut = lo + margin; cut <= hi - margin; cut++) {
                              Col L = mean(cols, new int[]{ Math.max(lo, cut - win), cut - 1 });
                              Col Rr = mean(cols, new int[]{ cut, Math.min(hi, cut + win - 1) });
                              int sc = dist(L, Rr);
                              if (sc > bestScore) { bestScore = sc; bestSeg = si; bestAt = cut; }
                          }
                      }
                      if (bestSeg < 0 || bestScore < 60) break;
                      int lo = segs.get(bestSeg)[0], hi = segs.get(bestSeg)[1];
                      segs.set(bestSeg, new int[]{ lo, bestAt - 1 });
                      segs.add(bestSeg + 1, new int[]{ bestAt, hi });
                  }

                  int total = cols.size();
                  List<Run> runs = new ArrayList<>();
                  for (int[] sg : segs) {
                      Col m = mean(cols, sg);
                      int w = sg[1] - sg[0] + 1;
                      runs.add(new Run(m.r, m.g, m.b, m.yellow, m.dark, w * 100 / total));
                  }
                  out.runs = runs;
                  return out;
              }

              /** Median colour of one column, plus how much of it is line and how much hole. */
              private static Col column(Pixels px, int x, int y0, int y1) {
                  List<Integer> rs = new ArrayList<>(), gs = new ArrayList<>(), bs = new ArrayList<>();
                  for (int y = y0; y < y1; y += 5) {
                      int c = px.rgb(x, y);
                      rs.add(R(c)); gs.add(G(c)); bs.add(B(c));
                  }
                  if (rs.size() < 4) return null;
                  Collections.sort(rs); Collections.sort(gs); Collections.sort(bs);
                  Col c = new Col();
                  c.r = rs.get(rs.size() / 2); c.g = gs.get(gs.size() / 2); c.b = bs.get(bs.size() / 2);
                  int mv = (c.r + c.g + c.b) / 3, yel = 0, drk = 0, n = 0;
                  for (int y = y0; y < y1; y += 3) {
                      int p = px.rgb(x, y); n++;
                      if (R(p) - B(p) > 70 && R(p) > 140) yel++;
                      // neutral only: a car is vivid, and would otherwise read as holes
                      if ((R(p) + G(p) + B(p)) / 3 < mv - 28 && sat(p) < 22) drk++;
                  }
                  c.yellow = n == 0 ? 0 : yel * 1000 / n;
                  c.dark = n == 0 ? 0 : drk * 1000 / n;
                  return c;
              }

              /**
               * How far apart two stretches of track look. COLOUR ONLY.
               *
               * Texture was in here and it was a mistake. Potholes are scattered blobs
               * with bare road between them, so the hole count rises and falls all the way
               * along a single segment - and a run of clean tarmac at the start of one
               * looked exactly like a boundary. On a real frame that split one Potholes
               * segment in two and invented a Highway that was never in the race.
               *
               * Texture still earns its keep, but for naming a stretch rather than finding
               * its edges: the holes are what tell Potholes from the other greys once the
               * stretch has been cut out. Edges come from colour, which does not flicker.
               */
              private static int dist(Col a, Col b) {
                  return Math.abs(a.r - b.r) + Math.abs(a.g - b.g) + Math.abs(a.b - b.b);
              }

              private static Col mean(List<Col> cols, int[] seg) {
                  long r = 0, g = 0, b = 0, y = 0, d = 0; int n = 0;
                  for (int i = seg[0]; i <= seg[1]; i++) {
                      Col c = cols.get(i); r += c.r; g += c.g; b += c.b; y += c.yellow; d += c.dark; n++;
