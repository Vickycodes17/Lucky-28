          package com.racexai.bot;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.speech.tts.Voice;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;

          /**
           * Android WebView has no Web Speech API, so every speechSynthesis call in the
           * app would silently do nothing. This exposes the platform TextToSpeech engine
           * to JavaScript; Shim.JS in MainActivity rebuilds window.speechSynthesis and
           * SpeechSynthesisUtterance on top of it, so the page's own code is untouched.
           */
          public class TtsBridge {

              private final Activity activity;
              private final WebView web;
              /**
               * VOLATILE, AND IT MATTERS MORE THAN IT LOOKS.
               *
               * Every @JavascriptInterface method below runs on a WebView binder
               * thread, not the UI thread - a private pool the page cannot see.
