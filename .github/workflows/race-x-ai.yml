              private int speechVolume() {
                  try {
                      android.media.AudioManager am = (android.media.AudioManager)
                          activity.getSystemService(android.content.Context.AUDIO_SERVICE);
                      if (am == null) return -1;
                      int max = am.getStreamMaxVolume(android.media.AudioManager.STREAM_MUSIC);
                      if (max <= 0) return -1;
                      return am.getStreamVolume(android.media.AudioManager.STREAM_MUSIC) * 100 / max;
                  } catch (Throwable t) { return -1; }
              }

              /**
               * Everything known about this phone's ability to speak, for the Voice check
               * screen. A phone that says nothing should be able to say why.
