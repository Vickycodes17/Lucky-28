              private static int edge(Pixels px, int y0, int y1, boolean fromLeft, int W) {
                  int stride = Math.max(2, (y1 - y0) / 60);
                  int run = 0;
                  boolean seenBorder = false;
                  int borderRun = 0;
                  for (int i = 0; i < W / 2; i += 2) {
                      int x = fromLeft ? i : W - 1 - i;
