          cat > app/src/main/java/com/lucky28/bot/MainActivity.java <<'___L28_EOF___'
          package com.lucky28.bot;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          /**
           * The app itself: one WebView holding the page, plus a small bridge so the page
           * can ask whether the watcher is on and open the settings screen that switches
           * it on.
           *
           * Everything the watcher reads arrives here through pushBoard and is handed to
           * the page as window.__l28Board — the page never talks to Android directly, and
           * it works perfectly well with nothing pushing at all, which is what it does in
           * a browser.
           */
          public class MainActivity extends Activity {

              private static MainActivity live;
              private WebView web;
              private final Handler ui = new Handler(Looper.getMainLooper());
              private String pendingJson = null, pendingRaw = null;

              /** Called from the watcher thread; hops to the UI thread and into the page. */
              static void pushBoard(final String json, final String raw) {
                  final MainActivity a = live;
                  if (a == null) return;
                  a.ui.post(new Runnable() {
                      @Override public void run() { a.deliver(json, raw); }
                  });
              }

              private void deliver(String json, String raw) {
                  if (web == null) { pendingJson = json; pendingRaw = raw; return; }
                  String js = "(function(){try{"
                          + "window.__l28Board=" + json + ";"
                          + "window.__l28Board.at=Date.now();"
                          + "window.__l28Raw=" + quote(raw) + ";"
                          + "if(typeof window.__l28Push==='function')window.__l28Push(window.__l28Board);"
                          + "}catch(e){}})();";
                  try { web.evaluateJavascript(js, null); } catch (Throwable t) { }
              }

              private static String quote(String s) {
                  if (s == null) return "\"\"";
                  StringBuilder b = new StringBuilder("\"");
                  for (int i = 0; i < s.length(); i++) {
                      char c = s.charAt(i);
                      if (c == '"' || c == '\\') b.append('\\').append(c);
                      else if (c == '\n' || c == '\r') b.append(' ');
                      else if (c < 0x20) b.append(' ');
                      else b.append(c);
                  }
                  return b.append('"').toString();
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  live = this;
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);          // the page keeps its history here
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  }
                  web.setBackgroundColor(0xFF000000);
                  web.addJavascriptInterface(new Bridge(), "Android28");
                  web.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView v, String url) {
                          if (pendingJson != null) { deliver(pendingJson, pendingRaw); pendingJson = null; }
                      }
                      /* Nothing in this app should ever navigate away from the asset. */
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) { return true; }
                  });
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override protected void onDestroy() {
                  if (live == this) live = null;
                  super.onDestroy();
              }

              @Override public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed();
              }

              /** The whole native surface the page can see. Deliberately tiny. */
              private final class Bridge {
                  @JavascriptInterface public boolean watching() { return WatchService.alive(); }
                  @JavascriptInterface public String lastBoard() { return WatchService.peek(); }
                  @JavascriptInterface public String lastRaw()   { return WatchService.peekRaw(); }
                  @JavascriptInterface public long   lastAt()    { return WatchService.peekAt(); }
                  @JavascriptInterface public String build()     { return BuildConfig.L28_BUILD; }
                  /** Opens the one settings screen the user has to visit, once. */
                  @JavascriptInterface public void openAccessibility() {
                      try {
                          Intent i = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      } catch (Throwable t) { }
                  }
              }
          }

