              }

              private void cacheEngines() {
                  try {
                      TextToSpeech t = tts;
                      if (t == null) return;
                      java.util.List<TextToSpeech.EngineInfo> all = t.getEngines();
                      if (all == null || all.isEmpty()) return;
                      synchronized (engineCache) {
                          engineCache.clear();
                          for (TextToSpeech.EngineInfo e : all) {
