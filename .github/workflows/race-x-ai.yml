                                                  + "from the picture is not possible either";
                                      else
                                          verdict = "a real picture (" + hues.size() + " colours)";

                                      shotSaved(vw + "x" + vh + (clipped ? " (the game's half)" : " (whole screen)")
                                              + ", brightness " + min + "-" + max + " mean " + mean
                                              + " — " + verdict + "  →  " + where);
                                      try { if (cut != soft) cut.recycle(); } catch (Throwable ignored) { }
                                      try { soft.recycle(); } catch (Throwable ignored) { }
                                  } catch (Throwable t) {
                                      shotSaved("failed: " + t);
                                  } finally {
                                      if (bmp != null) try { bmp.recycle(); } catch (Exception ignored) { }
                                      if (buf != null) try { buf.close(); } catch (Exception ignored) { }
                                  }
                              }
                              @Override public void onFailure(int code) {
                                  if (code == 3) pacer.refused();
                                  shotSaved("the phone refused the screenshot, code " + code
                                          + (code == 3 ? " — it was still busy with the last one; try again in a moment"
                                                       : ""));
                              }
                          });
                  } catch (Throwable t) { shotSaved("cannot screenshot: " + t); }
              }

              private void shotSaved(String what) {
                  MainActivity.js("RaceAuto.shot(\"" + esc(what) + "\")");
              }

              public static boolean isRunning() { return instance != null; }
              public static int filled() { return instance == null ? 0 : instance.watcher.filledCount(); }
              public static int logged() { return instance == null ? 0 : instance.watcher.loggedCount(); }
              public static int ranks() { return instance == null ? 0 : instance.watcher.rankCount(); }
              /** How many vehicle names the last screen carried - the rank reader's gate. */
              public static int lastVehicleCount() { return instance == null ? -1 : instance.lastVehicles; }

              /**
               * READ THE WIN RATE RANK SCREEN, NOW.
               *
               * Tapping Read used to do nothing a person could see, and there were two
               * reasons for it and neither was in the button. The table is handed over
               * only when it changes, so a screen already read was never sent again;
               * and nothing reads the screen except an accessibility event, so with
               * Chamet sitting still in the other half of the split screen there were
               * no events to read it on.
               *
               * This answers both: forget the last table, then take a reading right
               * now rather than waiting to be woken. Returns false when the watcher is
               * not running at all, which is a different problem and gets a different
               * message.
               */
              public static boolean readRankNow() {
                  final WatchService s = instance;
                  if (s == null) return false;
                  try { s.watcher.forgetRank(); } catch (Exception ignored) { }
                  final android.os.Handler h = s.reader;
                  if (h == null) { try { s.scan(); } catch (Throwable ignored) { } return true; }
                  h.post(new Runnable() {
                      @Override public void run() {
                          try { s.scan(); } catch (Throwable ignored) { }
                      }
                  });
                  return true;
              }

              /**
               * NONE OF THE HEAVY WORK BELONGS ON THE MAIN THREAD, and until now all of it
               * was there.
               *
               * onAccessibilityEvent is delivered on this app's main thread - the same
               * thread that draws our own screen and handles scrolling. What it then did
               * was walk the other app's entire view tree, and every single getChild() in
               * that walk is a call across into another process. A Chamet party is
               * thousands of nodes; thousands of cross-process calls, several times a
               * second, on the thread that is supposed to be drawing. Then the screenshot
               * callback ran on whatever thread delivered it and scanned two and a half
               * million pixels there too.
               *
               * That is the freeze. Not a leak, not a slow build-up in the page - the
               * phone stops moving because the thread that moves it is busy reading
               * somebody else's screen. It got worse the longer the app ran only because
               * the longer you sit in a party the bigger that tree gets.
               *
               * So the reading moves to a thread of its own. Nothing about WHAT is read
               * changes; it simply stops being read on the thread that draws. The main
               * thread now does one string comparison per event and hands over.
               */
              private android.os.HandlerThread readThread;
              private volatile android.os.Handler reader;

              @Override protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  try {
                      // FOREGROUND, NOT BACKGROUND. A background-priority thread is put in
                      // the group Android starves first, and on a phone that is also running
                      // a video call it could wait whole frames for a turn - every one of
                      // them a late reading of a price that was moving. The work is small
                      // and short now (a fast read is a handful of views), so it can afford
                      // to be on time.
                      readThread = new android.os.HandlerThread("racex-read",
                          android.os.Process.THREAD_PRIORITY_FOREGROUND);
                      readThread.start();
                      reader = new android.os.Handler(readThread.getLooper());
                      grabHandler = reader;
                  } catch (Throwable t) {
                      // No background thread? Then read on the main one as before. Slow is
                      // better than not working at all, and this is not expected to happen.
                      reader = null;
                      grabHandler = new android.os.Handler(android.os.Looper.getMainLooper());
                  }
              }

              @Override public void onDestroy() {
                  if (instance == this) instance = null;
                  try { if (readThread != null) readThread.quitSafely(); } catch (Throwable ignored) { }
                  readThread = null; reader = null;
                  super.onDestroy();
              }

              @Override public void onInterrupt() { }

              /**
               * The game's package, once it has proved itself by containing the board.
               *
               * Removing the hardcoded package name was right - it locked the bot to one
               * build of a game that ships under several names - but it was only half the
               * job. With no filter at all the service is woken by EVERY app, including
               * this one, and each wake walks the whole view tree of every window on
               * screen. A Chamet party screen is an enormous tree - members, chat, gifts,
               * seats - and our own page fires events constantly as it redraws. That is
               * the split-screen lag, and it was my doing.
               *
               * So the package is LEARNED instead of hardcoded: read everything until the
               * board turns up somewhere, then read only that app. Works on any build,
               * costs what the old hardcoded version cost.
               */
              private volatile String gamePkg = null;
              /** where the game's window sits on screen, so the track is looked for there */
              private volatile Rect gameRect = null;
              private volatile String gamePkgSeen = null;
              /** the window the last screenshot was cut down to, for the diagnostic */
              private volatile String lastClip = null;

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  // ── everything in this method runs on the thread that draws the screen,
                  // so it does as close to nothing as it can and hands over ──

                  // Our own redraws are not news. This is the cheapest possible check and
                  // it comes before everything: no getWindows, no tree walk.
                  try {
                      CharSequence ep = event == null ? null : event.getPackageName();
                      if (ep != null && ep.toString().equals(getPackageName())) return;
                      // and once the game is known, nothing else is worth waking up for
                      String gp = gamePkg;
                      if (gp != null && ep != null && !ep.toString().equals(gp)) return;
                  } catch (Exception ignored) { }

                  // ── NOTHING THAT ASKS IS DROPPED ANY MORE ──
                  //
                  // This returned whenever the last look was under 600ms ago, and booked
                  // nothing for later - so a price that changed just after a look, with no
                  // event after it, was never seen at all. That is the last second of
                  // every race: the money lands, the board closes, and the screen goes
                  // quiet. Now an event inside the gap books a look for the end of it, and
                  // one that arrives while a look is running books another straight after.
                  // Events still never queue up: there is only ever one look booked.
                  request();
              }

              // ── THE SCHEDULER ── one read running at a time, at most one booked
              private final Object sched = new Object();
              private boolean reading = false;      // a read is running on the reader thread
              private boolean askedAgain = false;   // and something asked for a look while it did
              private long bookedFor = -1;          // when the next read is booked for (elapsedRealtime)

              private final Runnable readTask = new Runnable() {
                  @Override public void run() {
                      synchronized (sched) { bookedFor = -1; reading = true; askedAgain = false; }
                      try { readOnce(); } catch (Throwable ignored) { }
                      boolean again;
                      synchronized (sched) { reading = false; again = askedAgain; askedAgain = false; }
                      // asked while reading: look again as soon as the pace allows; if not,
                      // the heartbeat - which only an open board, or one just closed, has
                      book(again);
                  }
              };

              /** Something wants a look at the screen. */
              private void request() {
                  if (reader == null) {
                      // no reader thread: the old way, on the main thread, paced
                      if (pace.delay(SystemClock.elapsedRealtime(), true) > 0) return;
                      try { readOnce(); } catch (Throwable ignored) { }
                      return;
                  }
                  book(true);
              }

              /** Book the next read as soon as the pace allows, unless one is booked sooner. */
              private void book(boolean asked) {
                  final android.os.Handler h = reader;
                  if (h == null) return;
                  final long now = SystemClock.elapsedRealtime();
                  final long d = pace.delay(now, asked);
                  if (d < 0) return;                       // nothing to watch, and nobody asked
                  final long at = now + d;
                  synchronized (sched) {
                      if (reading) { if (asked) askedAgain = true; return; }
                      if (bookedFor >= 0 && bookedFor <= at) return;
                      if (bookedFor >= 0) h.removeCallbacks(readTask);
                      bookedFor = at;
                  }
                  h.postDelayed(readTask, d);
              }

              /** whether the last full look found a board */
              private volatile boolean lastFoundBoard = false;
              private volatile long lastFastMs = 0;

              /**
               * One look: the board's own views if they are in hand and betting is open,
               * otherwise every window. The time is taken BEFORE looking, so each reading
               * the app gets says when the screen was actually read.
               */
              private void readOnce() {
                  final long t0 = SystemClock.elapsedRealtime();
                  final long wall = System.currentTimeMillis();
                  pace.started(t0);
                  boolean full = pace.fullDue(t0, !boardNodes.isEmpty());
                  if (!full) {
                      String dump = fastScan();
                      if (dump == null) {
                          full = true;                     // a view has gone - the board changed; look at everything
                      } else {
                          lastFastMs = SystemClock.elapsedRealtime() - t0;
                          try { watcher.feed(dump, wall); } catch (Exception ignored) { }
                          // betting closed on that frame: the board's views are done with
                          if (!watcher.bettingOpen()) dropBoardNodes();
                      }
                  }
                  if (full) scan(wall);
                  final long t1 = SystemClock.elapsedRealtime();
                  pace.done(t1, t1 - t0, full, full ? lastFoundBoard : true,
                            watcher.bettingOpen(), watcher.secondsLeft());
              }

              // ── THE FAST LANE ──
              //
              // A full look walks every view in a Chamet party - seats, gifts, members, a
              // chat that never stops - and the board is a few dozen of them. While betting
              // is open, only the board matters, and only a handful of its views ever
              // change: the prices, the stake on each vehicle, the clock, and the panel that
              // folds away at the close. Those are kept from the last full look and asked
              // for again, each one fetched fresh from Chamet with refresh(), which also
              // goes round the system's cache of the tree - so a reading can never be a
              // stale copy of a number that has already moved.
              private static final java.util.Set<String> BOARD_IDS = new java.util.HashSet<>(java.util.Arrays.asList(
                  "race_game_bg", "gameBetView", "cl_track_content", "ll_track_sign", "tv_track_sign",
                  "tv_race_surplus", "tv_car_name", "tv_car_odds", "tv_totalBet"));
              private static final java.util.Set<String> MOVING_IDS = new java.util.HashSet<>(java.util.Arrays.asList(
                  "gameBetView", "tv_race_surplus", "tv_car_odds", "tv_totalBet"));
              /** the board's views, in walk order, from the last full look that found it open */
              private final java.util.ArrayList<AccessibilityNodeInfo> boardNodes = new java.util.ArrayList<>();
              private final java.util.ArrayList<String> boardIds = new java.util.ArrayList<>();
              /** filled during a full walk */
              private java.util.ArrayList<AccessibilityNodeInfo> collecting = null;
              private final java.util.ArrayList<String> collectingIds = new java.util.ArrayList<>();

              private static String shortId(String id) {
                  if (id == null) return null;
                  int slash = id.lastIndexOf(":id/");
                  return slash >= 0 ? id.substring(slash + 4) : id;
              }

              private void dropBoardNodes() {
                  for (AccessibilityNodeInfo n : boardNodes) try { n.recycle(); } catch (Throwable ignored) { }
                  boardNodes.clear(); boardIds.clear();
              }

              /** The board, re-read from its own views. Null if any of them has gone. */
              private String fastScan() {
                  if (boardNodes.isEmpty()) return null;
                  StringBuilder sb = new StringBuilder(2048);
                  for (int i = 0; i < boardNodes.size(); i++) {
                      AccessibilityNodeInfo n = boardNodes.get(i);
                      String sid = boardIds.get(i);
                      if (MOVING_IDS.contains(sid)) {
                          boolean alive;
                          try { alive = n.refresh(); } catch (Throwable t) { alive = false; }
                          if (!alive) { dropBoardNodes(); return null; }
                      }
                      line(n, n.getViewIdResourceName(), sb);
                  }
                  return sb.toString();
              }

              /**
               * After a full look: keep the board's views for the fast lane, but only when
               * betting is open on a board read by its ids - a board found by its words
               * alone has no ids to find again, so it stays on full looks.
               */
              private void keepBoardNodes() {
                  java.util.ArrayList<AccessibilityNodeInfo> got = collecting;
                  collecting = null;
                  if (got == null) return;
                  int odds = 0, bets = 0, panel = 0;
                  for (String id : collectingIds) {
                      if ("tv_car_odds".equals(id)) odds++;
                      else if ("tv_totalBet".equals(id)) bets++;
                      else if ("gameBetView".equals(id)) panel++;
                  }
                  dropBoardNodes();
                  if (watcher.bettingOpen() && !RaceReader.byContent && odds == 3 && bets == 3 && panel == 1) {
                      boardNodes.addAll(got);
                      boardIds.addAll(collectingIds);
                  } else {
                      for (AccessibilityNodeInfo n : got) try { n.recycle(); } catch (Throwable ignored) { }
                  }
                  collectingIds.clear();
              }

              /** how long the last pass took, so "is it still laggy?" has a number */
              private volatile long lastPassMs = 0;
              private volatile boolean offMain = false;

              /** One reading of the screen. Runs on the reader thread, never on the main one. */
              private void scan() { scan(System.currentTimeMillis()); }

              private void scan(final long wall) {
                  final long t0 = SystemClock.elapsedRealtime();
                  collecting = new java.util.ArrayList<>();
                  collectingIds.clear();
                  offMain = (android.os.Looper.myLooper() != android.os.Looper.getMainLooper());
                  StringBuilder sb = new StringBuilder();
                  StringBuilder seen = new StringBuilder();
                  walked = 0;                       // the node budget is per pass
                  windowsSeen = 0;
                  winTypes.setLength(0);
                  List<AccessibilityWindowInfo> windows = null;
                  try { windows = getWindows(); } catch (Exception ignored) { }
                  if (windows == null) { keepBoardNodes(); return; }

                  for (AccessibilityWindowInfo w : windows) {
                      if (w == null) continue;
                      // ── WHICH WINDOWS ARE WORTH LOOKING IN ──
                      //
                      // This took application windows only, on the grounds that the status
                      // bar and the keyboard are never the game. True on a phone. On an
                      // emulator a window can come back as something else entirely, and the
                      // one screen that would not read - Win Rate Rank under BlueStacks -
                      // reported twelve views and one word where a phone reports hundreds.
                      // Skipping a window by its type is a guess about the platform; reading
                      // it and finding nothing costs a few milliseconds and guesses nothing.
                      // Only the two that genuinely never hold a game are skipped now.
                      windowsSeen++;
                      try {
                          int wt = w.getType();
                          if (wt == AccessibilityWindowInfo.TYPE_INPUT_METHOD
                           || wt == AccessibilityWindowInfo.TYPE_ACCESSIBILITY_OVERLAY) continue;
                          if (winTypes.indexOf(String.valueOf(wt)) < 0) winTypes.append(wt).append(' ');
                      } catch (Exception ignored) { }
                      AccessibilityNodeInfo root = null;
                      try { root = w.getRoot(); } catch (Exception ignored) { }
                      if (root == null) continue;
                      // ── AND ASK FOR IT AGAIN BEFORE READING IT ──
                      //
                      // getRoot() can hand back a node the system cached a moment ago, and a
                      // cached root can be shallower than the real one: its children were
                      // never fetched. refresh() forces the fetch. One call per window per
                      // pass, and it is the difference between a tree with the board in it
                      // and a tree with four container names in it.
                      try { root.refresh(); } catch (Throwable ignored) { }
                      CharSequence pkg = root.getPackageName();
                      final String ps = pkg == null ? "" : pkg.toString();

                      // EVERY APP EXCEPT OUR OWN GETS READ.
                      //
                      // This used to be `ps.indexOf("matemet") >= 0` - the package of the
                      // one build that happened to be installed when it was written. The
                      // same game ships under several names (Chamet, ChillChat, MateMe and
                      // others), and on every one of them the bot silently did nothing at
                      // all, because no window ever passed the test. A package name was
                      // never the right question.
                      //
                      // The right question is whether the window CONTAINS the Lucky Race
                      // board, and RaceWatcher.feed already refuses any dump that does
                      // not. Content is the test; the package is just a label.
                      if (!ps.equals(getPackageName()) && (gamePkg == null || ps.equals(gamePkg))) {
                          if (ps.length() > 0 && seen.indexOf(ps) < 0) seen.append(ps).append(' ');
                          int before = sb.length();
                          walk(root, sb);
                          // WHERE this app's window is, so the track is looked for inside
                          // it and not across the whole display. In split screen the other
                          // half is OUR app, and its own dark background was being read as
                          // a road - "(24,23,21) 100%" is this page, not a track.
                          if (sb.length() > before) {
                              try {
                                  Rect wb = new Rect();
                                  w.getBoundsInScreen(wb);
                                  if (wb.width() > 100 && wb.height() > 100) { gameRect = wb; gamePkgSeen = ps; }
                              } catch (Exception ignored) { }
                          }
                      }
                      try { root.recycle(); } catch (Exception ignored) { }
                  }

                  // What it is actually looking at, so a build that names its views
                  // differently shows up as a fact rather than as "auto does not work".
                  // ── WHEN THE WINDOWS COME BACK NEARLY EMPTY, ASK THE OTHER WAY ──
                  //
                  // getWindows() and getRootInActiveWindow() are two different routes to
                  // the same tree, and they do not always return the same thing: the
                  // first walks every window the service is allowed to see, the second
                  // asks the system for the focused one. On the build where the Win Rate
                  // Rank screen would not read, the first route came back with twelve
                  // views and one word. This tries the second before giving up - it costs
                  // one call, and only on a pass that found next to nothing.
                  if (walked < 40) {
                      AccessibilityNodeInfo act = null;
                      try { act = getRootInActiveWindow(); } catch (Throwable ignored) { }
                      if (act != null) {
                          try { act.refresh(); } catch (Throwable ignored) { }
                          CharSequence ap = act.getPackageName();
                          String aps = ap == null ? "" : ap.toString();
                          if (!aps.equals(getPackageName()) && (gamePkg == null || aps.equals(gamePkg))) {
                              int before2 = sb.length();
                              walk(act, sb);
                              if (sb.length() > before2 && aps.length() > 0 && seen.indexOf(aps) < 0)
                                  seen.append(aps).append(' ');
                          }
                          try { act.recycle(); } catch (Throwable ignored) { }
                      }
                  }
                  final String dump = sb.toString();
                  // WHAT THE PARSER ACTUALLY NEEDS, rather than the name of the box it
                  // sits in. `race_game_bg` and `gameBetView` are containers, and a build
                  // that renames one of them would fail this test while being perfectly
                  // readable. The vehicle names and their odds are what a board IS - if
                  // those are on screen, there is a board here whatever the wrapper is
                  // called.
                  // AND THE SAME QUESTION ONE LAYER OUT: is this a board, or is it just
                  // named the way one build happens to name a board?
                  //
                  // All three of these are view ids from the build that was installed when
                  // this was written. A build that calls its views anything else fails
                  // every one of them and the bot never wakes up - which is the shape of
                  // the original bug, just moved from the package name to the view names.
                  //
                  // So the last test is the words themselves: three known vehicle names,
                  // in a row, is a betting board whatever the views are called.
                  final boolean found = dump.indexOf("tv_car_name") >= 0
                                     || dump.indexOf("race_game_bg") >= 0
                                     || dump.indexOf("gameBetView") >= 0
                                     || RaceReader.looksLikeBoard(dump);

                  // and the pace follows - ReadPacer is told after this returns
                  lastFoundBoard = found;
                  // The board proves which app the game is. From here on only that one is
                  // read, which is what makes this affordable again.
                  if (found && gamePkg == null && gamePkgSeen != null) gamePkg = gamePkgSeen;
                  lastPassMs = SystemClock.elapsedRealtime() - t0;
                  lastDrawn = looksDrawn(dump);
                  // how many of the nine were on screen, so "the rank table will not read"
                  // can be answered with a number instead of a guess
                  try { lastVehicles = RaceReader.vehicleLabels(dump); } catch (Throwable ignored) { }
                  reportSeen(seen.toString(), found, dump);

                  if (dump.length() == 0) { keepBoardNodes(); return; }
                  try { watcher.feed(dump, wall); } catch (Exception ignored) { }
                  keepBoardNodes();
              }

              /** was the last screen a game canvas rather than ordinary views? */
              private volatile boolean lastDrawn = false;
              private volatile int lastVehicles = -1;

              /**
               * Which view names mean "this game is drawn, not written".
               *
               * ChillChat paints its Lucky Race panel into a Cocos2d canvas: eleven views
               * on the whole screen, not a word among them. That is not a parser problem
               * and no parser will ever fix it - a canvas is one surface, and accessibility
               * is told nothing about what is painted onto it. Recognising the shape of
               * that failure is worth keeping, so the diagnostic can say "there is nothing
               * here to read" instead of "no board found", which sounds fixable and is not.
               */
              static boolean looksDrawn(String dump) {
                  if (dump == null) return false;
                  return dump.indexOf("GameCanvas") >= 0
                      || dump.indexOf("Cocos2d") >= 0
                      || dump.indexOf("cocos") >= 0
                      || dump.indexOf("GLSurfaceView") >= 0
                      || dump.indexOf("UnityPlayer") >= 0;
              }

              private String lastSeen = "";
              private boolean lastFound = false;
              private int events = 0;

              /**
               * Tell the app which apps are on screen, whether the board was in any of
               * them, and - when it was not - WHICH VIEWS WERE ACTUALLY THERE.
               *
               * That last part is the point. "Auto is not working" is not a diagnosis, and
               * for months there was nothing anywhere that could turn it into one. If a
               * build of the game names its views differently this now prints the names it
               * did find, which is the one thing needed to make it work.
               *
               * It repeats every so often even when nothing has changed, so the timestamp
               * keeps moving. A frozen timestamp then means the service is not running at
               * all - a different problem with a different fix, and previously
               * indistinguishable from this one.
               */
              private void reportSeen(String seen, boolean found, String dump) {
                  events++;
                  boolean same = seen.equals(lastSeen) && found == lastFound;
                  if (same && (events % 20) != 0) return;
                  lastSeen = seen; lastFound = found;

                  String msg;
                  if (seen.length() == 0) {
                      msg = "no other app on screen  (" + events + " screen reads)";
                  } else if (found) {
                      msg = seen.trim() + "  —  Lucky Race board found";
                  } else {
                      // THE WORDS, NOT ONLY THE VIEW NAMES.
                      //
                      // Last time this reported fourteen view names and nothing else, and
                      // that was not enough to tell whether the board was in the tree
                      // under names we did not know or was not in the tree at all - which
                      // are completely different problems with completely different fixes.
                      // What the screen SAYS settles it in one line: if "Highway" and the
                      // odds are in here, the board is readable and only the matching is
                      // wrong. If they are not, no parser can help and the picture is the
                      // only route.
                      msg = seen.trim() + "  —  no Lucky Race board in it."
                          + "  Words on screen: " + textSample(dump)
                          + "  Views: " + idSample(dump);
                      // AND WHETHER THAT IS EVEN A PROBLEM ANY MORE. A canvas game will
                      // never put its board in the view tree, so "no board in it" is the
                      // expected answer there rather than a fault - what matters is that
                      // the eye is reading the picture instead. Saying so stops this line
                      // looking like a failure when it is the normal state of things.
                      if (lastDrawn) msg += "  —  this game DRAWS its board into a canvas, so there is nothing in it to read";
                  }
                  // The pass time and WHERE it ran. If the phone ever sticks again this
                  // says in one line whether the reading is the cause: a big number on the
                  // main thread is a frozen screen, the same number off it is not.
                  msg += "   [" + walked + " views in " + windowInfo()
                       + ", " + pace.describe(SystemClock.elapsedRealtime())
                       + (lastFastMs > 0 ? ", fast read " + lastFastMs + "ms" : "")
                       + ", " + watcher.metaCount() + " readings / " + watcher.closeCount() + " closes"
                       + ", " + lastPassMs + "ms " + (offMain ? "off" : "ON") + " main thread"
                       + (found ? (RaceReader.byContent ? ", read by NAMES" : ", read by ids") : "")
                       + (walked >= MAX_NODES ? ", CUT SHORT" : "") + "]";
                  MainActivity.js("RaceAuto.apps(\"" + esc(msg) + "\")");
              }

              /**
               * A handful of the things this screen actually SAYS.
               *
               * The decisive evidence when the board cannot be found: either the game's
               * words are in here - in which case it is readable and only the matching is
               * wrong - or they are not, and no amount of parser work will ever help
               * because the board is a drawing rather than a set of labels.
               */
              private static String textSample(String dump) {
                  if (dump == null || dump.length() == 0) return "none";
                  StringBuilder out = new StringBuilder();
                  int shown = 0;
                  String[] lines = dump.split("\n");
                  for (int i = 0; i < lines.length && shown < 18; i++) {
                      String t = between(lines[i], "TEXT=\"", "\"");
                      if (t == null || t.length() == 0) t = between(lines[i], "DESC=\"", "\"");
                      if (t == null) continue;
                      t = t.trim();
                      if (t.length() == 0 || t.length() > 22) continue;      // skip whole chat messages
                      if (out.indexOf("\"" + t + "\"") >= 0) continue;
                      out.append('"').append(t).append("\" ");
                      shown++;
                  }
                  return out.length() == 0 ? "(none — the board is drawn, not written)" : out.toString().trim();
              }

              private static String between(String s, String open, String close) {
                  int a = s.indexOf(open);
                  if (a < 0) return null;
                  a += open.length();
                  int b = s.indexOf(close, a);
                  return b < 0 ? null : s.substring(a, b);
              }

              /** A handful of the view names in this dump, for when none of them is the board. */
              private static String idSample(String dump) {
                  if (dump == null || dump.length() == 0) return "none";
                  StringBuilder out = new StringBuilder();
                  int shown = 0;
                  String[] lines = dump.split("\n");
                  for (int i = 0; i < lines.length && shown < 14; i++) {
                      int p = lines[i].indexOf("id=");
                      if (p < 0) continue;
                      int q = p + 3;
                      while (q < lines[i].length() && lines[i].charAt(q) != ' ') q++;
                      String vid = lines[i].substring(p + 3, q);
                      int slash = vid.lastIndexOf(":id/");
                      if (slash >= 0) vid = vid.substring(slash + 4);
                      if (vid.length() == 0 || out.indexOf(vid + ",") >= 0) continue;
                      out.append(vid).append(',');
                      shown++;
                  }
                  return out.length() == 0 ? "none" : out.substring(0, out.length() - 1);
              }

              /**
               * How much of a screen to read before giving up on this pass.
               *
               * WHY THERE IS A LIMIT AT ALL. Every getChild() is a call across into the
               * other app's process. A Chamet party screen is enormous - seats, gifts, the
               * member list, a live chat that never stops - and walking all of it several
               * times a second is what made the phone stutter. The betting board sits near
               * the top of that tree and is a few dozen nodes; the thousands underneath it
               * are chat messages nobody here cares about.
               *
               * THIS IS A BACKSTOP, NOT THE FIX. The fix is the pacing above - reading
               * rarely when there is nothing to read. A tight cap would be the wrong tool
               * here because the board may well sit at the END of the tree: it is drawn on
               * top of the party, and things drawn on top come last. Cutting the walk
               * short could therefore cut off the very thing being looked for.
               *
               * So it is set high enough never to fire on a real screen, and only exists
               * to stop a pathological tree locking the phone up. If it ever does fire it
               * says so in the diagnostic rather than silently returning half a screen.
               */
              private static final int MAX_NODES = 8000;
              private int walked = 0;
              /** How many windows the last pass looked at, and of what kinds. "It cannot
               *  see the screen" and "it saw the screen and the screen was empty" need
               *  opposite fixes and look identical from the outside. */
              private volatile int windowsSeen = 0;
              private final StringBuilder winTypes = new StringBuilder();
              public static String windowInfo() {
                  final WatchService s = instance;
                  if (s == null) return "";
                  return s.windowsSeen + " window" + (s.windowsSeen == 1 ? "" : "s")
                       + " (type " + s.winTypes.toString().trim() + ")";
              }

              /** Same one-line-per-node format RaceReader is written and tested against. */
              private void walk(AccessibilityNodeInfo n, StringBuilder sb) {
                  if (n == null || walked >= MAX_NODES) return;
                  walked++;
                  String id = n.getViewIdResourceName();
                  CharSequence text = n.getText();
                  // A view can say one thing on screen and another to a screen reader. The
                  // two hidden tracks draw "???" - if their real surface is anywhere, it is
                  // here, so the description is read as well as the text.
                  CharSequence desc = n.getContentDescription();

                  // A VIEW WITH NO RESOURCE ID WAS BEING THROWN AWAY, TEXT AND ALL.
                  //
                  // This recorded a node only `if (id != null)`. Every app built the
                  // ordinary way gives its views ids, so on Chamet that was invisible.
                  // ChillChat evidently does not: 138 views came back from a screen with
                  // the betting board plainly on it, and every name in them belonged to
                  // the party - partySeatChatMaskLayout, giftControlLayout, partyCover -
                  // with not one view from the game. The board was in the tree the whole
                  // time; its views simply have no ids, so the walk dropped them before
                  // anything downstream ever saw a word of them.
                  //
                  // Which also means the fallback I added last time - find the board by
                  // the vehicle names - never had a chance. It reads the dump, and the
                  // names were being discarded one step earlier. Fixing the parser while
                  // the walker was still throwing the evidence away.
                  //
                  // So a node is worth writing down if it has an id, OR something to say.
                  // Where there is no id, "-" stands in, because the parser finds its
                  // lines by looking for "id=" and a line without one is not read at all.
                  boolean says = (text != null && text.length() > 0)
                              || (desc != null && desc.length() > 0);
                  if (id != null || says) line(n, id, sb);
                  // the board's own views, kept for the fast lane
                  if (collecting != null && id != null) {
                      String sid = shortId(id);
                      if (BOARD_IDS.contains(sid)) {
                          try { collecting.add(AccessibilityNodeInfo.obtain(n)); collectingIds.add(sid); }
                          catch (Throwable ignored) { }
                      }
                  }
                  int kids = n.getChildCount();
                  for (int i = 0; i < kids && walked < MAX_NODES; i++) {
                      AccessibilityNodeInfo c = null;
                      try { c = n.getChild(i); } catch (Exception ignored) { }
                      if (c != null) { walk(c, sb); try { c.recycle(); } catch (Exception ignored) { } }
                  }
              }

              /**
               * One node as one line - the format RaceReader is written and tested against.
               * Shared by the full walk and the fast lane, so the two can never disagree
               * about what a view said.
               */
              private static void line(AccessibilityNodeInfo n, String id, StringBuilder sb) {
                  CharSequence text = n.getText();
                  CharSequence desc = n.getContentDescription();
                  sb.append("* id=").append(id == null ? "-" : id);
                  if (text != null && text.length() > 0) sb.append(" TEXT=\"").append(text).append('"');
                  if (desc != null && desc.length() > 0) sb.append(" DESC=\"").append(desc).append('"');
                  Rect r = new Rect();
                  n.getBoundsInScreen(r);
                  sb.append(" [").append(r.left).append(',').append(r.top)
                    .append('-').append(r.right).append(',').append(r.bottom).append("]\n");
              }

              // ---- what RaceWatcher decided ---------------------------------------

              @Override
              public void fillAndSpeak(List<String> cars, String road, int slot) {
                  String arr = arr(cars);
                  // fill first, then announce - the announcement reads the picks the fill
                  // produced, so speaking any earlier would voice the previous race
                  MainActivity.js("RaceAuto.fill(" + arr + ",\"" + esc(road) + "\"," + slot + ")");
                  MainActivity.js("RaceAuto.speak()");
              }

              /**
               * A reading of the market, with the moment it was read and the moment the
               * last second ticked.
               *
               * LATEST WINS. Readings can now arrive faster than a busy page runs them,
               * and queueing every one would hand the app a backlog of prices that have
               * already moved - the very lateness this is here to remove. So only one
               * reading is ever on its way; a newer one replaces it in the queue.
               */
              @Override
              public void raceMeta(List<String> odds, List<String> bets, List<String> signs, String countdown,
                                   long readAt, long tickAt) {
                  MainActivity.jsLatest("meta", "RaceAuto.meta(" + arr(odds) + "," + arr(bets) + "," + arr(signs)
                                + "," + RaceReader.seconds(countdown) + "," + readAt + "," + tickAt + ")");
              }

              /** The market the board closed on. Never replaced by a later call - it is sent once. */
              @Override
              public void marketClosed(List<String> odds, List<String> bets, int secs,
                                       long lastOpenAt, long closedAt, boolean fromClosingFrame) {
                  MainActivity.js("RaceAuto.closed(" + arr(odds) + "," + arr(bets) + "," + secs + ","
                                + lastOpenAt + "," + closedAt + "," + fromClosingFrame + ")");
              }

              @Override
              public void hiddenRoads(String a, String b) {
                  MainActivity.js("RaceAuto.hidden(\"" + esc(a) + "\",\"" + esc(b) + "\")");
              }

              /**
               * The game's Win Rate Rank screen, straight into the app's table.
               *
               * The margin goes across too. It is the app's evidence that these
               * eighteen numbers belong together: the game prices every vehicle to
               * keep about 2%, so a table read correctly comes back at ~0.98 and a
               * table mispaired off some other screen does not. The app shows it
               * rather than hiding it, because a number filled in for you should
               * arrive with its reason attached.
               */
              @Override
              public void rankTable(String js, int rows, double margin) {
                  MainActivity.js("RaceAuto.rank(" + js + "," + rows + "," + margin + ")");
              }

              @Override
              public void rankFailed(String why, int namesSeen, String screen) {
                  MainActivity.js("RaceAuto.rankFail(\"" + esc(why) + "\"," + namesSeen
                                + ",\"" + esc(screen).replace("\n", "\\n") + "\")");
              }

              /**
               * Take a picture of the screen and read the three road surfaces off it.
               *
               * The only way to get the two hidden surfaces: once the race starts Chamet
               * removes the track signs and draws the roads, so there is nothing to read
               * as text. Android 11 and up let an accessibility service screenshot the
               * display; below that this does nothing and the surfaces stay manual.
               *
               * Only the three average colours leave this method. No image is stored,
               * written anywhere, or sent anywhere.
               *
               * How many times to photograph one race, and how long to leave between.
               *
               * ONE SHOT WAS NOT ENOUGH, and that was the single biggest reason races came
               * back with only the road the board had already shown. The shot was taken on
               * the first frame after the betting board disappeared - the worst possible
               * moment. At that instant the vehicles are still bunched on the start line,
               * the start animation is playing over the track, and on a slower phone the
               * new screen may not have finished drawing at all. If that one frame failed,
               * the race was lost: there was no second attempt.
               *
               * FIVE SHOTS ON A TIMER WAS NOT ENOUGH EITHER. Android rate-limits
               * screenshots taken by an accessibility service and refuses one that comes
               * too soon after the last, with error code 3 - which is exactly what turned
               * up in the history, on shot 5 of 5. Five alarms set in advance do not stay
               * spaced: they are queued on the main thread, and while the page is busy
               * they bunch up and fire back to back the moment it frees, so several land
               * inside the rate limit and are thrown away.
               *
               * So the shots are CHAINED instead of scheduled. The next one is only booked
               * once the previous has come back, which keeps the gap real however busy the
               * phone gets. And the app is asked what it made of each picture, so a race
               * that reads on the first shot costs one screenshot rather than five.
               */
              private static final int TRACK_SHOTS = 5;
              private static final long TRACK_GAP_MS = 1400;   // how far apart two USEFUL looks should be

              /**
               * AND THE GAP THE PHONE ITSELF INSISTS ON, which is a different number and
               * not one that can be written down here.
               *
               * 1400ms was declared "comfortably past the rate limit" and on a real phone
               * it was not: the race log came back reading `screenshot refused, code 3` on
               * shot 3 of 5, then 3, then 4, then 5, five races running. Every refusal
               * burned one of the five attempts, so race after race finished having never
               * once photographed the track - and the two hidden surfaces, the entire
               * reason for taking a picture at all, were lost each time.
               *
               * The limit varies by Android version, by manufacturer and by how busy the
               * phone is, so ShotPacer learns it instead of assuming it, and a refusal is
               * retried rather than counted as one of the five.
               */
              private final ShotPacer pacer = new ShotPacer();
              /** attempts at ONE shot before giving up on it and reporting */
              private static final int SHOT_TRIES = 4;
              /** a race is only so long; stop chasing a picture of a screen that has gone */
              private static final long TRACK_WINDOW_MS = 25000;
              private volatile long grabDeadline = 0;

              /**
               * The chain runs on the reader thread, not the main one. A screenshot is
               * millions of pixels to scan, and doing that between two frames of the app's
               * own animation is what made scrolling stick.
               */
              private android.os.Handler grabHandler =
                  new android.os.Handler(android.os.Looper.getMainLooper());
              /** identifies the current race, so a late shot from the last one is dropped */
              private volatile int grabRun = 0;

              @Override
              public void grabTrack() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
                      MainActivity.js("RaceAuto.track(null,'needs Android 11 or newer')");
                      return;
                  }
                  grabRun++;
                  grabDeadline = SystemClock.elapsedRealtime() + TRACK_WINDOW_MS;
                  grabOnce(1, TRACK_SHOTS, grabRun, 1);
              }

              /**
               * Book the next photograph, unless the app has said it does not need one.
               *
               * "already read this race" is the app's way of saying it has what it needs;
               * anything else is a reason it could not use this picture, and is worth
               * another try while the track is still on screen.
               */
              private void nextShot(final String verdict, final int shot, final int of, final int run) {
                  if (shot >= of) return;
                  if (run != grabRun) return;                       // a new race has started
                  if (verdict != null && verdict.indexOf("already read") >= 0) return;
                  grabHandler.postDelayed(new Runnable() {
                      @Override public void run() { grabOnce(shot + 1, of, run, 1); }
                  }, TRACK_GAP_MS);
              }

              /** a window rectangle, short enough to read on a phone */
              private static String ps(Rect r) {
                  return "x " + r.left + "-" + r.right + ", y " + r.top + "-" + r.bottom;
              }

              /** One photograph. Harmless to repeat: the app keeps the first reading it accepts. */
              private void grabOnce(final int shot, final int of, final int run, final int tries) {
                  if (run != grabRun) return;

                  // ── ASK AT THE PACE THIS PHONE ALLOWS, rather than at the pace that
                  // seemed reasonable when this was written ──
                  final long now = SystemClock.elapsedRealtime();
                  if (now > grabDeadline) {
                      report(null, "the race finished before a picture came back", shot, of, run);
                      return;
                  }
                  long wait = pacer.waitFrom(now);
                  if (wait > 0) {
                      grabHandler.postDelayed(new Runnable() {
                          @Override public void run() { grabOnce(shot, of, run, tries); }
                      }, wait + 40);
                      return;
                  }
                  pacer.asked(now);

                  try {
                      // Hand the callback to the reader thread. `r.run()` here meant the
                      // pixel scan happened on whichever thread Android delivered it on -
                      // in practice the main one, which is the thread that draws.
                      Executor ex = new Executor() {
                          @Override public void execute(Runnable r) {
                              android.os.Handler h = reader;
                              if (h != null) h.post(r); else r.run();
                          }
                      };
                      takeScreenshot(android.view.Display.DEFAULT_DISPLAY, ex,
                          new AccessibilityService.TakeScreenshotCallback() {
                              @Override public void onSuccess(AccessibilityService.ScreenshotResult res) {
                                  Bitmap bmp = null;
                                  HardwareBuffer buf = null;
                                  pacer.worked();
                                  try {
                                      buf = res.getHardwareBuffer();
                                      bmp = Bitmap.wrapHardwareBuffer(buf, res.getColorSpace());
                                      if (bmp == null) { report(null, "could not read the screenshot", shot, of, run); return; }
                                      // a hardware bitmap cannot be read pixel by pixel
                                      final Bitmap soft = bmp.copy(Bitmap.Config.ARGB_8888, false);
                                      if (soft == null) { report(null, "could not copy the screenshot", shot, of, run); return; }
                                      final int w = soft.getWidth(), h = soft.getHeight();

                                      // ONLY THE GAME'S HALF OF THE SCREEN.
                                      //
                                      // takeScreenshot returns the whole display, and in
                                      // split screen half of that is THIS app. Its dark
                                      // background read as a road - the history showed a
                                      // "track" of (24,23,21) filling 100% of a band that
                                      // was nowhere near the game. Clipping to the window
                                      // the board was read from removes a whole class of
                                      // false readings rather than trying to tell them
                                      // apart afterwards.
                                      final Rect g = gameRect;
                                      final int cx = (g != null) ? Math.max(0, Math.min(g.left, w - 1)) : 0;
                                      final int cy = (g != null) ? Math.max(0, Math.min(g.top, h - 1)) : 0;
                                      final int cw = (g != null) ? Math.min(g.width(), w - cx) : w;
                                      final int ch = (g != null) ? Math.min(g.height(), h - cy) : h;
                                      final boolean clipped = (g != null && cw > 200 && ch > 400);
                                      lastClip = clipped ? (ps(g)) : null;
                                      final int ox = clipped ? cx : 0, oy = clipped ? cy : 0;
                                      final int vw = clipped ? cw : w, vh = clipped ? ch : h;

                                      // COPY OUT ONLY THAT HALF. This used to lift the
                                      // whole display into an int[] and then read half of
                                      // it - about ten megabytes allocated and thrown away
                                      // five times a race, on top of the bitmap it was
                                      // copied from. Asking the bitmap for the rectangle
                                      // that is actually wanted halves both.
                                      final int[] px = new int[vw * vh];
                                      soft.getPixels(px, 0, vw, ox, oy, vw, vh);
                                      soft.recycle();

                                      TrackReader.Read r = TrackReader.read(new TrackReader.Pixels() {
                                          public int width() { return vw; }
                                          public int height() { return vh; }
                                          public int rgb(int x, int y) { return px[y * vw + x] & 0xFFFFFF; }
                                      });
                                      report(r, r.why, shot, of, run);
                                  } catch (Throwable t) {
                                      report(null, "screenshot failed: " + t, shot, of, run);
                                  } finally {
                                      if (bmp != null) try { bmp.recycle(); } catch (Exception ignored) { }
                                      if (buf != null) try { buf.close(); } catch (Exception ignored) { }
                                  }
                              }
                              @Override public void onFailure(int errorCode) {
                                  // ── "YOU ASKED TOO SOON" IS NOT AN ANSWER ABOUT THE TRACK ──
                                  //
                                  // Code 3 means the request came inside Android's rate
                                  // limit. It says nothing whatsoever about what was on
                                  // screen, so counting it as one of the five attempts -
                                  // which is what used to happen - threw away a look at the
                                  // track as punishment for the bot's own impatience. Five
                                  // races in the log ended exactly that way.
                                  //
                                  // So the pacer is told, the gap goes up, and the SAME
                                  // shot is asked for again. The phone teaches it the right
                                  // pace within a race or two and then it stops happening.
                                  if (errorCode == 3) {
                                      pacer.refused();
                                      if (tries < SHOT_TRIES && SystemClock.elapsedRealtime() < grabDeadline) {
                                          grabHandler.postDelayed(new Runnable() {
                                              @Override public void run() { grabOnce(shot, of, run, tries + 1); }
                                          }, pacer.gap());
                                          return;
                                      }
                                      report(null, "the phone would not take a picture that soon, even at "
                                                 + pacer.gap() + "ms", shot, of, run);
                                      return;
                                  }
                                  report(null, "screenshot refused, code " + errorCode, shot, of, run);
                              }
                          });
                  } catch (Throwable t) {
                      report(null, "cannot screenshot: " + t, shot, of, run);
                  }
              }

              private void report(TrackReader.Read r, String why, final int shot, final int of, final int run) {
                  // Which attempt this was, so a run of failures can be told apart from a
                  // single unlucky frame when reading the history back.
                  final String when = " (shot " + shot + " of " + of + ")";
                  // What the app made of it decides whether to take another. Chaining off
                  // the ANSWER rather than off a timer is what keeps the gap between
                  // screenshots real when the phone is busy - and a busy phone bunching
                  // five timed shots together is how they ended up inside Android's rate
                  // limit and refused with code 3.
                  final android.webkit.ValueCallback<String> then =
                      new android.webkit.ValueCallback<String>() {
                          @Override public void onReceiveValue(String v) { nextShot(v, shot, of, run); }
                      };
                  if (r == null || !r.ok()) {
                      MainActivity.js("RaceAuto.track(null,\"" + esc((why == null ? "no track found" : why) + when)
                          + "\",\"" + esc(r == null ? "no picture taken" : "track search failed") + "\")", then);
                      return;
                  }
                  StringBuilder sb = new StringBuilder("[");
                  for (int i = 0; i < r.runs.size(); i++) {
                      TrackReader.Run s = r.runs.get(i);
                      if (i > 0) sb.append(',');
                      sb.append('[').append(s.r).append(',').append(s.g).append(',').append(s.b)
                        .append(',').append(s.yellow).append(',').append(s.dark)
                        .append(',').append(s.pct).append(']');
                  }
                  MainActivity.js("RaceAuto.track(" + sb.append(']') + ",\"\",\""
                      + esc("track found at y " + r.trackTop + "-" + r.trackBottom
                            + ", x " + r.trackLeft + "-" + r.trackRight
                            + (lastClip == null ? "  (whole screen)" : "  (inside " + lastClip + ")")
                            + when + "  [" + pacer.describe() + "]") + "\")", then);
              }

              @Override
              public void probe(String summary) {
                  MainActivity.js("RaceAuto.probe(\"" + esc(summary).replace("\n", "\\n") + "\")");
              }

              @Override
              public void logWinner(String winner) {
                  MainActivity.js("RaceAuto.log(\"" + esc(winner) + "\")");
              }

              /** a JS array literal from a list of strings */
              private static String arr(List<String> list) {
                  StringBuilder sb = new StringBuilder("[");
                  if (list != null) for (int i = 0; i < list.size(); i++) {
                      if (i > 0) sb.append(',');
                      sb.append('"').append(esc(list.get(i))).append('"');
                  }
                  return sb.append(']').toString();
              }

              private static String esc(String s) {
                  return s == null ? "" : s.replace("\\", "\\\\").replace("\"", "\\\"");
              }
          }
